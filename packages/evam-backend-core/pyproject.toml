[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evam-backend-core"
version = "0.1.0"
description = "Shared production-grade backend platform for PRISM services: logging, error contract, request correlation, bounded async DB pool + timeouts + transient-retry, optimistic-locking CRUD, keyset pagination, health probes and an app factory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-json-logger>=3.1",
    "orjson>=3.10",
]

[tool.hatch.build.targets.wheel]
packages = ["evam_backend_core"]
