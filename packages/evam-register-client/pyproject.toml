[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evam-register-client"
version = "0.1.0"
description = "Typed async/sync client for the PRISM Register. Built-in auth, idempotency, optimistic concurrency, transient-retry with backoff, keyset pagination, request-id correlation and vertical helpers (VOX / CIPHER / PULSE)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fastapi>=0.115", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["evam_register_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
