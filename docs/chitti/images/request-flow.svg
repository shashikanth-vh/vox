<text x="800.0" y="848.5" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#172b4d">Chitti validates all planned resources, filters, operations, and dependencies before execution reads</text>
