<text x="800.0" y="734.5" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#172b4d">EARLY EXIT: clarification required or out of scope → return via Gateway; skip stages 6–10</text>
