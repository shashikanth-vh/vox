<text x="800.0" y="1256.5" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#172b4d">9. Chitti constructs evidence: facts, rows, contributing records, missing values, and caveats</text>
