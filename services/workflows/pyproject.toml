[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism-workflows"
version = "0.1.0"
description = "PRISM workflow engine — Temporal workers that orchestrate durable, multi-step business processes; their activities write the Register through the shared client SDK."
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.7",
    "evam-backend-core",
    "evam-register-client",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "fastapi", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
