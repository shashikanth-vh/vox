[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism-workflows"
version = "0.1.0"
description = "PRISM workflow engine — Temporal workers that orchestrate durable, multi-step business processes; their activities write the Register through the shared client SDK."
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.7",
    "evam-backend-core",
    "evam-register-client",
    # The Orchestrator API (python -m app.api).
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "orjson==3.10.12",
    # The shared packages are installed with --no-deps in the Dockerfile, so THIS
    # service must declare every runtime dep it uses transitively through them:
    "httpx==0.28.1",              # orchestrator → Access/Temporal; oidc JWKS fetch
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",   # app.config
    "pyjwt[crypto]==2.10.1",      # evam_backend_core.oidc token verification
    "python-json-logger==3.2.1",  # structured logs
    "pypdf==5.1.0",               # CAM workbench: text extraction from PDF documents
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
