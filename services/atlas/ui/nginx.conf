server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS — needed because the proxied upstreams below are
    # resolved at request time, not at config load.
    resolver 127.0.0.11 ipv6=off valid=30s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed Vite assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Dex answers the password grant on :5556 but sends no CORS headers, so the
    # browser must stay same-origin. Mirrors the vite dev-server proxy.
    location /dex {
        set $dex_upstream "http://host.docker.internal:5556";
        proxy_pass $dex_upstream$request_uri;
        proxy_set_header Host host.docker.internal:5556;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Escape hatch for the Google refresh grant (only used when
    # VITE_GOOGLE_TOKEN_URL points back here).
    location /google-oauth/ {
        set $google_upstream "https://oauth2.googleapis.com";
        rewrite ^/google-oauth/(.*)$ /$1 break;
        proxy_pass $google_upstream;
        proxy_set_header Host oauth2.googleapis.com;
        proxy_ssl_server_name on;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA: react-router owns every other path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
