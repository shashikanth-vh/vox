<script>
/* ============================================================================
   AUGMENT 19 — TABLE PAGINATION (v14)
   Every grid-rendered register (Leads, Deals, Lending, Asset Mon, Clients,
   Audit, Activity Log) is paginated: 25 rows/page by default, numbered pages
   with Prev/Next, a per-table page-size picker (25/50/100/All) and a
   "rows X–Y of N · page P of Q" readout. Changing a column filter re-anchors
   to page 1; sorting keeps the page. Composes with the existing grid chain
   (Actions column + mobile detail sheets untouched — they index within the
   rendered page). Filter dropdowns still see ALL rows (GC restored below).
   ============================================================================ */
(function(){
'use strict';
var PGDEF=25;
var PREV_grid=grid;

window.gpage=function(id,p){var st=gstate(id);st.pg=Math.max(1,p|0);renderActive();};
window.gpsize=function(id,v){var st=gstate(id);st.ps=(v==='all'?0:(+v||PGDEF));st.pg=1;renderActive();};

function pnums(id,pg,pages){
  var els=[],last=0;
  for(var p=1;p<=pages;p++){
    if(!(p===1||p===pages||Math.abs(p-pg)<=1))continue;
    if(p-last>1)els.push('<span class="gpn dots">…</span>');
    els.push(p===pg?'<b class="gpn on">'+p+'</b>'
      :'<a class="gpn" onclick="gpage(\''+id+'\','+p+')">'+p+'</a>');
    last=p;
  }
  return els.join('');
}

grid=function(id,cols,rows,rowAttrs){
  var st=gstate(id);
  if(st.ps===undefined)st.ps=PGDEF;
  if(!st.pg)st.pg=1;
  /* replicate the baseline filter+sort so pages slice the VISIBLE order */
  var out=rows.filter(function(r){return cols.every(function(c){
    var f=st.f[c.k];if(!f)return true;
    var raw;try{raw=c.get(r);}catch(e){raw='';}
    var v=String(raw==null?'':raw);
    if(f.q&&v.toLowerCase().indexOf(f.q.toLowerCase())<0)return false;
    if(f.vals&&f.vals.length&&f.vals.indexOf(v)<0)return false;
    return true;});});
  if(st.sort){var sc=null;cols.forEach(function(x){if(x.k===st.sort.k)sc=x;});
    if(sc){var d=st.sort.dir;
      out=out.slice().sort(function(a,b){var x,y;
        try{x=sc.get(a);y=sc.get(b);}catch(e){x='';y='';}
        if(sc.type==='num'){x=num(x);y=num(y);}
        else{x=String(x==null?'':x).toLowerCase();y=String(y==null?'':y).toLowerCase();}
        return (x<y?-1:x>y?1:0)*d;});}}
  /* a filter change re-anchors to page 1 (sort keeps the page) */
  var sig=JSON.stringify(st.f);
  if(st._sig!==undefined&&st._sig!==sig)st.pg=1;
  st._sig=sig;
  var total=out.length,ps=st.ps||0;
  var pages=ps?Math.max(1,Math.ceil(total/ps)):1;
  if(st.pg>pages)st.pg=pages;
  var page=ps?out.slice((st.pg-1)*ps,st.pg*ps):out;
  var html=PREV_grid(id,cols,page,rowAttrs);
  if(GC[id])GC[id].rows=rows;          /* funnel dropdowns keep seeing ALL rows */
  var from=total?(ps?(st.pg-1)*ps+1:1):0, to=ps?Math.min(st.pg*ps,total):total;
  var info='rows <b>'+from+'–'+to+'</b> of <b>'+total+'</b>'
    +(total!==rows.length?' <span class="gpfilt">(filtered from '+rows.length+')</span>':'')
    +' · page <b>'+(total?st.pg:0)+'</b> of <b>'+(total?pages:0)+'</b>';
  var pager='<div class="gpager"><span class="gpinfo">'+info+'</span>'
    +'<span style="flex:1"></span>'
    +(pages>1
      ?'<a class="gpn nav'+(st.pg<=1?' dis':'')+'" onclick="gpage(\''+id+'\','+(st.pg-1)+')" title="Previous page">‹</a>'
       +pnums(id,st.pg,pages)
       +'<a class="gpn nav'+(st.pg>=pages?' dis':'')+'" onclick="gpage(\''+id+'\','+(st.pg+1)+')" title="Next page">›</a>'
      :'')
    +'<select class="gpsize" onchange="gpsize(\''+id+'\',this.value)" title="Rows per page">'
    +[10,25,50,100].map(function(n){return '<option value="'+n+'"'+(ps===n?' selected':'')+'>'+n+' / page</option>';}).join('')
    +'<option value="all"'+(ps===0?' selected':'')+'>All rows</option></select></div>';
  return html.replace(/<div class="count">[^<]*<\/div>/,pager);
};

var s=document.createElement('style');
s.textContent=
  '.gpager{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:8px 10px;'
 +'border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:#FAFBFC}'
 +'.gpinfo b{color:var(--ink)}'
 +'.gpfilt{color:var(--teal)}'
 +'.gpn{min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;'
 +'border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;'
 +'color:var(--ink);font-weight:600;font-size:12px;padding:0 6px;text-decoration:none;user-select:none}'
 +'a.gpn:hover{border-color:var(--teal-hi);box-shadow:0 0 0 3px rgba(18,145,126,.10)}'
 +'.gpn.on{background:var(--navy);border-color:var(--navy);color:#fff;cursor:default}'
 +'.gpn.dots{border:none;background:none;cursor:default;min-width:14px}'
 +'.gpn.nav.dis{opacity:.35;pointer-events:none}'
 +'.gpsize{border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:11.5px;'
 +'background:#fff;font-family:inherit;color:var(--ink)}'
 +'@media(max-width:760px){.gpager{gap:4px;padding:8px 6px}.gpinfo{flex-basis:100%;order:9}}';
document.head.appendChild(s);
})();
</script>
<script>
/* ============================================================================
   AUGMENT 20 — TODAY COLLAPSIBLE SECTIONS + LEANER MENU
   ----------------------------------------------------------------------------
   1) Today: every section (Follow-ups due, Contact staleness, Stage
      bottlenecks, Parked) becomes a collapsible card with its count on the
      header. RED + due sections start open; AMBER + parked start collapsed.
      Open/closed choice sticks for the session. Rows wrap cleanly on phones.
   2) Menu diet: 13 tabs -> 10. Combined by commonality:
        · Clients + FI Master + Employees  ->  🗂 Masters   (sub-switch inside)
        · Activity Log + Audit trail       ->  ≡ Activity   (sub-switch inside)
      Old deep-links (show('clients') etc.) transparently land on the right
      sub-tab. RBAC respected: a role only sees the sub-tabs it could see
      before. CSV/PDF export follows the selected sub-tab.
   ============================================================================ */
(function(){
'use strict';

/* ---------------- 1. Today: collapsible sections ---------------- */
window.TSEC=window.TSEC||{};                     /* section title -> open? (session) */
window.tsecTog=function(el,key){TSEC[key]=el.open;};
var PREV_vToday=vToday;
vToday=function(){
  var html=PREV_vToday();
  return html.replace(/<div class="today-col">([\s\S]*)<\/div>\s*$/,function(_,inner){
    var parts=inner.split(/<h3/);
    var head=parts.shift();
    var sec=[];
    parts.forEach(function(pc){
      var m=('<h3'+pc).match(/^<h3([^>]*)>([\s\S]*?)<\/h3>([\s\S]*)$/);
      if(!m){head+='<h3'+pc;return;}
      var key=m[2].replace(/<[^>]*>/g,'').replace(/\s*\(\d+\)\s*$/,'').trim();
      sec.push({attrs:m[1]||'',title:m[2],body:m[3],key:key,
        open:(key in TSEC)?TSEC[key]:/red|follow-ups|due/i.test(key)});
    });
    /* never land on a fully-folded page by DEFAULT — but respect the user's
       own choice if they explicitly folded sections themselves */
    var userChose=sec.some(function(s){return s.key in TSEC});
    if(sec.length&&!userChose&&!sec.some(function(s){return s.open}))sec[0].open=true;
    var secs=sec.map(function(s){
      return '<details class="tsec"'+(s.open?' open':'')
        +' ontoggle="tsecTog(this,\''+s.key.replace(/'/g,'')+'\')">'
        +'<summary'+s.attrs+'><span class="tsec-arr">▸</span>'+s.title+'</summary>'
        +'<div class="tsec-body">'+s.body+'</div></details>';
    }).join('');
    return '<div class="today-col">'+head+secs+'</div>';
  });
};

/* ---------------- 2. combined tabs ---------------- */
var M_SUBS=[['clients','👥 Clients'],['fi','🏦 FI Master'],['emp','🧑‍💼 Employees']];
var A_SUBS=[['reg','🕘 Activity Log'],['audit','📜 Audit trail']];
window.MSUB=window.MSUB||'clients';
window.ASUB=window.ASUB||'reg';

/* rebuild the tab bar: pull the five, add the two combined */
(function(){
  ['fi','clients','emp','audit','reg'].forEach(function(id){
    var i=TABS.findIndex(function(t){return t[0]===id}); if(i>-1)TABS.splice(i,1);
  });
  var ai=TABS.findIndex(function(t){return t[0]==='am'});
  TABS.splice(ai>-1?ai+1:TABS.length,0,
    ['masters','<span class="tabic">🗂</span>Masters'],
    ['act','<span class="tabic">🕘</span>Activity']);
  Object.keys(ROLE_TABS).forEach(function(r){
    var a=ROLE_TABS[r];
    if(a.some(function(t){return t==='fi'||t==='clients'||t==='emp'})&&a.indexOf('masters')<0)a.push('masters');
    if(a.some(function(t){return t==='audit'||t==='reg'})&&a.indexOf('act')<0)a.push('act');
  });
})();

function subsFor(tab){
  var list=(tab==='masters'?M_SUBS:A_SUBS).filter(function(s){return canSee(s[0])});
  return list.length?list:(tab==='masters'?M_SUBS.slice(0,1):A_SUBS.slice(0,1));
}
window.setSub=function(tab,id){if(tab==='masters')MSUB=id;else ASUB=id;renderActive();};

/* legacy deep-links land on the right sub-tab */
var PREV_show20=show;
show=function(k){
  if(k==='clients'||k==='fi'||k==='emp'){MSUB=k;k='masters';}
  else if(k==='audit'||k==='reg'){ASUB=k;k='act';}
  PREV_show20(k);
};

var VIEWS={clients:function(){return vClients()},fi:function(){return vFI()},
           emp:function(){return vEmp()},audit:function(){return vAudit()},
           reg:function(){return vReg()}};

var PREV_RA20=renderActive;
renderActive=function(){
  if(cur!=='masters'&&cur!=='act'){PREV_RA20();return;}
  var v=document.getElementById('main');if(!v)return;
  var subs=subsFor(cur);
  var sel=(cur==='masters')?MSUB:ASUB;
  if(!subs.some(function(s){return s[0]===sel}))sel=subs[0][0];
  if(cur==='masters')MSUB=sel;else ASUB=sel;
  var bar='<div class="subbar">'+subs.map(function(s){
    return '<button class="subtab'+(s[0]===sel?' on':'')
      +'" onclick="setSub(\''+cur+'\',\''+s[0]+'\')">'+s[1]+'</button>';}).join('')+'</div>';
  var body='';
  try{body=(VIEWS[sel]||function(){return ''})();}
  catch(e){body='<div class="empty">Could not render this view.</div>';}
  v.innerHTML=bar+body;
  try{var eb=document.createElement('div');eb.className='exportbar';
    eb.innerHTML='<span class="exp-lab">Export this view</span>'
      +'<button class="mini" onclick="pageExport(\'csv\')">⬇ CSV</button>'
      +'<button class="mini" onclick="pageExport(\'pdf\')">🖨 PDF</button>';
    v.insertBefore(eb,v.firstChild);}catch(e){}
};

/* exports follow the selected sub-tab */
var PREV_PX20=window.pageExport;
window.pageExport=function(kind){
  if(cur==='masters'||cur==='act'){
    var real=cur;cur=(real==='masters')?MSUB:ASUB;
    try{PREV_PX20(kind);}finally{cur=real;}
    return;
  }
  PREV_PX20(kind);
};

/* ---------------- styling ---------------- */
var s=document.createElement('style');
s.textContent=
  '.tsec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;box-shadow:var(--shadow-sm);overflow:hidden}'
 +'.tsec>summary{list-style:none;cursor:pointer;padding:11px 14px;font-size:13.6px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;user-select:none}'
 +'.tsec>summary::-webkit-details-marker{display:none}'
 +'.tsec>summary:hover{background:#F5F8F8}'
 +'.tsec-arr{display:inline-block;transition:transform .15s ease;color:var(--teal);font-size:12px}'
 +'.tsec[open] .tsec-arr{transform:rotate(90deg)}'
 +'.tsec-body{padding:2px 10px 10px}'
 +'.today-col h3{margin:0}'                       /* summaries carry old h3 text */
 +'.subbar{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}'
 +'.subtab{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 15px;font-size:12.6px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;white-space:nowrap}'
 +'.subtab.on{background:var(--navy);border-color:var(--navy);color:#fff}'
 +'.subtab:hover:not(.on){border-color:var(--teal-hi)}'
 +'@media(max-width:760px){'
 +'.tsec>summary{padding:12px 12px;font-size:13.2px}'
 +'.tsec-body .chline{flex-wrap:wrap;row-gap:4px}'
 +'.tsec-body .chline .hint{flex-basis:100%;order:5;white-space:normal}'
 +'.tsec-body .chline .mini{margin-left:auto}'
 +'.subtab{padding:8px 14px}'
 +'}';
document.head.appendChild(s);
try{renderTabs();}catch(e){}
try{if(cur==='masters'||cur==='act')renderActive();}catch(e){}
})();
</script>
<script>
/* ============================================================================
   AUGMENT 21 — MASTERS PAGINATION (incl. card view) + CLICKABLE MATRIX
   ----------------------------------------------------------------------------
   1) Page-size pickers everywhere now start at 10 (10/25/50/100/All).
   2) FI Master & Employees inside Masters get pagination in BOTH modes:
      table rows and detail cards page through the same 10/25/50/100/All
      picker (Clients already paginates via the shared grid engine).
   3) The syndication matrix is writable again — clicking a circle opens a
      state chooser (all seven lender statuses, colour-coded, plus "remove
      outreach"). NOTHING changes until ✓ Confirm is pressed; Cancel or a
      click elsewhere walks away. Changes flow through the chase-list model
      (lSet / lenders[]), so the matrix, chase list and register stay in sync,
      and every confirmed change is audited. Management stays read-only.
   ============================================================================ */
(function(){
'use strict';

/* ---------------- 2. DOM paginator for the Masters sub-views ------------- */
function pagerHtml(key,pg,pages,from,to,total,ps){
  var nums='',last=0;
  for(var p=1;p<=pages;p++){
    if(!(p===1||p===pages||Math.abs(p-pg)<=1))continue;
    if(p-last>1)nums+='<span class="gpn dots">…</span>';
    nums+=(p===pg?'<b class="gpn on">'+p+'</b>'
      :'<a class="gpn" onclick="gpage(\''+key+'\','+p+')">'+p+'</a>');
    last=p;
  }
  return '<div class="gpager"><span class="gpinfo">rows <b>'+from+'–'+to+'</b> of <b>'+total
    +'</b> · page <b>'+(total?pg:0)+'</b> of <b>'+(total?pages:0)+'</b></span>'
    +'<span style="flex:1"></span>'
    +(pages>1
      ?'<a class="gpn nav'+(pg<=1?' dis':'')+'" onclick="gpage(\''+key+'\','+(pg-1)+')">‹</a>'+nums
       +'<a class="gpn nav'+(pg>=pages?' dis':'')+'" onclick="gpage(\''+key+'\','+(pg+1)+')">›</a>'
      :'')
    +'<select class="gpsize" onchange="gpsize(\''+key+'\',this.value)" title="Rows per page">'
    +[10,25,50,100].map(function(n){return '<option value="'+n+'"'+(ps===n?' selected':'')+'>'+n+' / page</option>';}).join('')
    +'<option value="all"'+(ps===0?' selected':'')+'>All rows</option></select></div>';
}

function domPaginate(items,key,anchorEl){
  var st=gstate(key);
  if(st.ps===undefined)st.ps=10;
  if(!st.pg)st.pg=1;
  var total=items.length,ps=st.ps||0;
  var pages=ps?Math.max(1,Math.ceil(total/ps)):1;
  if(st.pg>pages)st.pg=pages;
  var lo=ps?(st.pg-1)*ps:0, hi=ps?st.pg*ps:total;
  items.forEach(function(el,i){el.style.display=(i>=lo&&i<hi)?'':'none';});
  var from=total?lo+1:0, to=Math.min(hi,total);
  var d=document.createElement('div');
  d.innerHTML=pagerHtml(key,st.pg,pages,from,to,total,ps);
  anchorEl.insertAdjacentElement('afterend',d.firstChild);
}

var PREV_RA21=renderActive;
renderActive=function(){
  PREV_RA21();
  try{
    if(cur!=='masters')return;
    var m=document.getElementById('main');if(!m)return;
    if(m.querySelector('.gpager'))return;            /* Clients grid already has one */
    var tb=m.querySelector('table.grid tbody');
    if(tb){                                          /* FI / Emp table mode */
      var key='m_'+MSUB+'_t';
      domPaginate([].slice.call(tb.querySelectorAll('tr')),key,tb.closest('table'));
      return;
    }
    var cards=[].slice.call(m.querySelectorAll('details.chco'));
    if(cards.length){                                /* FI / Emp card mode */
      domPaginate(cards,'m_'+MSUB+'_c',cards[cards.length-1]);
    }
  }catch(e){}
};

/* ---------------- 3. clickable matrix with confirm ---------------------- */
mCycle=function(code,lender){
  if(!writeOK())return;                              /* Management = read-only */
  closePop();
  var e=findL(code,lender);
  var cur=(e&&!e.ex&&e.st)||'';
  var p=document.createElement('div');p.className='pop mpop';p.id='pop';
  p.innerHTML='<div class="mpop-h">'+esc((client(code)||{}).name||code)
    +'<div class="hint">'+esc(lender)+(cur?' · now: <b>'+esc(cur)+'</b>':' · no outreach yet')+'</div></div>'
   +'<div class="vals" style="max-height:200px">'
   +LSTATES.map(function(st){
      return '<label><input type="radio" name="mst" value="'+esc(st)+'"'+(st===cur?' checked':'')
        +'> <span class="dotc s'+(ST2DOT[st]||1)+'" style="width:12px;height:12px;display:inline-block;vertical-align:-1px"></span> '
        +esc(st)+'</label>';}).join('')
   +(cur?'<label style="color:var(--bad)"><input type="radio" name="mst" value="__rm"> ✕ Remove outreach (clear the dot)</label>':'')
   +'</div>'
   +'<div class="prow"><button class="secondary" onclick="closePop()">Cancel</button>'
   +'<button class="primary" onclick="mConfirm(\''+esc(code)+'\',\''+esc(lender).replace(/'/g,"\\'")+'\')">✓ Confirm change</button></div>';
  document.body.appendChild(p);
  var ev=window.event,r=(ev&&ev.target&&ev.target.getBoundingClientRect)?ev.target.getBoundingClientRect():{bottom:innerHeight/2,left:innerWidth/2-120};
  p.style.top=Math.min(r.bottom+6,Math.max(8,innerHeight-360))+'px';
  p.style.left=Math.min(Math.max(8,r.left-100),Math.max(8,innerWidth-260))+'px';

<script>
/* ============================================================================
   AUGMENT 25 — CHASE LIST + ASSET MON SEARCH
   ----------------------------------------------------------------------------
   · Chase List (Syndication): a filter box above the cards matches FIRM or
     BANK. A firm hit shows the whole card; a bank hit shows the card opened
     with only that bank's rows visible. The "Needs attention" strip filters
     too. Pure DOM filtering — typing never re-renders, so focus never jumps.
   · Asset Monetisation: a search box in the toolbar matches firm name, group
     code, investor/bank, investor type, deal type, or state. Feeds the grid
     BEFORE pagination, so page counts stay truthful.
   ============================================================================ */
(function(){
'use strict';
window.CHQ=window.CHQ||'';
window.AMQ=window.AMQ||'';

/* ---- Asset Mon: pre-filter the register before the pagination chain ---- */
var PREV_grid25=grid;
grid=function(id,cols,rows,rowAttrs){
  if(id==='am'&&AMQ&&AMQ.trim()){
    var q=AMQ.toLowerCase().trim();
    rows=rows.filter(function(r){
      var c=client(r.code)||{};
      return [(c.name||''),r.code,r.inv,r.itype,r.dtype,r.state,r.nature]
        .some(function(v){return String(v||'').toLowerCase().indexOf(q)>-1;});
    });
  }
  return PREV_grid25(id,cols,rows,rowAttrs);
};

/* ---- Chase list: DOM filter (firm OR bank) ---- */
window.chaseApply=function(){
  var m=document.getElementById('main');if(!m)return;
  var q=(CHQ||'').toLowerCase().trim();
  m.querySelectorAll('.att-body .att-row').forEach(function(r){
    r.style.display=(!q||r.textContent.toLowerCase().indexOf(q)>-1)?'':'none';
  });
  var vis=0;
  m.querySelectorAll('.chase-list details.chco').forEach(function(card){
    var lines=[].slice.call(card.querySelectorAll('.chline'));
    if(!q){card.style.display='';lines.forEach(function(l){l.style.display='';});return;}
    var sum=(card.querySelector('summary')||{textContent:''}).textContent.toLowerCase();
    var firmHit=sum.indexOf(q)>-1, bankHit=false;
    lines.forEach(function(l){
      if(l.classList.contains('addl')){l.style.display=firmHit?'':'none';return;}
      var hit=l.textContent.toLowerCase().indexOf(q)>-1;
      if(hit)bankHit=true;
      l.style.display=(firmHit||hit)?'':'none';
    });
    var show=firmHit||bankHit;
    card.style.display=show?'':'none';
    if(show)vis++;
    if(bankHit&&!firmHit)card.open=true;
  });
  var cnt=document.getElementById('ch-cnt');
  if(cnt)cnt.textContent=q?(vis+' firm'+(vis===1?'':'s')+' match'):'';
};

/* ---- inject the two inputs after each render ---- */
var PREV_RA25=renderActive;
renderActive=function(){
  PREV_RA25();
  try{
    var m=document.getElementById('main');if(!m)return;
    if(cur==='syn'&&typeof SYNMODE!=='undefined'&&SYNMODE==='chase'){
      if(!document.getElementById('ch-q')){
        var anchor=m.querySelector('.att-strip')||m.querySelector('.chase-list');
        if(anchor){
          var bar=document.createElement('div');bar.className='ch-qbar';
          bar.innerHTML='<span class="nr-fqwrap" style="flex:1 1 280px;max-width:360px">'
            +'<input id="ch-q" placeholder="⌕ Filter chase list — firm or bank…">'
            +'</span><span class="hint" id="ch-cnt"></span>';
          anchor.parentNode.insertBefore(bar,anchor);
          var inp=bar.querySelector('#ch-q');inp.value=CHQ;
          inp.oninput=function(){CHQ=this.value;chaseApply();};
        }
      }
      chaseApply();
    }
    if(cur==='am'&&!document.getElementById('am-q')){
      var tb=m.querySelector('.toolbar');
      if(tb){
        var sp=document.createElement('span');sp.className='nr-fqwrap am-qwrap';
        sp.innerHTML='<input id="am-q" placeholder="⌕ Search — firm / bank / investor…">';
        tb.insertBefore(sp,tb.firstChild);
        var i2=sp.querySelector('input');i2.value=AMQ;
        i2.oninput=function(){
          var pos=this.selectionStart;AMQ=this.value;renderActive();
          var e2=document.getElementById('am-q');
          if(e2){e2.focus();try{e2.setSelectionRange(pos,pos);}catch(_){}}
        };
      }
    }
  }catch(e){}
};

var s=document.createElement('style');
s.textContent=
  '.ch-qbar{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}'
 +'.am-qwrap{flex:0 1 280px;min-width:170px;margin-right:8px}'
 +'@media(max-width:760px){.ch-qbar .nr-fqwrap{flex:1 1 100%;max-width:none!important}'
 +'.am-qwrap{flex:1 1 100%;margin-right:0;margin-bottom:6px}}';
document.head.appendChild(s);
})();

<script>
/* ============================================================================
   AUGMENT 26 — RBAC v2.1 (ATLAS v15)
   ----------------------------------------------------------------------------
   Implements ATLAS_Views_v2.1.xlsx + ATLAS_Forms_Validations_v2.1.xlsx:
   · 10 roles (Employee.Role, multi-role stacking): Admin, Management,
     BD Head, BDRM, Credit Head, Deal Analyst, Syn Head, Syn RM, AM Head, AM RM.
     Legacy roles migrate automatically (Admin→Admin+Management, RM→BDRM,
     Analyst→Deal Analyst, Ops→AM RM).
   · View access per the matrix (Leads = BD only; Dashboard = Mgmt/Admin/Heads;
     Clients = Heads+Mgmt/Admin; Audit + Activity Log = ADMIN ONLY — Management
     is explicitly excluded; Tools = all).
   · Operation gates per the operations matrix — every mutation checks can(op)
     and explains which roles may do it. Management now has FULL write
     (the old view-only Management gate is retired); Admin-only: delete,
     backup/restore. Matrix/chase writes = Syn Head / Syn RM (+ Admin/Mgmt).
   · Form & field rules: no silent amount defaults (PtD Lending/Syn, Add
     product); State mandatory at Push; Source-detail mandatory for
     DSA/Referral/Event leads; Company + BDRM-reassign locks on the lead
     drawer; Lending amount locks after Sanction (Admin/Mgmt only);
     Sanctioned lenders required to mark a syndication Sanctioned; amount
     required to move past Deal Sourced; sanction date stamped on Sanction.
   · Reference lists v2.1: Tenor de-overlapped, Pending With expanded,
     Lender/Investor Types split, Source list, Vistaar Journey, Employee.Role.
     BDRM / Deal Analyst dropdowns are DYNAMIC from Employees (no hardcoding).
   ============================================================================ */
(function(){
'use strict';

/* ---------------- roles & migration ---------------- */
window.ROLES_V21=['Admin','Management','BD Head','BDRM','Credit Head','Deal Analyst','Syn Head','Syn RM','AM Head','AM RM'];
var LEGACY={'Admin':['Admin','Management'],'Management':['Management'],'RM':['BDRM'],
            'Analyst':['Deal Analyst'],'Ops':['AM RM']};
window.rolesOf=function(u){u=u||USER||{};return u.roles&&u.roles.length?u.roles:(LEGACY[u.role]||['Deal Analyst']);};
window.hasRole=function(){var rs=rolesOf(USER);for(var i=0;i<arguments.length;i++)if(rs.indexOf(arguments[i])>-1)return true;return false;};

function refreshRoleLists(){
  var act=function(p){return !p.inactive};
  var by=function(role){return S.people.filter(function(p){return act(p)&&rolesOf(p).indexOf(role)>-1}).map(function(p){return p.name});};
  var bd=by('BDRM'),an=by('Deal Analyst');
  if(bd.length)S.ref['RM']=bd;            /* dynamic — spec: no hardcoded names */
  if(an.length)S.ref['Analyst']=an;
  S.ref['Syn RM']=by('Syn RM');S.ref['AM RM']=by('AM RM');
}
(function migrate(){
  (S.people||[]).forEach(function(p){if(!p.roles)p.roles=(LEGACY[p.role]||['Deal Analyst']).slice();});
  /* v2.1 reference lists */
  S.ref['Tenor']=['<12m','12-24m','24-36m','36-60m','>60m'];
  S.ref['Pending With']=['Client','Lender','BDRM','Deal Analyst','Syn RM','AM RM','Credit Committee','Legal','CFO'];
  S.ref['Source']=['BDRM','DSA','Inbound','Referral','Event','Other'];
  S.ref['Lender Types']=['Bank','NBFC','DFI','AIF / Fund','Multilateral','Other'];
  S.ref['Investor Types']=['Strategic','Financial Investor','Family Office','Corporate','Advisor','Other'];
  S.ref['Vistaar Journey']=['Prospect','Engaged','Documented','Under Review','Committed','Live','Wound Down'];
  S.ref['Employee.Role']=ROLES_V21.slice();
  refreshRoleLists();
})();

/* ---------------- operation permissions (Operations sheet) ---------------- */
var ALL=ROLES_V21;
var OPS={
  addLead:      ['Admin','Management','BD Head','BDRM'],
  editLead:     ['Admin','Management','BD Head','BDRM'],
  reassignLead: ['Admin','Management','BD Head'],
  push:         ['Admin','Management','BD Head','BDRM'],
  createClient: ['Admin','Management'],
  editDealProfile:['Admin','Management','BD Head','BDRM'],
  editOwnership:['Admin','Management','BD Head'],
  assignAnalyst:['Admin','Management','Credit Head'],
  addProduct:   ['Admin','Management','BD Head','BDRM','Credit Head','Syn Head','AM Head'],
  lendStage:    ['Admin','Management','Credit Head','Deal Analyst'],
  lendEdit:     ['Admin','Management','Credit Head','Deal Analyst'],
  synEdit:      ['Admin','Management','Syn Head','Syn RM','Deal Analyst'],
  lender:       ['Admin','Management','Syn Head','Syn RM'],
  amEdit:       ['Admin','Management','AM Head','AM RM','Deal Analyst'],
  note:         ALL, interaction: ALL, docs: ALL, snooze: ALL, csv: ALL, news: ALL,
  fiEdit:       ['Admin','Management','Syn Head'],
  empEdit:      ['Admin','Management'],
  del:          ['Admin'],
  request:      ['BD Head','BDRM','Deal Analyst','Syn RM','AM RM'],
  approve:      ['Admin','Management','BD Head','Credit Head','Syn Head','AM Head'],
  backup:       ['Admin']
};
window.can=function(op){var a=OPS[op];return !a||hasRole.apply(null,a);};
window.gateOp=function(op,label){
  if(can(op))return true;
  toast((label||'This action')+' — allowed for: '+(OPS[op]||[]).join(' / '));
  return false;
};

/* Management is no longer view-only — fine-grained gates replace writeOK */
writeOK=function(){return true;};
document.body.classList.remove('rolegate');
var P_setUser=setUser;
setUser=function(n){P_setUser(n);document.body.classList.remove('rolegate');};

/* ---------------- view access (View access sheet) ---------------- */
var HEADS=['BD Head','Credit Head','Syn Head','AM Head'];
var VT={};

<script>
/* ============================================================================
   AUGMENT 27 — v16 REVIEW PACK
   ----------------------------------------------------------------------------
   · Global terminology: "Syndication" → "Platform Deals" across the rendered
     UI (tabs, headers, hints, tables, drawers, modals). Internal data values
     and stored records are untouched — dropdown options keep their original
     value attribute so logic and saved data never break.
   · Matrix editable again: clicking a circle ADVANCES its state directly
     (colour changes on click, cycling none → Identified → IM → Queries →
     Sanctioned → Declined → clear). Flows through the chase-list lender
     model so chase/matrix/register stay in sync; audited; RBAC still applies
     (Syn Head / Syn RM / Mgmt / Admin).
   ============================================================================ */
(function(){
'use strict';

/* ---------------- Syndication → Platform Deals (display layer) ---------------- */
function renameNode(root){
  try{
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
    var n;
    while((n=w.nextNode())){
      var p=n.parentNode,tag=p&&p.tagName;
      if(tag==='SCRIPT'||tag==='STYLE'||tag==='TEXTAREA')continue;
      if(n.nodeValue.indexOf('yndication')<0)continue;
      if(tag==='OPTION'&&!p.hasAttribute('value'))p.setAttribute('value',p.value);
      n.nodeValue=n.nodeValue.replace(/Syndication/g,'Platform Deals')
                             .replace(/syndication/g,'platform deals');
    }
    if(root.querySelectorAll)root.querySelectorAll('[placeholder],[title]').forEach(function(el){
      ['placeholder','title'].forEach(function(a){
        var v=el.getAttribute(a);
        if(v&&v.indexOf('yndication')>-1)
          el.setAttribute(a,v.replace(/Syndication/g,'Platform Deals').replace(/syndication/g,'platform deals'));
      });
    });
  }catch(e){}
}
window.renamePD=function(){renameNode(document.body);};

var P_RA27=renderActive;
renderActive=function(){P_RA27();renamePD();};
var P_RT27=renderTabs;
renderTabs=function(){P_RT27();renamePD();};
var P_OM27=openModal;
openModal=function(){var r=P_OM27.apply(this,arguments);renamePD();return r;};
var P_OD27=window.openDrawerHtml;
if(typeof P_OD27==='function')openDrawerHtml=function(){var r=P_OD27.apply(this,arguments);renamePD();return r;};
renamePD();

/* ---------------- matrix: click advances the state directly ---------------- */
var TIER2ST={1:'Identified',2:'IM Circulated',3:'Queries Received',4:'Sanctioned',5:'Declined'};
mCycle=function(code,lender){
  if(typeof gateOp==='function'&&!gateOp('lender','Matrix state change'))return;
  var e=findL(code,lender);
  var cur=(e&&!e.ex&&e.st)?(ST2DOT[e.st]||1):0;
  var next=(cur+1)%6;
  var nm=(client(code)||{}).name||code;
  if(next===0){
    if(e){e.ex=true;audit('Lender outreach removed',code,lender);}
  }else{
    var st=TIER2ST[next];
    if(e){
      if(e.ex)e.ex=false;
      var before=e.st;e.st=st;e.since=today();e.resp=today();
      (e.h=e.h||[]).push({st:st,t:today(),by:roleName()});
      audit('Lender status',code,lender+': '+(before||'—')+' → '+st);
    }else{
      var row=S.syn.find(function(x){return x.code===code});
      if(!row){toast('No Platform Deals row for this company');return;}
      (row.lenders=row.lenders||[]).push({name:lender,st:st,since:today(),
        h:[{st:st,t:today(),by:roleName()}]});
      audit('Lender added',code,lender+' → '+st);
    }
  }
  syncMatrixFromLenders();renderActive();
  stamp(nm+' · '+lender+' → '+(next===0?'cleared':TIER2ST[next]));
};

/* small style for the paired-chart card titles */
var s=document.createElement('style');
s.textContent='.v4-subttl{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--teal);margin:0 0 8px}';
document.head.appendChild(s);
})();
</script>
<script>
/* ============================================================================
   AUGMENT 28 — MIS WORKBOOK AS THE REGISTER (ATLAS v17)
   ----------------------------------------------------------------------------
   Source of truth: MIS/Evam_ATLAS_MIS_Consolidated_v4.xlsx (served by
   atlas_serve.py at /api/mis/*). On load, the six sheets (Leads, Deals,
   Lending Tracker, Syndication, Asset Mon, Mandate Tracker) REPLACE the demo
   registers. Every audited change writes back to the SAME sheets (debounced,
   with a timestamped backup kept server-side). Columns ATLAS doesn't model
   round-trip untouched. Falls back to local data when the server or the
   file is unavailable (file://, Netlify, openpyxl missing).
   ============================================================================ */
(function(){
'use strict';
window.MIS_ON=false;
var HDRS={},RAW_MAND=null,SUPPRESS=false,SAVE_T=null,LAST='';

/* ---------------- helpers ---------------- */
function full(short){var p=(S.people||[]).find(function(x){return x.name===short});return p?p.full:short;}
function short(fullName){
  var p=(S.people||[]).find(function(x){return x.full===fullName||x.name===fullName});
  if(p)return p.name;
  return fullName||'';
}
function anShort(raw){                       /* 'AT' / 'BS' initials -> person */
  raw=String(raw||'').trim();if(!raw)return '';
  var p=(S.people||[]).find(function(x){return x.name===raw||x.full===raw});
  if(p)return p.name;
  if(/^[A-Z]{2,3}$/.test(raw)){
    p=(S.people||[]).find(function(x){
      var ini=(x.full||'').split(/\s+/).map(function(w){return w[0]||''}).join('').toUpperCase();
      return ini===raw||ini.split('').reverse().join('')===raw;});
    if(p)return p.name;
  }
  return raw;
}
var LENS_BY_SECTOR={'Water & Waste Management':'Adaptation','Agri / Drone & related':'Adaptation'};
function lensFor(sector,given){return given||LENS_BY_SECTOR[sector]||'Mitigation';}
var ST_IN={'IM Circulated':'IM Circulated','IM Sent':'IM Circulated','IM under preparation':'Identified',
  'Rejected':'Declined','IP received':'IP Received','Queries Received':'Queries Received',
  'Final sanction received':'Sanctioned','Sanctioned':'Sanctioned','Docs Pending':'Docs Pending',
  'Disbursed':'Sanctioned','Identified':'Identified'};
var ST_OUT={'IM Circulated':'IM Circulated','Identified':'IM under preparation','Declined':'Rejected',
  'IP Received':'IP received','Queries Received':'Queries Received','Sanctioned':'Final sanction received',
  'Docs Pending':'Docs Pending'};
var PROP_RANK=['Deal Sourced','IM in Prep','IM Circulated','Queries Received','IP Received','Sanctioned'];
var L2P={'Identified':'IM in Prep','IM Circulated':'IM Circulated','Docs Pending':'IM Circulated',
  'Queries Received':'Queries Received','IP Received':'IP Received','Sanctioned':'Sanctioned'};
function sheetObjs(sh){
  var H=sh.header;
  return sh.rows.map(function(r){var o={};H.forEach(function(h,i){o[h]=(r[i]==null?'':r[i]);});return o;});
}
function S8(v){return v==null?'':String(v);}

/* ---------------- IMPORT: sheets -> registers ---------------- */
function misImport(data){
  HDRS={};Object.keys(data.sheets).forEach(function(k){HDRS[k]=data.sheets[k].header;});
  var codeBy={},usedNames=[];
  function codeFor(name){
    var k=normName(name);
    if(codeBy[k])return codeBy[k];
    var b=k.toUpperCase().slice(0,10)||'CLIENT',c=b,i=2;
    while(usedNames.indexOf(c)>-1)c=b+(i++);
    usedNames.push(c);codeBy[k]=c;return c;
  }
  var clients={},deals=[],leads=[],lending=[],syn=[],am=[];

  /* Deals sheet -> clients + deals */
  sheetObjs(data.sheets['Deals']||{header:[],rows:[]}).forEach(function(o){
    var nm=S8(o['Company Name']).trim();if(!nm)return;
    var code=codeFor(nm);
    if(!clients[code])clients[code]={name:nm,sector:S8(o['Sector']),lens:lensFor(S8(o['Sector'])),
      state:S8(o['Location']),about:'',notes:'',toi:''};
    deals.push({code:code,rm:short(S8(o['RM'])),an:'',
      lend:/^y/i.test(S8(o['Lending?'])),syn:/^y/i.test(S8(o['Syndication?'])),am:/^y/i.test(S8(o['Asset Mon?'])),
      temp:S8(o['Status']),source:S8(o['Source']),sourceDetail:S8(o['Source Detail']),
      createdAt:S8(o['Date Received']).slice(0,10)||null,remarks:S8(o['Remarks']),
      misStage:S8(o['Stage']),x:{'Contact Person':S8(o['Contact Person']),'Contact Phone':S8(o['Contact Phone'])}});
  });

  /* Leads sheet */
  var n=0;
  sheetObjs(data.sheets['Leads']||{header:[],rows:[]}).forEach(function(o){
    var nm=S8(o['Company Name']).trim();if(!nm)return;n++;
    leads.push({id:'LD-'+String(n).padStart(3,'0'),company:nm,sector:S8(o['Sector']),
      lens:lensFor(S8(o['Sector']),S8(o['Mitigation / Adaptation'])),
      source:S8(o['Source']),sourceDetail:S8(o['Source Detail']),rm:short(S8(o['RM Owner'])),
      status:'Active',temp:S8(o['Status'])||'Warm',contact:S8(o['Contact Person']),
      phone:S8(o['Contact Phone']),last:S8(o['Last Interaction Date']).slice(0,10)||null,
      next:S8(o['Next Action']),nextDate:S8(o['Next Action Date']).slice(0,10)||null,
      conv:'',createdAt:null,notes:S8(o['Notes']),x:{'Designation':S8(o['Designation'])}});
  });

  /* Lending Tracker */
  var li=0;
  sheetObjs(data.sheets['Lending Tracker']||{header:[],rows:[]}).forEach(function(o){
    var nm=S8(o['Company Name']).trim();if(!nm)return;li++;
    var code=codeFor(nm);
    if(!clients[code])clients[code]={name:nm,sector:'',lens:'Mitigation',state:'',about:'',notes:'',toi:''};
    var stage=S8(o['Stage'])||'Data Awaited',upd=S8(o['Stage Updated']).slice(0,10)||null;
    lending.push({id:'L'+String(li).padStart(3,'0'),code:code,amt:+S8(o['Lending Amount (₹ Cr)'])||0,
      rm:short(S8(o['RM'])),an:anShort(S8(o['Credit Analyst'])),misAn:S8(o['Credit Analyst']),
      stage:stage,updated:upd,sanc:(['Sanctioned','Documentation','Disbursed'].indexOf(stage)>-1?upd:null),
      remarks:S8(o['Remarks']),pendingWith:'',h:[{stage:stage,t:upd||today(),by:'MIS'}],createdAt:null});
  });

  /* Syndication sheet: rows per company x bank -> grouped syn rows */
  var groups={},order=[],bankSeen={};
  sheetObjs(data.sheets['Syndication']||{header:[],rows:[]}).forEach(function(o){
    var nm=S8(o['Company Name']).trim();if(!nm)return;
    var k=normName(nm);
    if(!groups[k]){groups[k]={nm:nm,rows:[]};order.push(k);}
    groups[k].rows.push(o);
    var bk=S8(o['Bank']).trim();if(bk)bankSeen[bk]=1;
  });
  var si=0;
  order.forEach(function(k){
    var g=groups[k];si++;
    var code=codeFor(g.nm);
    if(!clients[code])clients[code]={name:g.nm,sector:'',lens:'Mitigation',state:'',about:'',notes:'',toi:''};
    var lenders=[],amt=0,dealStat='';
    g.rows.forEach(function(o){
      amt=Math.max(amt,+S8(o['Amount (₹ Cr)'])||0);
      dealStat=S8(o['Deal Status'])||dealStat;
      var bk=S8(o['Bank']).trim();if(!bk)return;
      lenders.push({name:bk,st:ST_IN[S8(o['Status'])]||'Identified',mis_st:S8(o['Status']),
        since:null,resp:null,h:[],x:{'Accepted by Client':S8(o['Accepted by Client']),'Remarks':S8(o['Remarks'])}});
    });
    var status='Deal Sourced';
    if(/dropped/i.test(dealStat))status='Dropped';
    else if(/closed/i.test(dealStat))status='Disbursed';
    else lenders.forEach(function(l){var p2=L2P[l.st];
      if(p2&&PROP_RANK.indexOf(p2)>PROP_RANK.indexOf(status))status=p2;});
    syn.push({id:'S'+String(si).padStart(3,'0'),code:code,toi:'',rm:'',an:'',lc:'',pri:'',
      status:status,misDeal:dealStat,amt:amt,line:'',fac:'',tenor:'',mstat:'',pot:'',im:'',
      sancL:'',ipL:'',h:[],lenders:lenders});
  });

  /* Asset Mon */
  var ai=0;
  sheetObjs(data.sheets['Asset Mon']||{header:[],rows:[]}).forEach(function(o){
    var nm=S8(o['Company Name']).trim();if(!nm)return;ai++;
    var code=codeFor(nm);
    if(!clients[code])clients[code]={name:nm,sector:'',lens:'Mitigation',state:S8(o['State']),about:'',notes:'',toi:''};
    var x={};HDRS['Asset Mon'].forEach(function(h){
      if(['Company Name','RM','State','Indicative Value (₹ Cr)','Size (MW)','Nature','Deal Type',
          'Investor','Investor Type','Status','Date Teaser Shared','Notes'].indexOf(h)<0)x[h]=S8(o[h]);});
    am.push({id:'A'+String(ai).padStart(3,'0'),code:code,rm:short(S8(o['RM'])),state:S8(o['State']),
      val:+S8(o['Indicative Value (₹ Cr)'])||0,mw:+S8(o['Size (MW)'])||0,nature:S8(o['Nature']),
      dtype:S8(o['Deal Type']),inv:S8(o['Investor']),itype:S8(o['Investor Type']),
      status:S8(o['Status'])||'In Discussion',teaser:S8(o['Date Teaser Shared']).slice(0,10)||null,
      notes:S8(o['Notes']),x:x});
  });

  /* Mandate Tracker: kept verbatim + merged onto syn rows for display */
  RAW_MAND=data.sheets['Mandate Tracker']||{header:[],rows:[]};
  sheetObjs(RAW_MAND).forEach(function(o){
    var r=syn.find(function(x){return normName((clients[x.code]||{}).name||'')===normName(S8(o['Company Name']))});
    if(r)r.mstat=/signed/i.test(S8(o['Signed/Pending']))?'Executed'
      :(/^sent/i.test(S8(o['Mandate Sent/Not Sent']))?'Sent - pending signature':'To be sent by Evam');
  });

  /* commit: replace registers, keep ATLAS-only stores (audit, notes, news…) */
  S.clients=clients;S.deals=deals;S.leads=leads;S.lending=lending;S.syn=syn;S.am=am;
  /* FI master + matrix columns follow the MIS banks */
  var banks=Object.keys(bankSeen).sort();
  banks.forEach(function(b2){
    if(!(S.lenders||[]).some(function(l){return l.name.toLowerCase()===b2.toLowerCase()}))
      S.lenders.push({name:b2,type:'',short:'',active:'Yes',sectors:'',notes:''});
  });
  if(banks.length)S.lenderOrder=banks;
  /* ref lists learn MIS vocabulary */
  var addRef=function(list,v){if(v&&S.ref[list]&&S.ref[list].indexOf(v)<0)S.ref[list].push(v);};
  deals.concat(leads).forEach(function(r){addRef('Sector',r.sector);addRef('Source',r.source);});
  /* Tools Config sheet -> settings + per-firm news watch terms */
  S.toolsCfg=S.toolsCfg||{recipients:'',subjectPrefix:'ATLAS',adverseOnly:false};
  var tc=data.sheets['Tools Config'];
  if(tc){
    var watch={};
    sheetObjs(tc).forEach(function(o){
      var k=S8(o['Setting']).trim(),v=S8(o['Value']);
      if(!k)return;
      if(k==='Email recipients')S.toolsCfg.recipients=v;
      else if(k==='Email subject prefix')S.toolsCfg.subjectPrefix=v||'ATLAS';
      else if(k==='Adverse only (all-firms digest)')S.toolsCfg.adverseOnly=/^y/i.test(v);
      else if(k.indexOf('Watch terms · ')===0){
        var code=k.slice('Watch terms · '.length).trim();
        var terms=v.split(/[,;]/).map(function(t){return t.trim()}).filter(Boolean);
        if(code&&terms.length)watch[code]=terms;
      }
    });
    if(Object.keys(watch).length)S.newswatch=watch;
  }
  S.misLoadedAt=new Date().toISOString();
}

/* ---------------- EXPORT: registers -> sheets ---------------- */
function rowFor(H,map,x){return H.map(function(h){return (h in map)?map[h]:((x&&h in x)?x[h]:'');});}
function misExport(){
  var sheets={};
  var name=function(code){return (client(code)||{}).name||code;};
  sheets['Leads']={header:HDRS['Leads'],rows:S.leads.map(function(l){
    return rowFor(HDRS['Leads'],{'Source':l.source,'Source Detail':l.sourceDetail,'RM Owner':full(l.rm),
      'Sector':l.sector,'Mitigation / Adaptation':l.lens,'Company Name':l.company,
      'Status':(l.status==='Converted'?'Converted':(l.temp||'')),'Contact Person':l.contact,
      'Contact Phone':l.phone,'Last Interaction Date':l.last||'','Next Action':l.next||'',
      'Next Action Date':l.nextDate||'','Notes':l.notes||''},l.x);})};
  sheets['Deals']={header:HDRS['Deals'],rows:S.deals.map(function(d){
    var c=client(d.code)||{};
    return rowFor(HDRS['Deals'],{'Company Name':c.name||d.code,'Sector':c.sector||'','Location':c.state||'',
      'Source':d.source||'','Source Detail':d.sourceDetail||'','Status':d.temp||'','RM':full(d.rm),
      'Lending?':d.lend?'Yes':'No','Syndication?':d.syn?'Yes':'No','Asset Mon?':d.am?'Yes':'No',
      'Stage':d.misStage||'','Date Received':d.createdAt||'','Remarks':d.remarks||''},d.x);})};
  sheets['Lending Tracker']={header:HDRS['Lending Tracker'],rows:S.lending.map(function(r){
    var an=(r.an&&r.an!==anShort(r.misAn||''))?r.an:(r.misAn||r.an||'');
    return rowFor(HDRS['Lending Tracker'],{'Company Name':name(r.code),'Lending Amount (₹ Cr)':r.amt,
      'RM':full(r.rm),'Credit Analyst':an,'Stage':r.stage,'Stage Updated':r.updated||'',
      'Remarks':r.remarks||''});})};
  var synRows=[];
  S.syn.forEach(function(r){
    var ds=(r.status==='Dropped')?'Deal Dropped'
      :(SYN_CLOSED.indexOf(r.status)>-1?'Deal Closed':(r.misDeal&&!/dropped|closed/i.test(r.misDeal)?r.misDeal:'Deal Live'));
    var Ls=(r.lenders||[]).filter(function(l){return !l.ex;});
    if(!Ls.length){synRows.push(rowFor(HDRS['Syndication'],{'Company Name':name(r.code),'Deal Status':ds,
      'Bank':'','Status':'','Amount (₹ Cr)':r.amt}));return;}
    Ls.forEach(function(l){
      var stOut=(ST_IN[l.mis_st||'']===l.st)?(l.mis_st):(ST_OUT[l.st]||l.st);
      synRows.push(rowFor(HDRS['Syndication'],{'Company Name':name(r.code),'Deal Status':ds,'Bank':l.name,
        'Status':stOut,'Amount (₹ Cr)':r.amt},l.x));});
  });
  sheets['Syndication']={header:HDRS['Syndication'],rows:synRows};
  sheets['Asset Mon']={header:HDRS['Asset Mon'],rows:S.am.map(function(a){
    return rowFor(HDRS['Asset Mon'],{'Company Name':name(a.code),'RM':full(a.rm||''),'State':a.state||'',
      'Indicative Value (₹ Cr)':a.val,'Size (MW)':a.mw||'','Nature':a.nature||'','Deal Type':a.dtype||'',
      'Investor':a.inv||'','Investor Type':a.itype||'','Status':a.status||'',
      'Date Teaser Shared':a.teaser||'','Notes':a.notes||''},a.x);})};
  if(RAW_MAND)sheets['Mandate Tracker']=RAW_MAND;
  /* Tools Config — settings + news watch terms live in the MIS too */
  var cfgRows=[
    ['Email recipients',(S.toolsCfg&&S.toolsCfg.recipients)||'','Prefills every email / digest / schedule dialog'],
    ['Email subject prefix',(S.toolsCfg&&S.toolsCfg.subjectPrefix)||'ATLAS','Digest subject lines start with this'],
    ['Adverse only (all-firms digest)',(S.toolsCfg&&S.toolsCfg.adverseOnly)?'Yes':'No','Default for the all-firms digest']
  ];
  Object.keys(S.newswatch||{}).sort().forEach(function(code){
    var t=(S.newswatch[code]||[]).join(', ');
    if(t)cfgRows.push(['Watch terms · '+code,t,'News Radar owner / promoter terms for '+(((client(code)||{}).name)||code)]);
  });
  sheets['Tools Config']={header:['Setting','Value','Notes'],rows:cfgRows};
  return sheets;
}

function misStamp(txt,bad){
  var el=document.getElementById('misInd');
  if(!el){el=document.createElement('span');el.id='misInd';
    var si=document.getElementById('saveInd');
    if(si&&si.parentNode)si.parentNode.insertBefore(el,si);else document.body.appendChild(el);}
  el.textContent=txt;el.className=bad?'bad':'ok';
}
window.misPush=function(){
  if(!MIS_ON){toast('MIS is not linked');return;}
  var act=(S.misPendingAct||[]).slice();
  var body;try{body=JSON.stringify({sheets:misExport(),activity:act});}
  catch(e){misStamp('MIS ✗ export error',1);return;}
  misStamp('MIS … saving');
  fetch('/api/mis/save',{method:'POST',headers:{'Content-Type':'application/json'},body:body})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j.ok){
        LAST=body;
        SUPPRESS=true;
        /* keep any changes audited while this save was in flight */
        S.misPendingAct=(S.misPendingAct||[]).slice(act.length);
        S.misDirty=S.misPendingAct.length>0;
        P_save();
        SUPPRESS=false;
        misStamp('MIS ✓ saved '+new Date().toTimeString().slice(0,5));
        misBars();stamp('Written to the MIS (backup + Activity log updated)');
      }else{misStamp('MIS ✗ not saved',1);toast(j.message||'MIS save failed');}
    }).catch(function(){misStamp('MIS ✗ offline — will keep your changes locally',1);});
};

/* audit() calls save(); capture each audited change for the Activity sheet

  if(MIS_ON&&!SUPPRESS){

    (S.misPendingAct=S.misPendingAct||[]).push({t:now(),by:roleName(),act:act,code:code||'',detail:String(detail||'').slice(0,400)});
    if(S.misPendingAct.length>500)S.misPendingAct.shift();

<script>
/* ============================================================================
 * vox_integration.js — VOM inside ATLAS (field-intel edition).
 *
 * Drop into ATLAS with one line before </body>:  <script src="vox_integration.js">
 *
 * ATLAS stays the system of record. This module adds:
 *   • a round teal mic button in the ATLAS header (desktop) and a draggable
 *     floating mic (mobile) — unchanged launchers;
 *   • a full-screen VOM capture app (the "EVAM · FIELD INTEL" experience):
 *       Record  →  Transcribe (Whisper) + read (Claude Haiku)  →  an editable
 *       field-intel call report  →  File to ATLAS (logs the interaction and, if a
 *       follow-up was discussed, schedules a Google Calendar event with proper
 *       content)  →  Reports (the field log of past captures).
 *
 * The backend (same-origin /api/vox/*) is the Python VOX server mounted into
 * atlas_serve.py. Override the base with  window.VOX_API = "http://host:port"
 * in a script that loads before this file.
 * ========================================================================== */
(function () {
  "use strict";
  var API = (window.VOX_API || "").replace(/\/$/, "");
  var CAPS = null, gConnected = null;

  // capture/session state
  var rec = null, chunks = [], timerId = 0, seconds = 0;
  var audioCtx = null, analyser = null, rafId = 0, mediaStream = null;
  var reports = [];          // in-session field log (newest first)
  var cur = null;            // the report currently open in the detail view
  var view = "record";       // record | processing | report | reports

  var MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>' +
    '<path d="M6 11a6 6 0 0 0 12 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' +
    '<line x1="12" y1="17" x2="12" y2="20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' +
    '<line x1="8.5" y1="20.5" x2="15.5" y2="20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  var BRAND_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<rect x="2" y="2" width="20" height="20" rx="6" fill="#0d7377"/>' +
    '<rect x="10" y="6" width="4" height="8" rx="2" fill="#2fe3a6"/>' +
    '<path d="M8 12a4 4 0 0 0 8 0" stroke="#2fe3a6" stroke-width="1.4" stroke-linecap="round"/>' +
    '<line x1="12" y1="16" x2="12" y2="18" stroke="#2fe3a6" stroke-width="1.4" stroke-linecap="round"/></svg>';

  // ---- tiny helpers -------------------------------------------------------
  function api(path, opts) {
    return fetch(API + path, opts).then(function (r) {
      return r.json().then(function (j) { return { status: r.status, body: j }; });
    });
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function attr(s) { return esc(s).replace(/'/g, "&#39;"); }
  function $(id) { return document.getElementById(id); }
  function _user() { try { return (typeof USER !== "undefined" && USER) ? USER : null; } catch (e) { return null; } }
  function rm() { var u = _user(); return (u && (u.name || u.full)) || "RM"; }
  function email() { var u = _user(); return (u && (u.email || u.mail)) || (rm().toLowerCase().replace(/\s+/g, ".") + "@evamfinance.com"); }
  function isRM() { var u = _user(); return !(u && u.role === "Management"); }
  function ddmmyy(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
    return m ? m[3] + "-" + m[2] + "-" + m[1].slice(2) : (iso || "");
  }
  function ago(iso) {
    var t = Date.parse(iso); if (isNaN(t)) return "";
    var s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return "less than a minute ago";
    if (s < 3600) return Math.floor(s / 60) + " min ago";

  // The live register ATLAS is showing, sent so the backend resolves against
  // exactly what the RM sees (no snapshot drift, correct LD-V## minting).
  function buildEntities() {
    var clients = {};
    Object.keys((typeof S !== "undefined" && S.clients) || {}).forEach(function (code) {
      var c = S.clients[code];
      clients[code] = { name: c.name, sector: c.sector, lens: c.lens };
    });
    var leads = ((typeof S !== "undefined" && S.leads) || []).filter(function (l) { return l.status === "Active"; })
      .map(function (l) { return { id: l.id, company: l.company, rm: l.rm, status: l.status, sector: l.sector, lens: l.lens }; });
    var deals = ((typeof S !== "undefined" && S.deals) || []).map(function (d) { return { code: d.code, rm: d.rm }; });
    return { clients: clients, leads: leads, deals: deals, voxAliases: (typeof S !== "undefined" && S.voxAliases) || {} };
  }
  function searchEntities(q) {
    q = (q || "").trim().toLowerCase();
    if (q.length < 2 || typeof S === "undefined") return [];
    var out = [];
    Object.keys(S.clients || {}).forEach(function (code) {
      var v = S.clients[code];
      if ((v.name || "").toLowerCase().indexOf(q) >= 0) out.push({ code: code, name: v.name, kind: "client" });
    });
    (S.leads || []).forEach(function (l) {
      if ((l.status === "Active") && (l.company || "").toLowerCase().indexOf(q) >= 0)
        out.push({ code: l.id, name: l.company, kind: "lead" });
    });
    return out.slice(0, 8);
  }

  function toggleRec() {
    if (rec && rec.state === "recording") { rec.stop(); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      mediaStream = stream; chunks = []; seconds = 0;
      rec = new MediaRecorder(stream);
      rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
      rec.onstop = function () { finishRecording(); };
      rec.start();
      var mic = $("voxMic"); if (mic) mic.classList.add("live");
      var mw = document.querySelector(".vx-micwrap"); if (mw) mw.classList.add("live");
      var t = $("voxTimer"); if (t) t.classList.add("on");
      var h = $("voxHint"); if (h) h.textContent = "Recording… tap the mic to stop.";
      timerId = setInterval(function () {
        seconds++; var el = $("voxTimer"); if (el) el.textContent = mmss(seconds);
        if (seconds >= 90 && rec && rec.state === "recording") rec.stop();  // 90s cap
      }, 1000);
      startWave(stream);
    }).catch(function () {
      var h = $("voxHint"); if (h) h.innerHTML = "Microphone unavailable — use <b>Type instead</b>.";
    });
  }
  function finishRecording() {
    clearInterval(timerId); timerId = 0;
    stopWave();
    if (mediaStream) { mediaStream.getTracks().forEach(function (t) { t.stop(); }); mediaStream = null; }
    var dur = seconds;
    var blob = new Blob(chunks, { type: (rec && rec.mimeType) || "audio/webm" });
    go("processing");
    var fr = new FileReader();
    fr.onload = function () {
      var b64 = String(fr.result).split(",")[1];
      var audioUrl = URL.createObjectURL(blob);
      sendCapture({ audio_b64: b64 }, { audioUrl: audioUrl, durationSec: dur });
    };
    fr.readAsDataURL(blob);
  }
  function stopRecording(silent) {
    try { if (rec && rec.state === "recording") { if (silent) rec.onstop = null; rec.stop(); } } catch (e) {}
    clearInterval(timerId); timerId = 0; stopWave();
    if (mediaStream) { try { mediaStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} mediaStream = null; }
  }

  // live waveform inside the mic ring
  function startWave(stream) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
      src.connect(analyser);
      var canvas = $("voxWave"); if (!canvas) return;
      var ctx = canvas.getContext("2d"), data = new Uint8Array(analyser.frequencyBinCount);
      (function draw() {
        rafId = requestAnimationFrame(draw);
        analyser.getByteFrequencyData(data);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var cx = canvas.width / 2, cy = canvas.height / 2, n = 48, base = 74;
        for (var i = 0; i < n; i++) {
          var v = data[i % data.length] / 255;
          var a = (i / n) * Math.PI * 2, len = 8 + v * 34;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a) * base, cy + Math.sin(a) * base);
          ctx.lineTo(cx + Math.cos(a) * (base + len), cy + Math.sin(a) * (base + len));
          ctx.strokeStyle = "rgba(47,227,166," + (0.35 + v * 0.6) + ")";
          ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.stroke();
        }
      })();
    } catch (e) {}
  }
  function stopWave() {
    if (rafId) cancelAnimationFrame(rafId); rafId = 0;
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
    analyser = null;
    var canvas = $("voxWave"); if (canvas) { var c = canvas.getContext("2d"); c.clearRect(0, 0, canvas.width, canvas.height); }
  }

  function sendCapture(payload, meta) {
    payload.rm = rm();
    payload.entities = buildEntities();
    payload.capture_ts = new Date().toISOString().slice(0, 19);
    api("/api/vox/capture", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
    }).then(function (r) {
      if (r.status !== 200) { stopProc(); fail(r.body && r.body.error); return; }
      var res = r.body;
      var transcript = (res.transcription && res.transcription.text) || meta.transcriptText || "";
      cur = {
        id: uid(), createdAt: new Date().toISOString(), rm: rm(), lang: "EN",
        durationSec: meta.durationSec || 0, status: "READY",
        extraction: res.extraction, transcript: transcript,
        preview: res, audioUrl: meta.audioUrl || null, filed: false, fileResult: null
      };
      reports.unshift(cur);
      // If the resolver confidently matched an EXISTING company whose canonical
      // name differs from what was heard, correct the heard spelling to the ATLAS
      // name across the whole report (summary, key intel, transcript, …) up front —
      // so a mis-hearing never lingers once the entity is known.
      var em0 = (res.extraction && res.extraction.entity_match) || {};
      if (em0.code && em0.needs_approval === false && !em0.is_new_lead && em0.canonical_name) {
        reconcileName(heardForms(), em0.canonical_name);

      finishProc(function () { go("report"); });   // tick all steps done, then reveal
    }).catch(function (e) { stopProc(); fail(String(e)); });
  }

  // --- dynamic templates for Additional details (business line + sector) ---

  function activeTemplates() { var ids = activeTplIds(); return _templates().filter(function (t) { return ids.indexOf(t.id) >= 0; }); }

    var r = rep(), removed = r._removed || [], fields = [];

  }

  /* ======================================================================

  function renderGChip() {

        if (b.calendar_email) html += '<p class="vx-muted">If your follow-ups seem missing, open Google Calendar signed in as <b>' + esc(b.calendar_email) + '</b> (top-right account switcher) — that’s the calendar VOM writes to.</p>';

  function checkGoogle() {   // refresh connection status + all UI that depends on it
    if (!CAPS || CAPS.google_configured === false) { renderGChip(); updNmNote(); return; }
    api("/api/vox/auth/status?rm=" + encodeURIComponent(rm())).then(function (r) {
      gConnected = r.body && r.body.connected; renderGChip(); if ($("voxNmNote")) updNmNote();
    }).catch(function () { renderGChip(); if ($("voxNmNote")) updNmNote(); });
  }
  var _gPoll = null, _gWin = null, _pendingApprove = false;
  function connectGoogle() {
    // Don't stack auth tabs: if one is already open and being polled, just nudge.
    if (_gPoll) {
      if (_gWin && !_gWin.closed) { try { _gWin.focus(); } catch (e) {} }
      flash($("voxFileMsg"), "Finish the Google sign-in in the other tab — VOM will pick it up automatically.", "muted");
      return;
    }
    api("/api/vox/auth/start?rm=" + encodeURIComponent(rm())).then(function (rr) {
      if (rr.status === 200 && rr.body.url) { _gWin = window.open(rr.body.url, "_blank"); pollGoogle(); }
      else flash($("voxFileMsg"), "Google Calendar isn't set up on the server yet.", "warn");
    });
  }
  // After the OAuth tab opens, watch for the connection to complete so the RM
  // never has to click "Connect" twice. Polls status; stops on success/timeout.
  function pollGoogle() {
    if (_gPoll) clearInterval(_gPoll);
    var tries = 0;
    _gPoll = setInterval(function () {
      tries++;
      if (tries > 90) { clearInterval(_gPoll); _gPoll = null; return; }   // ~3 min cap
      api("/api/vox/auth/status?rm=" + encodeURIComponent(rm())).then(function (r) {
        if (r.body && r.body.connected) { clearInterval(_gPoll); _gPoll = null; onGoogleConnected(); }
      }).catch(function () {});
    }, 2000);
  }
  function onGoogleConnected() {
    gConnected = true; renderGChip(); if ($("voxNmNote")) updNmNote();
    try { if (_gWin && !_gWin.closed) _gWin.close(); } catch (e) {}
    _gWin = null;
    if (_pendingApprove) {          // the RM already pressed Approve — finish it for them
      _pendingApprove = false;
      flash($("voxFileMsg"), "✓ Google connected — filing now…", "ok");
      fileToAtlas();
    } else {
      flash($("voxFileMsg"), "✓ Google Calendar connected — press Approve to schedule.", "ok");
    }
  }
  // Belt-and-suspenders: when the RM switches back to this tab after signing in,
  // re-check immediately instead of waiting for the next poll tick.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && _gPoll && CAPS && CAPS.google_configured && !gConnected) {
      api("/api/vox/auth/status?rm=" + encodeURIComponent(rm())).then(function (r) {
        if (r.body && r.body.connected) { clearInterval(_gPoll); _gPoll = null; onGoogleConnected(); }
      }).catch(function () {});
    }
  });

  /* ======================================================================
   *  FILE TO ATLAS  (entity resolve → commit → merge into S → calendar)
   * ==================================================================== */
  function fileToAtlas() {
    // Scheduling every follow-up to Google Calendar is mandatory. If the server
    // has Google set up but this RM hasn't connected, require the connect first.
    var fu = followups();
    if (fu.length && CAPS && CAPS.google_configured && !gConnected) {
      _pendingApprove = true;   // remember the RM wants to file; auto-continue once connected
      flash($("voxFileMsg"), "Connect Google Calendar to schedule " + fu.length + " follow-up" + (fu.length > 1 ? "s" : "") + " — VOM will file automatically once you're signed in.", "warn");
      connectGoogle();
      return;
    }
    // The interaction must land on the right register with a real entity. When the
    // RM links an existing company, we re-render so they can see the corrected name
    // before the final Approve.
    if (!entityReady()) {
      pickEntity(function () { renderReport(); flash($("voxFileMsg"), "Linked to " + esc(targetLabel()) + ". Review, then press Approve to log.", "ok"); });
      return;
    }
    proceedAfterEntity();
  }

  // Fields worth having before a capture is logged. Not hard-required — the RM can
  // approve anyway, but we surface what's blank so nothing is missed silently.
  var REQUIRED = [["title", "Client name"], ["sector", "Sector"], ["loan_product", "Loan product"],
                  ["ticket_size", "Ticket size"], ["pipeline_stage", "Pipeline stage"]];
  function missingRequired() {
    var r = rep();
    return REQUIRED.filter(function (f) { return !(r[f[0]] && String(r[f[0]]).trim()); }).map(function (f) { return f[1]; });
  }
  function missingTemplateFields() {
    var extra = rep().extra || {};
    return activeTplFields().filter(function (f) { return !(extra[f.key] && String(extra[f.key]).trim()); }).map(function (f) { return f.label; });
  }
  function proceedAfterEntity() {
    var missBase = missingRequired(), missTpl = missingTemplateFields();
    if (missBase.length || missTpl.length) { confirmMissing(missBase, missTpl); return; }
    commit();
  }
  function confirmMissing(missBase, missTpl) {
    var body = '<div class="vx-modal"><div class="vx-modal-h">Some fields are blank</div>';
    if (missBase.length) body += '<p class="vx-muted">Key details not filled:</p><ul class="vx-misslist">' + missBase.map(function (m) { return "<li>" + esc(m) + "</li>"; }).join("") + '</ul>';
    if (missTpl.length) body += '<p class="vx-muted">Template fields still blank (optional):</p><ul class="vx-misslist tpl">' + missTpl.map(function (m) { return "<li>" + esc(m) + "</li>"; }).join("") + '</ul>';
    body += '<p class="vx-muted">Approve anyway, or go back and fill them in Additional details.</p>' +
      '<div class="vx-modal-f"><button class="vx-btn green" id="voxMissGo">Approve anyway</button>' +
      '<button class="vx-btn ghost" id="voxMissBack">Go back &amp; fill</button></div></div>';
    overlay(body);
    $("voxMissGo").onclick = function () { closeOverlay(); commit(); };
    $("voxMissBack").onclick = function () {
      closeOverlay();
      var b = $("voxDetailsBody"), t = $("voxDetailsToggle");
      if (b && b.style.display === "none") { b.style.display = "block"; if (t) t.classList.add("open"); }
      if (t) t.scrollIntoView({ behavior: "smooth", block: "center" });
    };
  }

  // Replace mis-heard name(s) with the canonical one across the whole report
  // (title, summary, key intel, nuances, next steps, transcript, attendees).
  // oldNames may be a single string or a list (spoken forms / aliases / a typo).
  function reconcileName(oldNames, newName) {
    newName = (newName || "").trim(); if (!newName) return false;
    var olds = (Array.isArray(oldNames) ? oldNames : [oldNames])
      .map(function (s) { return (s || "").trim(); })
      .filter(function (s) { return s.length >= 3 && s.toLowerCase() !== newName.toLowerCase(); });
    olds = olds.filter(function (v, i) { return olds.indexOf(v) === i; }).sort(function (a, b) { return b.length - a.length; });
    if (!olds.length) return false;
    var re = new RegExp(olds.map(function (o) { return o.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|"), "gi");
    var fix = function (s) { return typeof s === "string" ? s.replace(re, newName) : s; };
    var r = rep();
    r.title = fix(r.title) || newName;   // patch in place (keeps any descriptive suffix)
    r.summary = fix(r.summary);
    r.transcript_english = fix(r.transcript_english);
    r.key_intel = (r.key_intel || []).map(fix);
    r.nuances = (r.nuances || []).map(fix);
    r.next_steps = (r.next_steps || []).map(function (s) { return { owner: s.owner, action: fix(s.action), date: s.date }; });
    (r.attendees || []).forEach(function (a) { if (a.company) a.company = fix(a.company); });
    if (cur.transcript) cur.transcript = fix(cur.transcript);
    if (cur.extraction) cur.extraction.company_mentioned = newName;
    return true;
  }
  // Every spoken/heard form of the company Whisper produced, so a link corrects
  // all of them (the mis-heard spelling is often an alias, not the title).
  function heardForms() {
    var e = cur.extraction || {};
    var forms = [e.company_mentioned].concat(e.company_aliases_heard || []);
    if (rep().title) forms.push(rep().title);
    return forms;
  }
  function openNameFix() {
    var r = rep();
    overlay('<div class="vx-modal"><div class="vx-modal-h">Fix a mis-heard name</div>' +
      '<p class="vx-muted">Whisper sometimes mis-hears a company or person. Replace the wrong spelling with the correct one everywhere in this report — summary, key intel, next steps and transcript.</p>' +
      '<div class="vx-flab">Heard as (wrong)</div><input id="voxFixFrom" class="vx-inp" placeholder="e.g. Alanipur">' +
      '<div class="vx-flab">Correct name</div><input id="voxFixTo" class="vx-inp" value="' + attr(r.title || "") + '">' +
      '<div class="vx-modal-f"><button class="vx-btn green" id="voxFixGo">Replace everywhere</button>' +
      '<button class="vx-btn ghost" id="voxFixCancel">Cancel</button></div></div>');
    $("voxFixCancel").onclick = closeOverlay;
    $("voxFixGo").onclick = function () {
      var from = (($("voxFixFrom") || {}).value || "").trim(), to = (($("voxFixTo") || {}).value || "").trim();
      if (!from || !to) return;
      var ok = reconcileName([from], to);
      closeOverlay(); renderReport();
      flash($("voxFileMsg"), ok ? ("Replaced “" + esc(from) + "” with “" + esc(to) + "” across the report.") : "Nothing matched “" + esc(from) + "”.", ok ? "ok" : "warn");
    };
  }

  function pickEntity(after) {
    var r = rep(), em = cur.extraction.entity_match || {}, reg = currentRegister();
    var wantLead = (reg === "lead");
    var guess = r.title || cur.extraction.company_mentioned || "";
    var opts = [];
    if (em.code) opts.push({ code: em.code, name: em.canonical_name, sub: "match " + Math.round((em.match_score || 0) * 100) + "%" });
    (em.alternatives || []).forEach(function (a) { if (a.code !== em.code) opts.push({ code: a.code, name: a.canonical_name, sub: "alt" }); });
    opts = opts.filter(function (o) { return (String(o.code).indexOf("LD") === 0) === wantLead; });
    var kindWord = wantLead ? "lead" : "client";
    var deskLabel = { lead: "Lead", deal: "Deal", lending: "Lending", syndication: "Syndication", asset_mgmt: "Asset Monetisation" }[reg];
    overlay(
      '<div class="vx-modal">' +
        '<div class="vx-modal-h">Log to ' + deskLabel + '</div>' +
        '<p class="vx-muted">Pick the ' + kindWord + ' this interaction belongs to' + (wantLead ? ", or create a new lead." : ".") + '</p>' +
        '<input id="voxPickSearch" class="vx-inp" placeholder="🔎 Search ' + kindWord + 's…" value="' + attr(guess) + '">' +
        '<div id="voxPickList"></div>' +
        (wantLead ? '<label class="vx-newlead"><input type="radio" name="voxPick" value="__new__" checked> ＋ New lead: ' +
          '<input id="voxNewName" class="vx-inp vx-inline" autocomplete="off" value="' + attr(guess) + '"></label>' : '') +
        '<label class="vx-fixname"><input type="checkbox" id="voxFixName" checked> If this is an existing company, correct the spoken name (“' + esc(guess) + '”) across the summary &amp; transcript</label>' +
        '<div class="vx-modal-f"><button class="vx-btn green" id="voxPickGo">Continue →</button>' +
        '<button class="vx-btn ghost" id="voxPickCancel">Cancel</button></div>' +
      '</div>');
    function paint(q) {
      var list = $("voxPickList");
      var res = searchEntities(q).filter(function (o) { return (o.kind === "lead") === wantLead; });
      var extra = opts.filter(function (o) { return res.every(function (x) { return x.code !== o.code; }); });
      var rows = res.map(function (o) {
        return '<label class="vx-pick"><input type="radio" name="voxPick" value="' + attr(o.code) + '"> ' +
          '<b>' + esc(o.name) + '</b> <span class="vx-muted">' + esc(o.kind) + " · " + esc(o.code) + '</span></label>';
      }).join("") + extra.map(function (o) {
        return '<label class="vx-pick"><input type="radio" name="voxPick" value="' + attr(o.code) + '"> ' +
          '<b>' + esc(o.name) + '</b> <span class="vx-muted">' + esc(o.sub) + '</span></label>';
      }).join("");
      list.innerHTML = rows || (wantLead ? '' : '<div class="vx-muted" style="padding:6px 2px">No matching client yet — type to search by name.</div>');
    }
    paint(guess);
    $("voxPickSearch").oninput = function () { paint(this.value); };
    $("voxPickCancel").onclick = closeOverlay;
    $("voxPickGo").onclick = function () {
      var sel = document.querySelector("input[name=voxPick]:checked");
      var val = sel ? sel.value : (wantLead ? "__new__" : null);
      if (!val) { flash($("voxFileMsg"), "Pick a " + kindWord + " to continue.", "warn"); return; }
      var fx = $("voxFixName"), doFix = (!fx || fx.checked);
      if (val === "__new__") {
        var typed = (($("voxNewName") || {}).value) || guess;
        // correct the mis-heard forms to the name the RM actually typed
        if (doFix) reconcileName(heardForms().filter(function (f) { return f !== typed; }), typed);
        cur.entityChoice = { new_lead: true, company: typed };
      } else {
        var nm = "";
        try { nm = (S.clients[val] && S.clients[val].name) || ((S.leads || []).find(function (l) { return l.id === val; }) || {}).company || val; } catch (e) { nm = val; }
        if (doFix) reconcileName(heardForms(), nm);   // correct every spoken form to the canonical name
        cur.entityChoice = { chosen_code: val, name: nm };
      }
      closeOverlay();
      after();
    };
  }

  function commit() {
    var ex = cur.extraction, r = rep(), nm = nmeet();
    var reg = currentRegister();
    r.business_line = blForReg(reg);   // register drives the routing (Deal/Lead = no line)
    // fold report edits the register cares about back onto the fields the gate reads
    ex.discussion_points = (r.key_intel || []).filter(Boolean);
    ex.register_signals = ex.register_signals || {};
    ex.register_signals.next_action = firstNextStep(r);
    if (r.title) ex.company_mentioned = ex.company_mentioned || r.title;

    var summaryText = r.summary || (r.key_intel && r.key_intel[0]) || "";
    var body = {
      extraction: ex, rm: rm(), entities: buildEntities(),
      transcript: r.transcript_english || cur.transcript || "",
      summary: summaryText,
      edits: { date: nm.date || null, time: nm.time || null, mode: (nm.mode && nm.mode !== "—") ? nm.mode : null,
               temp: r.deal_temp || null, next_action: firstNextStep(r) }
    };
    var ch = cur.entityChoice;
    if (!ch) {   // fall back to the resolver's match when the RM didn't override
      var em = cur.extraction.entity_match || {};
      if (reg === "lead") ch = em.is_new_lead ? { new_lead: true, company: em.proposed_company || r.title } : (em.code ? { chosen_code: em.code } : { new_lead: true, company: r.title });
      else ch = em.code ? { chosen_code: em.code } : { new_lead: true, company: r.title };
    }
    if (ch.new_lead) { body.new_lead = true; body.company = ch.company || r.title; }
    else if (ch.chosen_code) { body.chosen_code = ch.chosen_code; }

    flash($("voxFileMsg"), "Filing to ATLAS…", "muted");
    var btn = $("voxFile"); if (btn) btn.disabled = true;
    api("/api/vox/commit", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    }).then(function (res) {
      if (btn) btn.disabled = false;
      if (res.status !== 200) { flash($("voxFileMsg"), "Couldn't file: " + esc((res.body && res.body.error) || "error"), "warn"); return; }
      applyToS(res.body);
      cur.filed = true; cur.fileResult = res.body;
      showFileResult(res.body);
    }).catch(function (e) { if (btn) btn.disabled = false; flash($("voxFileMsg"), "Couldn't file: " + esc(String(e)), "warn"); });
  }
  function firstNextStep(r) {
    var s = (r.next_steps || []).find(function (x) { return x && x.action; });
    if (!s) return null; return (s.owner ? s.owner + ": " : "") + s.action;
  }

  function writerHint(err) {
    err = String(err || "").toLowerCase();
    if (/no module|modulenotfound|importerror|cannot import/.test(err))
      return "Install the Google libraries on the server:  pip install google-auth google-auth-oauthlib google-api-python-client";
    if (/invalid_grant|refresh|expired|revoked|token has been/.test(err))
      return "Your Google token expired/was revoked — reconnect via the Calendar chip, then Approve again.";
    if (/no google token|keyerror|no token/.test(err))
      return "Connect Google via the Calendar chip in the header.";
    return "Click the Calendar chip to run a connection test.";
  }
  function showFileResult(res) {
    var ops = (res.writes && res.writes.results) || [];
    var madeLead = false, logged = false, calOps = [];
    ops.forEach(function (o) {
      if (o.op === "calendar_create_event") calOps.push(o);
      if (o.op === "atlas_create_lead") madeLead = true;
      if (o.op === "atlas_append_interaction") logged = true;
    });
    var created = calOps.filter(function (o) { return o.status === "ok" && o.result; });
    var failed = calOps.filter(function (o) { return o.status !== "ok"; });
    var expected = followups().length;

    var lines = [];
    if (logged) lines.push('<span class="vx-r-ok">✓ Interaction logged to the ATLAS register</span>');
    if (madeLead) lines.push('<span class="vx-r-ok">✓ New lead created</span>');
    created.forEach(function (o) {
      var link = o.result && (o.result.link || o.result.htmlLink);
      lines.push('<span class="vx-r-ok">✓ Follow-up added to Google Calendar' + (link ? ' — <a href="' + esc(link) + '" target="_blank">open event</a>' : '') + '</span>');
    });
    var warn = false;
    if (failed.length || (expected && !calOps.length)) {
      warn = true;
      var reason;
      if (!CAPS || CAPS.google_configured === false) reason = "Google Calendar isn't set up on the server.";
      else if (res.writer_error) reason = "Google writer error — " + res.writer_error + ". " + writerHint(res.writer_error);
      else if (gConnected === false) reason = "not connected — tap “Connect Calendar” in the header, then Approve again.";
      else if (failed.some(function (o) { return o.status === "mocked"; })) reason = "the server used the demo writer (no usable Google token). Click the Calendar chip to test.";
      else if (failed.length && failed[0].error) reason = failed[0].error;
      else reason = "no follow-up date was set in Next meeting.";
      lines.push('<span class="vx-r-warn">⚠ Follow-up NOT added to Calendar — ' + esc(reason) + '</span>');
    }
    var msg = $("voxFileMsg");
    msg.className = "vx-filemsg " + (warn ? "warn" : "ok");
    msg.innerHTML = '<div class="vx-done">✓ Logged to the ATLAS register</div>' + lines.map(function (l) { return '<div>' + l + '</div>'; }).join("");
    var btn = $("voxFile"); if (btn) { btn.textContent = "✓ Approved"; btn.classList.add("done"); }
    var st = document.querySelector(".vx-status"); if (st) { st.className = "vx-status filed"; st.textContent = "LOGGED"; }
  }

  // Write the confirmed records straight into ATLAS's S — this is the integration.
  function applyToS(res) {
    if (typeof S === "undefined") return;
    var plan = res.write_plan || [], refId = null, code = null, refType = "Deal";
    var followupDate = null, followupAction = null, occurredAt = null;
    S.interactions = S.interactions || [];
    plan.forEach(function (op) {
      if (op.op === "atlas_create_lead" && op.record) {
        S.leads = S.leads || [];
        if (!S.leads.some(function (l) { return l.id === op.record.id; })) S.leads.unshift(op.record);
        code = op.record.id;
      }
      if (op.op === "atlas_append_interaction" && op.record) {
        if (!S.interactions.some(function (i) { return i.interactionId === op.record.interactionId; }))
          S.interactions.push(op.record);
        refId = op.record.refId; code = code || op.record.refId; refType = op.record.refType || "Deal";
        followupDate = op.record.nextActionDate; followupAction = op.record.nextAction;
        occurredAt = op.record.occurredAt;
      }
      if (op.op === "alias_writeback" && op.code) {
        S.voxAliases = S.voxAliases || {};
        var al = S.voxAliases[op.code] || [];
        S.voxAliases[op.code] = al.concat((op.aliases || []).filter(function (a) { return al.indexOf(a) < 0; }));
      }
    });
    if (refId) {
      var lead = (S.leads || []).find(function (l) { return l.id === refId; });
      if (lead) {
        if (occurredAt) lead.last = occurredAt;
        if (followupDate) { lead.nextDate = followupDate; lead.next = "Meeting fixed (" + ddmmyy(followupDate) + ")"; }
        else if (followupAction && !lead.next) { lead.next = String(followupAction).slice(0, 60); }
      }
    }
    if (typeof audit === "function") audit("VOM capture", code || "", "voice note filed");
    if (typeof save === "function") save();
    // Refresh whatever ATLAS drawer is open so the new interaction shows at once.

  function reportCard(rp, i) {
    var r = (rp.extraction && rp.extraction.report) || {};

    var stateTxt = rp.filed ? "LOGGED" : "READY";
