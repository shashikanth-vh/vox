  function downloadPdf() {
    var r = rep(), nm = nmeet();

    function ul(arr) { return "<ul>" + (arr || []).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"; }
    function steps(arr) { return "<ul>" + (arr || []).map(function (s) { return "<li>" + (s.owner ? "<b>" + esc(s.owner) + ":</b> " : "") + esc(s.action || "") + (s.date ? " — " + esc(s.date) : "") + "</li>"; }).join("") + "</ul>"; }
    function rows() {
      var f = [["Client", r.title], ["Sector", r.sector], ["Project type", r.project_type], ["Project size", r.project_size],
        ["Location", r.location], ["Loan product", r.loan_product], ["Ticket size", r.ticket_size], ["Collateral", r.collateral],
        ["Equity raised", r.equity_raised], ["Turnover", r.turnover], ["Pipeline stage", r.pipeline_stage],

        ["Follow-up", nm.date ? ddmmyy(nm.date) + (nm.mode ? " (" + nm.mode + ")" : "") : null]];
      activeTplFields().forEach(function (fl) { f.push([fl.label, (r.extra || {})[fl.key]]); });   // template extras
      return f.filter(function (x) { return x[1]; }).map(function (x) { return "<tr><th>" + esc(x[0]) + "</th><td>" + esc(x[1]) + "</td></tr>"; }).join("");
    }

    w.document.write(
      '<html><head><title>' + esc(r.title || "VOM report") + '</title><meta charset="utf-8"><style>' +
      'body{font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:#111;max-width:760px;margin:32px auto;padding:0 20px}' +

      '.brand{color:#0d7377;font-weight:700;letter-spacing:.04em}' +
      '</style></head><body>' +
      '<div class="brand">VOM · EVAM FIELD INTEL</div>' +
      '<h1>' + esc(r.title || "Untitled") + '</h1><div class="sub">' + esc(subtitleLine()) + ' · ' + new Date(cur.createdAt).toLocaleString() + '</div>' +
      (r.summary ? '<h2>Summary</h2><p>' + esc(r.summary) + '</p>' : '') +
      (r.key_intel && r.key_intel.length ? '<h2>Key intel</h2>' + ul(r.key_intel) : '') +
      (r.nuances && r.nuances.length ? '<h2>Nuances &amp; soft signals</h2>' + ul(r.nuances) : '') +
      (r.next_steps && r.next_steps.length ? '<h2>Next steps</h2>' + steps(r.next_steps) : '') +
      '<h2>Details</h2><table>' + rows() + '</table>' +

      ((r.transcript_english || cur.transcript) ? '<h2>Full transcript (English)</h2><p>' + esc(r.transcript_english || cur.transcript) + '</p>' : '') +
      '</body></html>');
    w.document.close();
    setTimeout(function () { try { w.print(); } catch (e) {} }, 250);
  }

    el.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      if (moved) {
        var nx = Math.max(6, Math.min(window.innerWidth - el.offsetWidth - 6, ox + dx));
        var ny = Math.max(6, Math.min(window.innerHeight - el.offsetHeight - 6, oy + dy));
        el.style.left = nx + "px"; el.style.top = ny + "px"; el.style.bottom = "auto";
      }
    });
    el.addEventListener("pointerup", function () {
      if (!dragging) return;
      dragging = false;
      if (moved) {
        var r = el.getBoundingClientRect();
        try { localStorage.setItem("vox_fab_pos", JSON.stringify({ left: r.left, top: r.top })); } catch (e) {}
      } else { openApp("record"); }
    });
  }

  /* ======================================================================
   *  MOUNT
   * ==================================================================== */
  function mount() {
    if ($("voxHdrBtn") || $("voxFab")) return;
    injectStyles();

    var btn = document.createElement("button");
    btn.id = "voxHdrBtn"; btn.type = "button"; btn.innerHTML = MIC_SVG;
    btn.title = "VOM voice capture"; btn.setAttribute("aria-label", "VOM voice capture");
    btn.onclick = function () { openApp("record"); };
    var hr = document.querySelector(".hright");
    if (hr) hr.insertBefore(btn, hr.firstChild); else document.body.appendChild(btn);

    var fab = document.createElement("button");
    fab.id = "voxFab"; fab.title = "VOM voice capture (drag to move)"; fab.innerHTML = MIC_SVG;
    fab.setAttribute("aria-label", "VOM voice capture");
    document.body.appendChild(fab);
    makeDraggable(fab);

    function sync() {
      var ok = !document.body.classList.contains("authless") && isRM();
      document.body.classList.toggle("vox-show", ok);
    }
    sync();
    new MutationObserver(sync).observe(document.body, { attributes: true, attributeFilter: ["class"] });
    // Fold VOX notes in the ATLAS interaction timeline to summary + expand toggle.
    enhanceVoxNotes();
    new MutationObserver(scheduleEnhance).observe(document.body, { childList: true, subtree: true });
    ensureCaps(function () {});
  }

  window.VOX = { open: openApp, buildEntities: buildEntities };
  window.VOM = window.VOX;   // public brand handle
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount);
  else mount();
})();

</script>
<script src="chitti/atlas_chitti.js"></script>
