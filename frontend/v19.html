  `;
  document.head.appendChild(s);
})();

try{ renderTabs(); }catch(e){}
try{ renderActive(); }catch(e){}

</script>
<script>
/* ============================================================================
   AUGMENT 3 — ACTIVITY TRACKING LOG · last tab
   ----------------------------------------------------------------------------
   A plain-English log of what people DID: every operation performed anywhere
   in the sheet becomes one readable line ("Shubh Dave moved SBI to
   IM Circulated on Sunvik's mandate"). Derived live from the audit stream —
   no second storage, works retroactively on any saved state. The technical
   audit trail (raw action/field detail) stays on the Audit tab.
   ============================================================================ */
(function(){
'use strict';

/* ---- company name for a Group Code (falls back to the code itself) ---- */
function coName(code){
  try{ var c=S.clients&&S.clients[code]; if(c&&c.name) return c.name; }catch(e){}
  return code||'';
}

/* ---- which area of the business an action belongs to (drives the pill
   and the filter chips) ---- */
var AREAS={
  'Lead added':'Leads','Lead updated':'Leads','Lead field':'Leads','Lead converted':'Leads',
  'Deal created':'Deals','Deal merged':'Deals','Deal push':'Deals','Deal updated':'Deals',
  'Product added':'Deals','Update added':'Deals','Interaction logged':'Deals','Interactions ported':'Deals',
  'Lending row created':'Lending','Lending stage':'Lending','Lending updated':'Lending',
  'Syndication row created':'Syndication','Syndication status':'Syndication','Syndication updated':'Syndication',
  'Lender added':'Syndication','Lender status':'Syndication','Matrix':'Syndication',
  'Chased lender':'Syndication','Lender response':'Syndication',
  'Asset Mon row created':'Asset Mon','Asset Mon status':'Asset Mon','Asset Mon updated':'Asset Mon',
  'Client created':'Clients','Client updated':'Clients',
  'FI note':'FI','FI sectors':'FI','FI toggle':'FI',
  'Employee field':'Team','Employee toggle':'Team',
  'Document uploaded':'Documents','Document removed':'Documents',
  'Signed in':'Session','Seeded':'System','Snoozed':'Session','Resumed':'Session','Deleted':'System','Exported':'System','Approval requested':'System','Approval granted':'System','Approval rejected':'System','Mail parsed':'Leads','Consent recorded':'Leads','News scan':'News','News verdict':'News','News watch':'News','News search':'News','News opened':'News','Imported':'System','News emailed':'News','News schedule':'News','News cleared':'News'
};
var AREA_CLS={Leads:'ar-leads',Deals:'ar-deals',Lending:'ar-lend',Syndication:'ar-synd',
  'Asset Mon':'ar-am',Clients:'ar-cli',FI:'ar-fi',Team:'ar-team',Session:'ar-sys',System:'ar-sys',Documents:'ar-docs',News:'ar-news'};

/* ---- one readable sentence per operation. detail often carries
   "old → new" or "Lender: old → new" — reuse it verbatim where natural. ---- */
function describe(a){
  var act=a.act||'', code=a.code||'', d=(a.detail||'').trim(), co=coName(code);
  var lender=d.indexOf(':')>-1?d.split(':')[0].trim():'';
  var after=d.indexOf(':')>-1?d.slice(d.indexOf(':')+1).trim():d;
  switch(act){
    case 'Seeded':                  return 'Register initialised — '+d;
    case 'Signed in':               return 'Signed in to ATLAS';
    case 'Snoozed':                 return 'Parked a topic to get back to later'+(d?': '+d:'');
    case 'Resumed':                 return 'Picked a parked topic back up'+(d?': '+d:'');
    case 'Deleted':                 return 'Deleted a '+(d||'row')+' (admin action)';
    case 'Exported':                return 'Exported '+(d||'data');
    case 'Approval requested':      return 'Requested approval — '+d+' on '+co;
    case 'Approval granted':        return 'Approved a stage change — '+d+' on '+co;
    case 'Approval rejected':       return 'Rejected a stage change — '+d+' on '+co;
    case 'Mail parsed':             return 'Scraped an email — '+d;
    case 'Consent recorded':        return 'Recorded client consent (data + bureau) — '+d;
    case 'News scan':               return 'Scanned news — '+(code==='ALL'?'all firms ('+d+')':co+' ('+d+')');
    case 'News verdict':            return 'Marked a news item on '+co+': '+d;
    case 'News watch':              return 'Updated news watch terms for '+co+' — '+d;
    case 'News search':             return 'Searched live news for “'+d+'”';
    case 'News opened':             return 'Opened a news source on '+co+': “'+d+'”';
    case 'News emailed':            return 'Emailed a news digest — '+d;
    case 'News schedule':           return 'News schedule '+d;
    case 'News cleared':            return 'Cleared stored firm news — '+d;
    case 'Imported':                return 'Restored data from a backup file';
    case 'Lead added':              return 'Added a new lead: '+(d||co);
    case 'Lead updated':
    case 'Lead field':              return 'Updated lead '+code+(d?' — '+d:'');
    case 'Lead converted':          return 'Converted lead '+code+' into a client'+(d?' '+d:'');
    case 'Deal created':            return 'Created a deal for '+co+(d?' ('+d+')':'');
    case 'Deal merged':             return 'Merged a lead into the existing deal for '+co;
    case 'Deal push':               return 'Pushed the deal for '+co+(d?' — '+d:'');
    case 'Deal updated':            return 'Updated the deal for '+co+(d?' — changed '+d:'');
    case 'Product added':           return 'Added a product to '+co+': '+d;
    case 'Update added':            return 'Logged an update on '+co+': “'+d+'”';
    case 'Interaction logged':      return 'Logged an interaction with '+co+(d?': '+d:'');
    case 'Interactions ported':     return 'Imported past interactions for '+co;
    case 'Lending row created':     return 'Opened a lending facility for '+co+(d?' ('+d+')':'');
    case 'Lending stage':           return 'Moved '+co+'’s lending stage '+d;
    case 'Lending updated':         return 'Edited '+co+'’s lending record'+(d?' — '+d:'');
    case 'Syndication row created': return 'Opened a syndication mandate for '+co+(d?' ('+d+')':'');
    case 'Syndication status':      return 'Moved '+co+'’s syndication status '+d;
    case 'Syndication updated':     return 'Edited '+co+'’s syndication record'+(d?' — '+d:'');
    case 'Lender added':            return 'Added lender '+d+' to '+co+'’s mandate';
    case 'Lender status':
    case 'Matrix':                  return lender?('Moved '+lender+' '+after+' on '+co+'’s mandate')
                                                 :('Updated lender progress on '+co+': '+d);
    case 'Chased lender':           return lender?('Chased '+lender+' on '+co+'’s mandate: “'+after+'”')
                                                 :('Chased a lender on '+co+'’s mandate');
    case 'Lender response':         return lender?('Recorded '+lender+'’s response on '+co+': '+after)
                                                 :('Recorded a lender response on '+co+': '+d);
    case 'Asset Mon row created':   return 'Listed an asset for '+co+(d?' ('+d+')':'');
    case 'Asset Mon status':        return 'Changed '+co+'’s asset status '+d;
    case 'Asset Mon updated':       return 'Edited '+co+'’s asset entry'+(d?' — '+d:'');
    case 'Client created':          return 'Onboarded '+(d||co)+' as a client';
    case 'Client updated':          return 'Updated '+co+'’s client profile'+(d?' ('+d+')':'');
    case 'FI note':                 return 'Added a note on FI '+(code||lender)+(after?': '+after:'');
    case 'FI sectors':              return 'Updated sector coverage for FI '+(code||'')+(d?' — '+d:'');
    case 'FI toggle':               return 'Updated FI '+(code||'')+(d?' — '+d:'');
    case 'Employee field':
    case 'Employee toggle':         return 'Updated the employee record for '+(code||d);
    case 'Document uploaded':       return 'Uploaded '+d+' for '+co;
    case 'Document removed':        return 'Removed '+d+' from '+co+'\u2019s file';
    default:                        return act+(d?': '+d:'');
  }
}

/* ---- the view ---- */
var REGF={area:''};
window.regSetA=function(a){REGF.area=a;renderActive();};

window.vReg=function(){
  var all=S.audit.map(function(a){
    return {t:a.t,by:a.by||a.role||'',area:AREAS[a.act]||'Other',
            text:describe(a),code:a.code||'',co:coName(a.code||''),act:a.act};
  });
  var rows=all.filter(function(e){
    return (!REGF.area||e.area===REGF.area)&&match(e.co,e.code,e.text,e.by,e.area);
  });
  var today=(all[0]&&all[0].t?all[0].t.slice(0,10):''), nToday=0, who={}, ents={};
  all.forEach(function(e){
    if(e.t&&e.t.slice(0,10)===today)nToday++;
    if(e.by)who[e.by]=1; if(e.code)ents[e.code]=1;
  });
  var areasHere=[]; all.forEach(function(e){ if(areasHere.indexOf(e.area)<0)areasHere.push(e.area); });
  var chip=function(a,lab){
    return '<button class="regchip'+(REGF.area===a?' on':'')+'" onclick="regSetA(\''+a+'\')">'+lab+'</button>';};
  var cols=[
   {k:'t',label:'When',get:function(e){return e.t}},
   {k:'w',label:'Who',get:function(e){return e.by},render:function(e){return '<b>'+esc(e.by)+'</b>'}},
   {k:'r',label:'Area',get:function(e){return e.area},
     render:function(e){return '<span class="arpill '+(AREA_CLS[e.area]||'ar-sys')+'">'+esc(e.area)+'</span>'}},
   {k:'x',label:'Activity',get:function(e){return e.text},cls:'wrap',
     render:function(e){return esc(e.text)}},
   {k:'c',label:'Company',get:function(e){return e.co},cls:'wrap',
     render:function(e){return e.code?((e.co&&e.co!==e.code?'<b>'+esc(e.co)+'</b> ':'')+'<span class="code">'+esc(e.code)+'</span>'):'—'}}];
  return '<div class="toolbar" style="flex-wrap:wrap;gap:8px">'
   +'<span class="regkpi"><b>'+all.length+'</b> activities</span>'
   +'<span class="regkpi"><b>'+nToday+'</b> today</span>'
   +'<span class="regkpi"><b>'+Object.keys(who).length+'</b> people</span>'
   +'<span class="regkpi"><b>'+Object.keys(ents).length+'</b> companies touched</span>'
   +'<span style="flex:1"></span>'+chip('','All')
   +areasHere.map(function(a){return chip(a,a)}).join('')
   +'</div>'
   +'<div class="hint" style="margin:0 0 10px">Who did what, in plain English — every operation performed in this '
   +'sheet, newest first. The technical field-level trail lives on the Audit tab.</div>'
   +grid('reg',cols,rows);
};

/* ---- registration: last tab, audit-level visibility, render dispatch ---- */
if(TABS.findIndex(function(t){return t[0]==='reg'})<0) TABS.push(['reg','≡ Activity Log']);
['Analyst','Ops','Management','Admin'].forEach(function(r){
  if(ROLE_TABS[r]&&ROLE_TABS[r].indexOf('reg')<0) ROLE_TABS[r].push('reg');
});

var PREV_RA=renderActive;                 /* capture augment-2's dispatcher */
renderActive=function(){
  if(cur==='reg'){
    var v=document.getElementById('main');
    if(v){ v.innerHTML=vReg(); return; }
  }
  PREV_RA();
};

/* ---- styling (uses the sheet's palette variables) ---- */
var s=document.createElement('style');
s.textContent=
  '.arpill{display:inline-block;font-weight:700;font-size:11px;padding:2px 10px;border-radius:99px;color:#fff;white-space:nowrap}'
 +'.ar-leads{background:var(--teal-hi)}.ar-deals{background:var(--navy2)}.ar-lend{background:var(--lend)}'
 +'.ar-synd{background:var(--synd)}.ar-am{background:var(--am)}.ar-cli{background:var(--ok)}'
 +'.ar-fi{background:var(--m3)}.ar-team{background:var(--warn)}.ar-sys{background:var(--muted)}.ar-docs{background:var(--teal)}.ar-news{background:#B3432B}'
 +'.regkpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12.5px;color:var(--muted)}'
 +'.regkpi b{color:var(--ink);font-size:14px;margin-right:4px}'
 +'.regchip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--ink)}'
 +'.regchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}';
document.head.appendChild(s);

try{ renderTabs(); }catch(e){}
try{ if(cur==='reg') renderActive(); }catch(e){}
})();
</script>

<script>
/* ============================================================================
   AUGMENT 4 — REMOVE THE HOME PAGE
   The launcher tiles duplicated the tab bar. 'Today' (the worklist) becomes
   the landing view after sign-in; any old show('home') call — login, the

  ROLE_TABS[r]=ROLE_TABS[r].filter(function(t){return t!=='home'});
});

<script>
/* ============================================================================
   AUGMENT 5 — DATA REGISTER: DOCUMENTS VAULT (upload docs per section)
   ----------------------------------------------------------------------------
   Replaces the placeholder Data Register modal with a working vault:
   every section lists the documents required for deal execution; each slot
   can be uploaded, viewed and removed. Files ≤ ~400 KB are kept inline
   (base64 in the saved state) so View/Download works offline; larger files
   keep name/size/type metadata only. Wired to the live platform, the bytes
   go to the Documents service (POST /api/documents/upload) instead —
   the section/doc keys below are the `kind` it stores.
   Every upload/removal is audited → shows up in the Activity Log.
   ============================================================================ */
(function(){
'use strict';

/* ---- the required-document checklist, per section ---- */
var REQ_DOCS=[
 {k:'kyc',  t:'KYC & Constitutional', d:[
   {k:'coi',  n:'Certificate of Incorporation', req:1},
   {k:'moa',  n:'MOA & AOA', req:1},
   {k:'pan',  n:'Company PAN', req:1},
   {k:'gst',  n:'GST Registration', req:1},
   {k:'shp',  n:'Shareholding pattern', req:1},
   {k:'dirkyc',n:'Promoter / Director KYC', req:1}]},
 {k:'fin',  t:'Financials', d:[
   {k:'af3',  n:'Audited financials — last 3 FYs', req:1},
   {k:'prov', n:'Provisional financials — current FY', req:1},
   {k:'itr',  n:'ITR acknowledgements — 3 years', req:1},
   {k:'cma',  n:'Projections / CMA data', req:1}]},
 {k:'bank', t:'Banking & Debt', d:[
   {k:'bs12', n:'Bank statements — 12 months', req:1},
   {k:'sanc', n:'Existing loan sanction letters', req:1},
   {k:'soa',  n:'Loan outstanding / SOA', req:1},
   {k:'rtr',  n:'Repayment track record', req:0}]},
 {k:'comp', t:'Compliance & Bureau', d:[
   {k:'gstr', n:'GST returns — 12 months', req:1},
   {k:'cibc', n:'CIBIL consent letter', req:1},
   {k:'stat', n:'Statutory dues confirmation', req:0}]},
 {k:'proj', t:'Project & Technical', d:[
   {k:'dpr',  n:'Project report / DPR', req:1},
   {k:'ppa',  n:'PPA / offtake agreement', req:0},
   {k:'land', n:'Land documents', req:0},
   {k:'env',  n:'Environmental clearances', req:0}]},
 {k:'deal', t:'Deal Documents', d:[
   {k:'mand', n:'Mandate letter', req:1},
   {k:'im',   n:'Information Memorandum', req:0},
   {k:'ts',   n:'Term sheet', req:0}]}
];
var INLINE_MAX=400*1024;              /* keep bytes offline up to this size */

function docsOf(code){ S.docs=S.docs||{}; return S.docs[code]=S.docs[code]||{}; }
function slot(code,sec,doc){ var d=docsOf(code); d[sec]=d[sec]||{}; return d[sec][doc]; }
function fmtKB(b){ return b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'; }
function secByKey(sk){ for(var i=0;i<REQ_DOCS.length;i++) if(REQ_DOCS[i].k===sk) return REQ_DOCS[i]; return null; }
function docLabel(sec,dk){
  if(dk.indexOf('x_')===0){ var e=slot; return dk; }
  var s=secByKey(sec); if(!s) return dk;
  for(var i=0;i<s.d.length;i++) if(s.d[i].k===dk) return s.d[i].n;
  return dk;
}
function persistSafe(entry){
  try{ save(); }
  catch(e){ if(entry&&entry.data){ delete entry.data; entry.inline=false; }
    try{ save(); toast&&toast('File too large to keep offline — details recorded'); }catch(e2){} }
}

/* ---- upload / view / remove ---- */
window.drUpload=function(ev,code,sec,dk,label){
  if(typeof writeOK==='function'&&!writeOK())return;
  var f=ev.target.files&&ev.target.files[0]; if(!f) return;
  var store=docsOf(code); store[sec]=store[sec]||{};
  var entry={name:f.name,size:f.size,type:f.type||'file',when:now(),by:roleName(),label:label};
  store[sec][dk]=entry;
  var fin=function(){
    var s=secByKey(sec);
    audit('Document uploaded',code,(s?s.t:sec)+' · '+label+' ('+f.name+')');
    persistSafe(entry);
    openDataRegister(code); stamp(label+' uploaded');
  };
  if(f.size<=INLINE_MAX){
    var r=new FileReader();
    r.onload=function(){ entry.data=r.result; entry.inline=true; fin(); };
    r.onerror=function(){ entry.inline=false; fin(); };
    r.readAsDataURL(f);
  } else { entry.inline=false; fin(); }
};
window.drView=function(code,sec,dk){
  var e=slot(code,sec,dk); if(!e) return;
  if(e.data){ var a=document.createElement('a'); a.href=e.data; a.download=e.name;
    document.body.appendChild(a); a.click(); a.remove(); }
  else toast&&toast('Stored as record only (file was larger than the offline limit)');
};
window.drRemove=function(code,sec,dk){
  if(typeof writeOK==='function'&&!writeOK())return;
  var store=docsOf(code); if(!store[sec]||!store[sec][dk]) return;
  var e=store[sec][dk], s=secByKey(sec);
  if(!confirm('Remove '+(e.label||dk)+' ('+e.name+')?')) return;
  delete store[sec][dk];
  audit('Document removed',code,(s?s.t:sec)+' · '+(e.label||dk)+' ('+e.name+')');
  persistSafe(null);
  openDataRegister(code); stamp('Document removed');
};
window.drAddCustom=function(code,sec){
  if(typeof writeOK==='function'&&!writeOK())return;
  var n=prompt('Name of the document (e.g. "Insurance policy")',''); if(!n) return;
  var dk='x_'+n.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,30);
  var inp=document.getElementById('dr_custom_'+sec);
  if(inp){ inp.dataset.dk=dk; inp.dataset.label=n; inp.click(); }
};

/* ---- the rebuilt modal ---- */
window.openDataRegister=function(code){
  var c=client(code), store=docsOf(code);
  var totReq=0, gotReq=0, gotAll=0;
  var secHtml=REQ_DOCS.map(function(s){
    var got=0, sStore=store[s.k]||{};
    var rows=s.d.map(function(dd){
      var e=sStore[dd.k]; if(e)got++;
      if(dd.req){totReq++; if(e)gotReq++;} if(e)gotAll++;
      var meta=e?('<span class="drv-meta">'+esc(e.name)+' · '+fmtKB(e.size)+' · '+esc(e.by)+' · '+esc((e.when||'').slice(0,16))+'</span>'):'';
      var actions=e
        ?((e.inline?'<button class="drv-btn" onclick="drView(\''+code+'\',\''+s.k+'\',\''+dd.k+'\')">View</button>':'')
          +'<label class="drv-btn">Replace<input type="file" style="display:none" onchange="drUpload(event,\''+code+'\',\''+s.k+'\',\''+dd.k+'\',\''+esc(dd.n)+'\')"></label>'
          +'<button class="drv-btn drv-del rmonly" onclick="drRemove(\''+code+'\',\''+s.k+'\',\''+dd.k+'\')">Remove</button>')
        :('<label class="drv-btn drv-up rmonly">⬆ Upload<input type="file" style="display:none" onchange="drUpload(event,\''+code+'\',\''+s.k+'\',\''+dd.k+'\',\''+esc(dd.n)+'\')"></label>');
      return '<div class="drv-row'+(e?' done':'')+'">'
        +'<span class="drv-dot">'+(e?'✓':'')+'</span>'
        +'<span class="drv-name">'+esc(dd.n)+(dd.req?' <span class="drv-req">required</span>':'')+meta+'</span>'
        +'<span class="drv-act">'+actions+'</span></div>';
    }).join('');
    /* ad-hoc docs already uploaded under this section */
    var extra=Object.keys(sStore).filter(function(k){return k.indexOf('x_')===0}).map(function(k){
      var e=sStore[k]; gotAll++;
      return '<div class="drv-row done"><span class="drv-dot">✓</span>'
        +'<span class="drv-name">'+esc(e.label||k)+'<span class="drv-meta">'+esc(e.name)+' · '+fmtKB(e.size)+' · '+esc(e.by)+' · '+esc((e.when||'').slice(0,16))+'</span></span>'
        +'<span class="drv-act">'+(e.inline?'<button class="drv-btn" onclick="drView(\''+code+'\',\''+s.k+'\',\''+k+'\')">View</button>':'')
        +'<button class="drv-btn drv-del rmonly" onclick="drRemove(\''+code+'\',\''+s.k+'\',\''+k+'\')">Remove</button></span></div>';
    }).join('');
    var reqN=s.d.filter(function(d){return d.req}).length,
        reqGot=s.d.filter(function(d){return d.req&&sStore[d.k]}).length;
    return '<div class="dr-card"><h4>'+esc(s.t)
      +' <span class="drv-prog'+(reqGot>=reqN?' ok':'')+'">'+reqGot+'/'+reqN+' required</span></h4>'
      +rows+extra
      +'<div class="drv-addrow rmonly"><button class="drv-btn" onclick="drAddCustom(\''+code+'\',\''+s.k+'\')">＋ Add another document</button>'
      +'<input id="dr_custom_'+s.k+'" type="file" style="display:none" onchange="drUpload(event,\''+code+'\',\''+s.k+'\',this.dataset.dk,this.dataset.label)"></div>'

<script>
/* ============================================================================
   AUGMENT 9 — ROW ACTIONS COLUMN (Edit · CSV · Delete)
   Every grid-rendered register gets an Actions column as its last column:
     ✏ Edit    — opens the row's editor (company drawer / lead drawer)
     ⬇ CSV     — downloads that row as a one-line CSV (all visible columns)
     🗑 Delete  — ADMIN ONLY, with confirm; audited
   Audit & Activity Log are append-only by platform rule — they get CSV only.
   ============================================================================ */
(function(){
'use strict';

/* which tables support what */
var EDIT={
  leads:  function(r){ openLead(r.id); },
  deals:  function(r){ openCompany(r.code); },
  clients:function(r){ openCompany(r.code); },
  lend:   function(r){ openCompany(r.code); },
  am:     function(r){ openCompany(r.code,'am'); }
};
var TABLE_NAME={leads:'Lead',deals:'Deal',clients:'Client',lend:'Lending',am:'Asset Mon',audit:'Audit',reg:'Activity'};
var DEL={
  leads:  function(r){ S.leads=S.leads.filter(function(x){return x.id!==r.id}); return r.id+' · '+(r.company||''); },
  deals:  function(r){ S.deals=S.deals.filter(function(x){return x.code!==r.code}); return r.code; },
  lend:   function(r){ S.lending=S.lending.filter(function(x){return x.id!==r.id}); return r.code+' ₹'+(r.amt||0)+' Cr'; },
  am:     function(r){ S.am=S.am.filter(function(x){return x.id!==r.id}); return r.code; },
  clients:function(r){
    var used=S.deals.some(function(d){return d.code===r.code})||S.lending.some(function(x){return x.code===r.code})
      ||S.syn.some(function(x){return x.code===r.code})||S.am.some(function(x){return x.code===r.code});
    if(used){ toast('Remove this client’s deal & product rows first'); return null; }
    delete S.clients[r.code]; return r.code;
  }
};

var REG_ROWS={};                          /* id -> the rows array of the last render */

function rowLabel(id,r){ return r.company||r.name||(r.code&&(client(r.code)||{}).name)||r.code||r.id||'row'; }

window.actDo=function(ev,verb,id,idx){
  ev.stopPropagation();
  var rows=REG_ROWS[id]||[], r=rows[idx]; if(!r) return;
  if(verb==='edit'){ var f=EDIT[id]; if(f)f(r); return; }
  if(verb==='csv'){
    var cols=(GC[id]&&GC[id].cols||[]).filter(function(c){return c.k!=='__act'});
    var q=function(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    var csv=cols.map(function(c){return q(c.label)}).join(',')+'\n'
           +cols.map(function(c){var v;try{v=c.get(r)}catch(e){v=''}return q(v)}).join(',')+'\n';
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download=(TABLE_NAME[id]||id)+'_'+String(r.code||r.id||idx).replace(/[^A-Za-z0-9_-]+/g,'_')+'.csv';
    document.body.appendChild(a);a.click();a.remove();
    stamp('Row exported as CSV'); return;
  }
  if(verb==='del'){
    if(!USER||USER.role!=='Admin'){ toast('Only Admin can delete'); return; }
    var f=DEL[id]; if(!f) return;
    if(!confirm('Delete this '+(TABLE_NAME[id]||id)+' row — '+rowLabel(id,r)+'? This cannot be undone here.')) return;
    var what=f(r); if(what==null) return;                 /* guarded (e.g. client in use) */
    audit('Deleted',r.code||r.id||'',(TABLE_NAME[id]||id)+' row — '+rowLabel(id,r));
    save();renderActive();stamp('Row deleted');
  }
};

function actHtml(id,idx){
  var isAdmin=USER&&USER.role==='Admin';
  var b='';
  if(EDIT[id]) b+='<button class="actb" title="Edit" onclick="actDo(event,\'edit\',\''+id+'\','+idx+')">✎</button>';
  b+='<button class="actb" title="Export row as CSV" onclick="actDo(event,\'csv\',\''+id+'\','+idx+')">⬇</button>';
  if(DEL[id]) b+='<button class="actb actb-del'+(isAdmin?'':' off')+'" title="'+(isAdmin?'Delete (Admin)':'Delete — Admin only')+'" onclick="actDo(event,\'del\',\''+id+'\','+idx+')">🗑</button>';
  return '<span class="actwrap" onclick="event.stopPropagation()">'+b+'</span>';
}

/* wrap the shared grid renderer: append the Actions column to every table */
var ORIG_grid=grid;
grid=function(id,cols,rows,rowAttrs){
  REG_ROWS[id]=rows;
  if(!cols.some(function(c){return c.k==='__act'})){
    cols=cols.concat([{k:'__act',label:'Actions',
      get:function(){return ''},
      render:function(r){ return actHtml(id,(REG_ROWS[id]||[]).indexOf(r)); }}]);
  }
  return ORIG_grid(id,cols,rows,rowAttrs);
};

/* styling */
var s=document.createElement('style');
s.textContent=
  '.actwrap{display:inline-flex;gap:5px;white-space:nowrap}'
 +'.actb{border:1px solid var(--line);background:var(--card);border-radius:7px;width:26px;height:24px;'
 +'display:inline-flex;align-items:center;justify-content:center;font-size:12px;padding:0;color:var(--muted)}'
 +'.actb:hover{border-color:var(--teal-hi);color:var(--teal)}'
 +'.actb-del:hover{border-color:var(--bad);color:var(--bad)}'
 +'.actb.off{opacity:.35;cursor:not-allowed}'
 +'@media(max-width:640px){.tablewrap:not(.matrixwrap) table td:last-child{justify-content:flex-end}}';
document.head.appendChild(s);
})();
</script>
<script>
/* ============================================================================
   AUGMENT 10 — DASHBOARD: INVESTOR / ADMIN VIEWS + EXPORT
   ----------------------------------------------------------------------------
   · Hero KPI band: the headline numbers an investor reads first.
   · Two lenses on the same data:
       Investor view — headline + book composition (closed, pipeline, sector,
                       lens, geography, syndication funnel). Clean, no ops.
       Admin (full)  — everything, including team throughput, bank engagement,
                       velocity and sourcing operations.
   · Export from the dashboard: ⬇ CSV (all dashboard tables, sectioned) and
     🖨 Print / PDF (print-styled one-pager for circulation).
   ============================================================================ */
(function(){
'use strict';

window.DASHVIEW=window.DASHVIEW||null;   /* 'inv' | 'full' (default by role) */
function dashView(){
  if(DASHVIEW) return DASHVIEW;
  return (USER&&USER.role==='Management')?'inv':'full';
}
window.setDashView=function(v){DASHVIEW=v;renderActive();};

/* sections shown in the investor lens (matched on the v4-secttl text) */
var INVESTOR_SECTIONS=['Closed Deals','Pipeline','Active pipeline by sector',
  'Business line composition by climate lens','Pipeline and closed by geography',
  'Syndication funnel: most advanced stage reached'];

/* ---- hero numbers (respects the person filter & role scoping upstream) ---- */
function heroData(){
  var D=dashData();
  var amt=function(a,f){return a.reduce(function(s,x){return s+num(f?x[f]:x.amt)},0)};
  var closedAmt=amt(D.closedLend)+amt(D.closedSyn)+amt(D.closedAm,'val');
  var pipeAmt=amt(D.pipeLend)+amt(D.pipeSyn)+amt(D.pipeAm,'val');
  var closedN=D.closedLend.length+D.closedSyn.length+D.closedAm.length;
  var pipeN=D.pipeLend.length+D.pipeSyn.length+D.pipeAm.length;
  var lenders={};S.syn.forEach(function(r){(r.lenders||[]).forEach(function(l){if(l.name)lenders[l.name]=1})});
  return {closedAmt:closedAmt,closedN:closedN,pipeAmt:pipeAmt,pipeN:pipeN,
    conv:(closedN+pipeN)?Math.round(closedN/(closedN+pipeN)*100):0,
    clients:Object.keys(S.clients||{}).length,

<script>
/* ============================================================================
   AUGMENT 11 — PAGE EXPORT BAR (CSV · PDF) on every tab
   ----------------------------------------------------------------------------
   Each tab gets an Export control at the top. CSV exports the ENTIRE
   underlying records of that register — every stored field, not just the
   columns the table happens to show (columns are auto-derived from the
   union of keys across rows; nested lists are flattened readably).
   PDF prints the current tab through a clean print stylesheet.
   RM/Analyst scoping applies: you export the book you can see.
   ============================================================================ */
(function(){
'use strict';

function q(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}

/* flatten one value for CSV: arrays/objects become compact readable text */
function flat(v){
  if(v==null) return '';
  if(Array.isArray(v)){
    return v.map(function(x){
      if(x&&typeof x==='object')
        return (x.name||x.st||x.status||x.stage||'')+(x.st&&x.name?': '+x.st:'')+(x.t?' ('+x.t+')':'');
      return String(x);
    }).filter(Boolean).join('; ');
  }
  if(typeof v==='object') return Object.keys(v).map(function(k){return k+'='+v[k]}).join('; ');
  return v;
}

/* generic register dump: union of keys, company name joined via code */
function dump(arr,skip){
  skip=skip||[];
  var keys=[];
  arr.forEach(function(r){Object.keys(r||{}).forEach(function(k){
    if(skip.indexOf(k)<0&&keys.indexOf(k)<0)keys.push(k);})});
  var head=keys.slice();
  var hasCode=keys.indexOf('code')>-1;
  if(hasCode)head.splice(keys.indexOf('code')+1,0,'company');
  var rows=arr.map(function(r){
    var out=[];
    keys.forEach(function(k){
      out.push(flat(r[k]));
      if(hasCode&&k==='code')out.push((client(r.code)||{}).name||'');
    });
    return out;
  });
  return {head:head,rows:rows};
}

function csvOf(d,title){
  return title+','+today()+'\n\n'+d.head.map(q).join(',')+'\n'
    +d.rows.map(function(r){return r.map(q).join(',')}).join('\n')+'\n';
}

/* per-tab builders — each returns a complete CSV string */
var BUILD={
  leads:  function(){return csvOf(dump(S.leads),'EVAM — Leads (full register)');},
  deals:  function(){
    var d=dump(S.deals);
    /* enrich every deal with its full client profile + product rollups */
    d.head=d.head.concat(['sector','lens','state','about','lending rows','lending ₹Cr','synd rows','synd ₹Cr','AM rows','AM ₹Cr']);
    d.rows.forEach(function(row,i){
      var code=S.deals[i]&&S.deals[i].code, c=client(code)||{};
      var L=S.lending.filter(function(x){return x.code===code});
      var Y=S.syn.filter(function(x){return x.code===code});
      var A=S.am.filter(function(x){return x.code===code});
      var sm=function(a,f){return a.reduce(function(s,x){return s+num(x[f||'amt'])},0)};
      row.push(c.sector||'',c.lens||'',c.state||'',c.about||'',
        L.length,fmt(sm(L),1),Y.length,fmt(sm(Y),1),A.length,fmt(sm(A,'val'),1));
    });
    return csvOf(d,'EVAM — Deals (full register, client profile + product rollup)');
  },
  lend:   function(){return csvOf(dump(S.lending),'EVAM — Lending (full register)');},
  syn:    function(){
    var main=csvOf(dump(S.syn,['lenders']),'EVAM — Syndication (full register)');
    var lr=[];
    S.syn.forEach(function(r){(r.lenders||[]).forEach(function(l){
      lr.push({code:r.code,lender:l.name,status:l.st||'',since:l.since||'',lastResponse:l.resp||'',
               history:flat(l.h||[])});})});
    return main+'\nLENDER-LEVEL ROWS\n'+csvOf(dump(lr),'').split('\n').slice(2).join('\n');
  },
  am:     function(){return csvOf(dump(S.am),'EVAM — Asset Monetisation (full register)');},
  clients:function(){
    var rows=Object.entries(S.clients||{}).map(function(e){var o={code:e[0]};Object.assign(o,e[1]);return o;});
    return csvOf(dump(rows),'EVAM — Clients (full register)');
  },
  fi:     function(){return csvOf(dump(S.lenders||[]),'EVAM — FI Master (full register)');},
  emp:    function(){return csvOf(dump(S.people||[]),'EVAM — Employees (full register)');},
  audit:  function(){return csvOf(dump(S.audit||[]),'EVAM — Audit trail (append-only)');},
  reg:    function(){
    var rows=(S.audit||[]).map(function(a){
      return {when:a.t,who:a.by||a.role||'',action:a.act,code:a.code||'',detail:a.detail||''};});
    return csvOf(dump(rows),'EVAM — Activity log');
  },
  today:  function(){
    var rows=[];
    try{attention().forEach(function(a){rows.push({type:'stage bottleneck',severity:a.sev,
      company:a.isLead||(client(a.code)||{}).name||a.code,rule:a.rule,why:a.why,owner:a.owner});});}catch(e){}
    Object.entries(S.snz||{}).forEach(function(e){rows.push({type:'parked — will get back',severity:'',
      company:(e[1]&&e[1].label)||e[0],rule:'',why:'parked '+((e[1]&&e[1].when)||''),owner:(e[1]&&e[1].by)||''});});
    return csvOf(dump(rows),'EVAM — Today worklist');
  }
};
var TAB_LABEL={today:'Today',leads:'Leads',deals:'Deals',lend:'Lending',syn:'Syndication',
  am:'AssetMon',fi:'FI_Master',clients:'Clients',emp:'Employees',audit:'Audit',reg:'Activity_Log'};

window.pageExport=function(kind){
  var k=cur;
  if(kind==='pdf'){
    document.body.classList.add('printing-dash');
    audit('Exported','',(TAB_LABEL[k]||k)+' PDF (print)');
    setTimeout(function(){window.print();
      setTimeout(function(){document.body.classList.remove('printing-dash')},400);},50);
    return;
  }
  var b=BUILD[k]; if(!b){toast('No export for this view');return;}
  var run=function(){
    var csv=b();
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download='EVAM_'+(TAB_LABEL[k]||k)+'_'+today()+'.csv';
    document.body.appendChild(a);a.click();a.remove();
    audit('Exported','',(TAB_LABEL[k]||k)+' CSV (full register)');
    stamp((TAB_LABEL[k]||k)+' exported');
  };
  try{ scopedS(run); }catch(e){ run(); }
};

/* inject the bar at the top of every tab (dashboard keeps its own controls) */
var PREV_RA=renderActive;
renderActive=function(){
  PREV_RA();
  try{
    if(cur==='login'||cur==='dash') return;
    var m=document.getElementById('main');
    if(!m||m.querySelector('.exportbar')) return;
    var bar=document.createElement('div');
    bar.className='exportbar';
    bar.innerHTML='<span class="exp-lab">Export this view</span>'
      +'<button class="mini" onclick="pageExport(\'csv\')">⬇ CSV</button>'
      +'<button class="mini" onclick="pageExport(\'pdf\')">🖨 PDF</button>';
    m.insertBefore(bar,m.firstChild);
  }catch(e){}
};

var s=document.createElement('style');
s.textContent=
  '.exportbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:0 0 10px}'
 +'.exp-lab{font-size:11.4px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}'
 +'@media print{body.printing-dash .exportbar{display:none!important}}'
 +'@media(max-width:760px){.exportbar{justify-content:flex-start}}';
document.head.appendChild(s);
try{ renderActive(); }catch(e){}
})();
</script>
<script>
/* ============================================================================
   AUGMENT 12 — ATLAS COPILOT + WORKFLOW PACK
   ----------------------------------------------------------------------------
   1  Copilot chatbot   — floating bubble, LLM-style chat over the Register.
                          Offline: intents computed locally from the live data.
                          Online (wired to gateway): the same box routes to
                          CIPHER — the contract is ask(text) -> reply(html).
   2  Approvals         — stage changes can be REQUESTED by anyone and
                          APPROVED only by Admin/Management (RBAC), audited.
   3  Clickable everywhere — any Group Code chip opens the company profile.
   4  Table detail      — Audit & Activity rows click open a full-detail view.
   5  Offline/online    — live indicator in the header + chat; the file works
                          as an offline copy and syncs when served online.
   6  RBAC              — copilot actions & approvals respect the four roles.
   7  Mail intake       — paste an email; fields are scraped into a draft
                          lead/update you confirm (consent-first, audited).
   8  Application form  — client intake with explicit data + bureau consent;
                          creates a lead (live mode: POST /api/register/leads).
   9  Lifecycle (Vistaar) — every client carries a lifecycle stage up to
                          "Vistaar — Expansion"; editable, visible, audited.
   ============================================================================ */
(function(){
'use strict';

/* ============================== 9. LIFECYCLE ============================== */
window.LIFE_STAGES=['Prospect','Onboarded','Active','Serviced','Vistaar — Expansion','Dormant'];
var LIFE_CLR={'Prospect':'#5F6E76','Onboarded':'#1F6FA8','Active':'#0D7377',
  'Serviced':'#2E7D4F','Vistaar — Expansion':'#7A4FC4','Dormant':'#9AA7AD'};
window.lifeBadge=function(v){v=v||'Prospect';
  return '<span class="lifeb" style="background:'+(LIFE_CLR[v]||'#5F6E76')+'">'+esc(v)+'</span>';};
window.setLifecycle=function(code,v){
  if(typeof writeOK==='function'&&!writeOK())return;
  if(!S.clients[code])return;
  S.clients[code].lifecycle=v;
  audit('Client updated',code,'lifecycle → '+v);
  renderActive();cbNote('Lifecycle for <b>'+esc((client(code)||{}).name||code)+'</b> set to '+lifeBadge(v));
};

/* ============================== 2. APPROVALS ============================== */
function approvals(){S.approvals=S.approvals||[];return S.approvals;}
function pendingApprovals(){return approvals().filter(function(a){return a.status==='Pending'});}
function canApprove(){return USER&&(USER.role==='Admin'||USER.role==='Management');}

window.requestStage=function(code,line,to){
  var list=approvals();
  var r=line==='lending'?S.lending.find(function(x){return x.code===code})
                        :S.syn.find(function(x){return x.code===code});
  if(!r){cbNote('No '+line+' row found for '+esc(code));return;}
  var from=line==='lending'?r.stage:r.status;
  if(from===to){cbNote('Already at <b>'+esc(to)+'</b>.');return;}
  /* Admin applies directly; everyone else raises a request */
  if(USER&&USER.role==='Admin'){ applyStage(code,line,to,USER.name); cbNote('Applied: <b>'+esc(code)+'</b> '+esc(line)+' → <b>'+esc(to)+'</b> (Admin direct).'); return; }
  var id='AP'+(list.length+1);
  list.push({id:id,code:code,line:line,from:from,to:to,by:roleName(),when:now(),status:'Pending'});
  audit('Approval requested',code,line+': '+from+' → '+to);
  save();updateFabBadge();
  cbNote('Request <b>'+id+'</b> raised: '+esc(code)+' '+esc(line)+' <b>'+esc(from)+' → '+esc(to)
    +'</b>. Waiting for Admin/Management.');
};
function applyStage(code,line,to,by){
  if(line==='lending'){
    var r=S.lending.find(function(x){return x.code===code}); if(!r)return;
    var o=r.stage;r.stage=to;r.updated=today();(r.h=r.h||[]).push({stage:to,t:today(),by:by});
    audit('Lending stage',code,o+' → '+to);
  }else{
    var r2=S.syn.find(function(x){return x.code===code}); if(!r2)return;
    var o2=r2.status;r2.status=to;(r2.h=r2.h||[]).push({status:to,t:today(),by:by});
    audit('Syndication status',code,o2+' → '+to);
  }
  save();
}
window.decideApproval=function(id,ok){
  if(!canApprove()){cbNote('Only Admin or Management can decide approvals.');return;}
  if(USER.role==='Management'&&typeof writeOK==='function'&&!writeOK())return;
  var a=approvals().find(function(x){return x.id===id&&x.status==='Pending'}); if(!a)return;
  a.status=ok?'Approved':'Rejected';a.decidedBy=roleName();a.decidedAt=now();
  if(ok)applyStage(a.code,a.line,a.to,a.decidedBy);
  audit(ok?'Approval granted':'Approval rejected',a.code,a.line+': '+a.from+' → '+a.to+' ('+a.id+')');
  save();updateFabBadge();renderActive();
  cbNote('<b>'+a.id+'</b> '+(ok?'✅ approved — stage applied.':'❌ rejected.'));
};
function approvalsHtml(){
  var P=pendingApprovals();
  if(!P.length)return '<div class="cb-b">No pending approvals. Raise one like: <i>"move Sunvik lending to Sanctioned"</i>.</div>';
  return '<div class="cb-b"><b>'+P.length+' pending approval'+(P.length>1?'s':'')+'</b>'
   +P.map(function(a){
     var nm=(client(a.code)||{}).name||a.code;
     return '<div class="cb-card"><b>'+a.id+'</b> · '+esc(nm)+'<br><span class="hint">'
       +esc(a.line)+': '+esc(a.from)+' → <b>'+esc(a.to)+'</b> · by '+esc(a.by)+' · '+esc((a.when||'').slice(0,16))+'</span>'
       +(canApprove()?'<div class="cb-btns"><button class="cb-act ok" onclick="decideApproval(\''+a.id+'\',true)">✓ Approve</button>'
         +'<button class="cb-act bad" onclick="decideApproval(\''+a.id+'\',false)">✕ Reject</button></div>'
         :'<div class="hint">Approval needs Admin/Management.</div>')
       +'</div>';
   }).join('')+'</div>';
}

/* ============================ 7. MAIL INTAKE ============================== */
window.openMailIntake=function(){
  closeCb();
  openModal('<div class="mhead"><h2>📧 Mail intake — paste, we scrape</h2><button class="x" onclick="closeModal()">×</button></div>'
   +'<div class="mbody">'
   +'<div class="hint" style="margin-bottom:8px">Paste a client / lender email. Company, amount, lender and stage signals are extracted into a draft you confirm — nothing is saved without your click (consent-first). Live mode does the same via the VOX/PULSE adapters.</div>'
   +'<textarea id="mi_txt" style="width:100%;min-height:150px;border:1px solid var(--line);border-radius:9px;padding:10px" placeholder="Paste the email text here…"></textarea>'
   +'<div id="mi_out" style="margin-top:10px"></div>'
   +'</div>'
   +'<div class="mfoot"><button class="secondary" onclick="closeModal()">Close</button>'
   +'<button class="primary" onclick="mailParse()">Scrape it</button></div>',true);
};
window.mailParse=function(){
  var t=(document.getElementById('mi_txt')||{}).value||'';
  if(!t.trim()){toast('Paste the email first');return;}
  var low=t.toLowerCase();

function cbStuck(){

     +'</div>';}).join('')

function cbCompanyCard(code){
  var c=client(code)||{},d=deal(code);

  var Y=S.syn.filter(function(x){return x.code===code});

   +'<div class="cb-btns"><button class="cb-act" onclick="closeCb();openCompany(\''+esc(code)+'\')">Open profile</button>'

   +'<div class="cb-chips">'+chips+'</div></div>';

function findCompany(qs){
  qs=qs.toLowerCase().trim();if(!qs)return null;
  var hit=Object.entries(S.clients||{}).find(function(e){return e[0].toLowerCase()===qs});
  if(hit)return hit[0];
  hit=Object.entries(S.clients||{}).find(function(e){return e[1].name.toLowerCase().indexOf(qs)>-1});
  return hit?hit[0]:null;
}
function cbStageMove(low){
  /* "move <company> lending|syndication to <stage>" */
  var m=low.match(/move\s+(.+?)\s+(lending|syn(?:dication)?)\s+to\s+(.+)/);
  if(!m)return '<div class="cb-b">Say it like: <i>"move Sunvik lending to Sanctioned"</i> or <i>"move Sunvik syndication to IM Circulated"</i>.</div>';
  var code=findCompany(m[1]);
  if(!code)return '<div class="cb-b">Couldn’t find a client matching “'+esc(m[1])+'”.</div>';
  var line=m[2].indexOf('lend')===0?'lending':'syn';
  var list=line==='lending'?(S.ref['Lending Stage']||[]):(S.ref['Status of Proposal']||[]);
  var to=list.find(function(s){return s.toLowerCase()===m[3].trim()})||list.find(function(s){return s.toLowerCase().indexOf(m[3].trim())>-1});
  if(!to)return '<div class="cb-b">“'+esc(m[3])+'” isn’t a valid '+line+' stage. Valid: '+list.map(esc2).join(' · ')+'</div>';
  requestStage(code,line,to);
  return null;    /* requestStage already posted the reply via cbNote */
}
function cbHelp(){
  return '<div class="cb-b">I answer from the live Register.</div>';
}
window.cbAsk=function(text){
  text=(text||'').trim();if(!text)return;
  CB.msgs.push({who:'u',html:esc(text)});
  cbRender();
  var low=text.toLowerCase(),reply;
  if(/^(hi|hello|hey|help|\?)/.test(low)) reply=cbHelp();
  else if(/summary|book|pipeline|snapshot|dashboard/.test(low)) reply=cbSummary();
  else if(/stuck|attention|red|amber|today|worklist/.test(low)) reply=cbStuck();
  else if(/approval/.test(low)) reply=approvalsHtml();
  else if(/^move\s/.test(low)||/advance/.test(low)) reply=cbStageMove(low);
  else if(/mail|email|scrape/.test(low)){openMailIntake();reply='<div class="cb-b">Opening mail intake…</div>';}
  else if(/application|apply|onboard|form/.test(low)){openApplication();reply='<div class="cb-b">Opening the application form…</div>';}
  else{
    var code=findCompany(low.replace(/^(find|show|open)\s+/,''));
    reply=code?cbCompanyCard(code)
      :'<div class="cb-b">I didn’t catch that. '+ (low.length>2?'No client matches “'+esc(text)+'”. ':'') +'Type <b>help</b> for what I can do.</div>';
  }
  if(reply)CB.msgs.push({who:'b',html:reply});
  cbRender();
};

<script>
/* ============================================================================
   AUGMENT 16 — 🧰 TOOLS TAB + 📰 INDIA NEWS RADAR (all roles)
   ----------------------------------------------------------------------------
   A new "Tools" tab, visible to EVERY role, hosting utilities. The first and
   biggest: the India News Radar — one click scans news for every firm on the
   Register, their owners/promoters (watch terms you control per firm) and
   anything related, then triages RED / AMBER / GREEN exactly like PULSE.

   HOW SCANNING WORKS
     Online : the browser calls the GDELT DOC 2.0 API directly (free, keyless,
              CORS-open) — one query per watch term, newest articles first.
              This is the same source the PULSE microservice uses server-side;
              your india-news-scraper plugs in at fetchTerm() below (one
              function = one adapter).
     Offline / API unreachable: clearly-labelled DEMO headlines are generated
              so the workflow (triage → verdict → audit) stays demonstrable.
   Every scan and every analyst verdict is audited → Activity Log.
   ============================================================================ */
(function(){
'use strict';

/* ---------------- state ---------------- */
function news(){S.news=S.news||[];return S.news;}
function watch(){S.newswatch=S.newswatch||{};return S.newswatch;}   /* code -> [extra terms: owners, brands…] */
var SCAN={running:false,done:0,total:0,failTerms:0};
var NF={sev:'',q:''};

/* PULSE's triage engine, client-side (KEEP IN SYNC with services/pulse —
   taxonomy.py / matcher.py / polarity.py are the source of truth).
   Upgraded per the credit brief (PULSE_WHAT_WHY):
     · RED/AMBER extended with fraud-euphemism + stress-ladder vocabulary
     · NEW BLUE tier — policy/regulatory themes (no company name expected)
     · GOOD re-filed to genuine wins only
     · CONTEXT flip — 'good-sounding' events (fresh debt, OTS, pledge, stake
       sale, auditor change, big order) turn AMBER + review for LIVE borrowers
     · negation guards ("cleared of", "denies", "acquitted") suppress alerts
     · word-sense guards ("EV charging" is not a "charge")
   Golden Rule: recall over precision — a miss costs the loan. */
var N_RED=['fraud','frauds','fraudulent','defrauded','default','defaults','defaulter',
  'wilful defaulter','willful defaulter','insolvency','insolvent','bankruptcy','bankrupt',
  'arrest','arrested','raid','raids','raided','scam','npa','npas','money laundering',
  'cbi','ed probe','probe','fir','firs','embezzlement','embezzled','irregularity',
  'irregularities','misappropriation','shell company','shell entity','tax evasion',
  'forgery','fugitive','fraud case','loan fraud',
  /* credit-brief additions — enforcement euphemisms & instruments */
  'siphoning','siphoned','diversion of funds','round-tripping','round tripping',
  'fake itc','gst evasion','dggi','sfio','eow','lookout notice','lookout circular',
  'chargesheet','charge sheet','absconding','hawala','ponzi','forensic audit',
  'asset attachment','provisional attachment','sarfaesi','nclt','ibc','liquidation',
  'winding up','pmla','benami','circular trading','cross-default','event of default',
  'enforcement directorate'];
var N_AMBER=['litigation','lawsuit','court','penalty','penalties','fined','fine',
  'downgrade','downgraded','delay','delays','delayed','layoff','layoffs','strike',
  'dispute','disputes','show cause','showcause','investigation','investigated','shortfall',
  'recall','recalled','resignation','resigns','resigned','warning','summons','defaulted payment',
  /* credit-brief additions — the stress ladder + governance churn */
  'sma-0','sma-1','sma-2','special mention account','restructuring','restructured',
  'debt recast','recast','moratorium','one-time settlement','one time settlement','ots',
  'credit watch','rating withdrawn','covenant breach','dscr breach','dsra breach',
  'promoter pledge','share pledge','pledged shares','invocation of pledge',
  'discom dues','receivables from discom','auditor change','auditor resigns',
  'auditor resignation','new auditor appointed','qualified opinion','restatement',
  'accounting irregularity','cfo exit','cfo resigns','kmp resignation','gst notice',
  'it survey','pcb notice','almm delisting','roc charge','second charge','pari passu',
  'inter-corporate deposit','upstreaming','related party','related-party'];
/* BLUE — policy / regulatory themes: fire with ZERO company name (§2.5).
   These re-price whole portfolios; matched by theme, not by firm. */
var N_BLUE=['tariff order','tariff revision','true-up','serc','cerc','regulator order',
  'regulatory order','open access','demand charge','fixed charge','sub-metering',
  'cross-subsidy surcharge','ists waiver','connectivity regulation','rpo',
  'renewable purchase obligation','payment security mechanism','late payment surcharge',
  'almm','dcr','domestic content requirement','pli scheme','pli disbursement',
  'anti-dumping duty','safeguard duty','net metering','gross metering',
  'mnre notification','mop notification','gazette notification',
  'viability gap funding','vgf','must-run status','curtailment compensation',
  'deviation settlement','dsm regulation','green hydrogen incentive'];
/* GOOD — genuine wins ONLY. funding/raises/orders moved to CONTEXT below. */
var N_GOOD=['wins','win','won','bags','bagged','awarded','awards','award',
  'ppa signed','signs ppa','mou','commissions','commissioned','cod achieved',
  'inaugurates','inaugurated','inauguration','launches','launched','expansion','expands',
  'profit','profits','record','milestone','partnership','partners','tie-up','ipo',
  'listing','growth','surges','jumps','rises','upgrade','upgraded','credit upgrade',
  'accretive acquisition','wins order','wins contract','bags order'];
/* CONTEXT — 'good news' that is a red flag for a LIVE borrower (§2.4).
   name · trigger phrases · why credit tenses up */
var N_CONTEXT=[
  ['fresh_debt',['raises debt','fresh debt','raises funding','raised funding','secures loan',
    'secures funding','new loan','bridge loan','top-up loan','refinance','rollover',
    'raises capital','funding round','debt raise','funding','funded','raises','raised',
    'investment','invests'],
   'Borrower levering up elsewhere dilutes our cover — could be desperation funding or ever-greening.'],
  ['settlement',['one-time settlement','one time settlement','ots','settles with lender',
    'settlement with bank','debt settled'],
   'An OTS means a lender took a haircut — a default event, not a win.'],
  ['pledge',['pledges shares','share pledge','promoter pledge','pledged stake'],
   'Promoter share-pledging for cash is a classic early-distress signal.'],
  ['big_order',['wins huge order','bags order worth','wins order worth','largest order','record order'],
   'Over-trading: orders beyond funding capacity start working-capital blowups.'],
  ['stake_sale',['stake sale','sells stake','strategic investor','promoter stake','divests stake',
    'equity infusion'],
   'Could be growth — or a distress sale / promoter exit. Context decides.'],
  ['auditor_change',['auditor change','new auditor appointed','auditor appointed','changes auditor',
    'auditor resigns'],
   'Auditor churn often precedes a qualified opinion or fraud discovery.']];
/* negation guards — these must NOT raise an alert (§4.5) */
var N_NEG=['cleared of','clears','cleared','absolves','absolved','denies','denied','deny','refutes','refuted','rejects','no default',
  'not defaulted','acquitted','acquittal','exonerated','dismisses','dismissed','quashes',
  'quashed','clean chit'];
/* word-sense guards: keyword -> nearby phrases that suppress the wrong sense */
var N_SENSE={'charge':['charging station','ev charg','fast charg','battery charg','free of charge','in charge of','took charge'],
  'charges':['charging station','ev charg'],
  'default':['by default','default setting','default option','default mode'],
  'fine':['doing fine','works fine','fine print'],
  'strike':['strike price','strikes a deal'],
  'recast':['recasts its board','recasts board','recasts team']};

function _wordRe(arr){
  return new RegExp('\\b('+arr.map(function(w){
    return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/[\s-]+/g,'[\\s-]+');}).join('|')+')\\b','i');
}
var _RE_RED=_wordRe(N_RED), _RE_AMBER=_wordRe(N_AMBER), _RE_BLUE=_wordRe(N_BLUE),
    _RE_GOOD=_wordRe(N_GOOD), _RE_NEG=_wordRe(N_NEG);
var _RE_CTX=N_CONTEXT.map(function(c){return [c[0],_wordRe(c[1]),c[2]];});

/* Exposure lookup (§2.4): polarity is keyword × OUR RELATIONSHIP × context.
   A firm is a LIVE borrower when it has an own-book lending line that is not
   Rejected / On Hold — mirror of services/pulse watch_exposures.live. */
window.isLiveBorrower=function(code){
  try{
    var rows=(S.lending||[]).filter(function(r){return r.code===code});
    return rows.some(function(r){
      var st=String(r.stage||'').toLowerCase();
      return st && st!=='rejected' && st!=='on hold';});
  }catch(e){return false;}
};
function _negated(h,rx){
  /* a negator within ~70 chars BEFORE the keyword suppresses the alert */
  var m=rx.exec(h); if(!m)return false;
  var w=h.slice(Math.max(0,m.index-70),m.index);
  return _RE_NEG.test(w);
}
function _senseBlocked(h){
  var lh=h.toLowerCase();
  for(var k in N_SENSE){
    var kre=new RegExp('\\b'+k+'\\b','i');
    if(kre.test(lh)){
      var hit=N_SENSE[k].some(function(p){return lh.indexOf(p)>=0});
      if(hit)return kre;                     /* this keyword is the wrong sense */
    }
  }
  return null;
}
function classify(h,code){h=String(h||'');
  /* returns [SEVERITY, category]. SEVERITY: RED | AMBER | BLUE | GREEN
     category: adverse | watch | policy | context-review | positive | neutral
     Precedence: negation → RED → context-flip (live borrowers) → GOOD → AMBER → BLUE. */
  var senseRe=_senseBlocked(h);
  var red=_RE_RED.test(h)&&!(senseRe&&senseRe.test((_RE_RED.exec(h)||[''])[0]));
  if(red&&_negated(h,_RE_RED))red=false;                    /* "cleared of siphoning" */
  if(red)return ['RED','adverse'];
  /* context-dependent polarity: same headline, different meaning by relationship */
  var live=code?isLiveBorrower(code):false;
  for(var i=0;i<_RE_CTX.length;i++){
    if(_RE_CTX[i][1].test(h)){
      if(live)return ['AMBER','context-review'];            /* good-looking ≠ good (§2.4) */
      break;                                                /* pipeline name: fall through */
    }
  }
  if(_RE_GOOD.test(h))return ['GREEN','positive'];
  if(_RE_AMBER.test(h)){
    if(_negated(h,_RE_AMBER))return ['GREEN','neutral'];
    return ['AMBER','watch'];
  }
  if(_RE_BLUE.test(h))return ['BLUE','policy'];
  /* context phrase on a non-live name reads positive (we are chasing them) */
  for(var j=0;j<_RE_CTX.length;j++)if(_RE_CTX[j][1].test(h))return ['GREEN','positive'];
  return ['GREEN','neutral'];}
window.ctxReason=function(h){h=String(h||'');
  for(var i=0;i<_RE_CTX.length;i++)if(_RE_CTX[i][1].test(h))return _RE_CTX[i][2];

/* ---------------- adapters ---------------- */
/* THE seam: swap/add sources here (india-news-scraper, NewsAPI, RSS proxy…) */
/* ---- REAL NEWS FETCH ----------------------------------------------------
   GDELT is the source, but it sends no CORS header, so a browser cannot call
   it directly from file:// or a different origin — the request is blocked
   before any data arrives (that was the "Source unreachable" you saw).
   So we try, in order:
     0. the PRISM gateway's own PULSE proxy, if this page is served by it
        (server-side fetch — no CORS problem at all: the production path);
     1. GDELT directly (works when same-origin or CORS happens to be allowed);
     2. public CORS proxies (make it work from a bare file:// too).
   The FIRST endpoint that returns real articles wins. Still real data only —
   proxies just relay GDELT's own JSON; nothing is fabricated.
   config: window.NEWS_PROXY = 'https://your-proxy/?url=' overrides the list. */
function gdeltURL(term){
  return 'https://api.gdeltproject.org/api/v2/doc/doc?query='
    +encodeURIComponent('"'+term+'"')
    +'&mode=ArtList&maxrecords=12&format=json&sort=DateDesc&timespan=3m';
}
var PULSE_UP=null;   /* null=untried · true=PRISM gateway present · false=static host */
function newsEndpoints(term,dfrom,dto){
  var g=gdeltURL(term), enc=encodeURIComponent(g), list=[];
  var dr=(dfrom?'&from='+encodeURIComponent(dfrom):'')+(dto?'&to='+encodeURIComponent(dto):'');
  /* 0 — same-origin PULSE proxy, ONLY when a PRISM gateway is present.
     On a plain static host (python -m http.server, Netlify…) this path 404s,
     so after the first miss we remember that and never ask again this session. */
  if(location.protocol.indexOf('http')===0 && PULSE_UP!==false)
    list.push({k:'pulse',u:'/api/pulse/search?q='+encodeURIComponent(term)+dr});
  /* 1 — direct GDELT */
  list.push({k:'direct',u:g});
  /* 2 — configured proxy, then well-known public ones (make file:// / static work) */
  if(window.NEWS_PROXY)list.push({k:'proxy',u:window.NEWS_PROXY+enc});
  list.push({k:'proxy',u:'https://corsproxy.io/?url='+enc});
  list.push({k:'proxy',u:'https://api.allorigins.win/raw?url='+enc});
  return list;
}
function parseArticles(j){
  var arts=(j&&j.articles)|| (j&&j.contents&&JSON.parse(j.contents).articles) ||[];
  return arts.map(function(a){return{
      headline:a.title||a.headline||'',url:a.url||'',
      source:(a.source||a.domain||'')+(a.via?' \u00b7 '+a.via:''),
      when:(a.seendate||a.when||a.published_at||'').slice(0,8)};})
    .filter(function(a){return a.headline&&/^https?:\/\//i.test(a.url)});
}
function tryEndpoint(u,ms,userSignal){
  var sig;
  var to=(typeof AbortSignal!=='undefined'&&AbortSignal.timeout)?AbortSignal.timeout(ms||9000):undefined;
  if(userSignal&&typeof AbortSignal!=='undefined'&&AbortSignal.any)
    sig=AbortSignal.any([to,userSignal].filter(Boolean));   /* timeout OR user-stop */
  else sig=userSignal||to;
  return fetch(u,{signal:sig,headers:{'Accept':'application/json'}})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(t){
      var j;try{j=JSON.parse(t);}catch(e){throw new Error('non-JSON');}   /* HTML error page → skip */
      return parseArticles(j);
    });
}
function fetchTerm(term,dfrom,dto,userSignal){
  /* PRODUCTION RULE: returns REAL articles or throws — never fabricates. */
  var eps=newsEndpoints(term,dfrom,dto);
  var aborted=function(){return userSignal&&userSignal.aborted;};
  return new Promise(function(resolve,reject){
    var i=0,lastErr;
    (function next(){
      if(aborted()){var a=new Error('stopped');a.name='AbortError';return reject(a);}
      if(i>=eps.length)return reject(lastErr||new Error('all sources failed'));
      var ep=eps[i++];
      tryEndpoint(ep.u, ep.k==='pulse'?30000:9000, userSignal)  /* local server fetches the web — give it room */
        .then(function(arts){
          if(ep.k==='pulse')PULSE_UP=true;             /* gateway confirmed */
          resolve(arts);
        })
        .catch(function(e){
          if(aborted()){e.name='AbortError';return reject(e);}   /* user stopped — don't try more */
          if(ep.k==='pulse')PULSE_UP=false;            /* static host — stop asking */
          lastErr=e;next();
        });
    })();
  });
}
/* ---------------- the scan ---------------- */
function termsFor(code){
  var c=client(code)||{};
  return [c.name].concat(watch()[code]||[]).filter(Boolean);
}
function ingest(code,term,arts,mode){
  var added=0;
  arts.forEach(function(a){
    if(!a.headline)return;
    if(news().some(function(n){return (a.url&&n.url===a.url)||(n.headline===a.headline&&n.code===code)}))return;
    var cc=classify(a.headline,code);
    news().unshift({id:'N'+(news().length+1)+'-'+code,code:code,term:term,
      headline:a.headline,url:a.url,source:a.source,when:a.when,
      severity:cc[0],category:cc[1],mode:mode,verdict:null,at:now()});
    added++;
  });
  return added;
}
window.newsScanCompany=function(code,quiet){
  var terms=termsFor(code),fails=0;
  var chain=Promise.resolve(0);
  terms.forEach(function(term){
    chain=chain.then(function(total){
      return fetchTerm(term)
        .then(function(arts){return total+ingest(code,term,arts,'live');})
        .catch(function(){fails++;return total;});   /* real data only — never invent */
    });
  });
  return chain.then(function(total){
    SCAN.failTerms+=fails;
    save();
    if(!quiet){
      audit('News scan',code,terms.length+' terms · '+total+' new'+(fails?' · '+fails+' source failures':''));
      renderActive();
      stamp(fails===terms.length&&terms.length
        ?'News source unreachable — check the connection'
        :total+' new items for '+((client(code)||{}).name||code));
    }
    return total;
  });
};

/* BLUE-layer policy sweep (§2.5): themes × the firm's state — the news item
   will not name the firm; the DEPENDENCY is the match. Attached to the firm so
   triage sees which exposure it re-prices. */
var POLICY_THEMES=['tariff order','open access charges','net metering policy','ALMM',
  'payment security mechanism DISCOM','anti-dumping duty solar'];
window.newsPolicyScan=function(code){
  var c=client(code)||{};if(!c.state){toast('Set the firm\u2019s State first \u2014 policy risk is state-scoped');return;}
  var got=0,chain=Promise.resolve();
  POLICY_THEMES.forEach(function(theme){
    var q=theme+' '+c.state;
    chain=chain.then(function(){
      return fetchTerm(q).then(function(arts){got+=ingest(code,'policy: '+q,arts,'scan');})
        .catch(function(){SCAN.failTerms++;});
    });
  });
  chain.then(function(){
    audit('News scan',code,'policy sweep ('+c.state+') \u00b7 '+got+' new');
    save();renderActive();

<script>
/* ============================================================================
   AUGMENT 17 — PRODUCTION HARDENING PACK
   · Real-data migration: any previously stored demo news is purged on load.
   · Storage safety: saves are quota-guarded — a full disk warns, never
     silently loses work.
   · Global error trap: an unexpected script error surfaces as a toast
     (max once/minute) instead of a dead screen.
   · Backup & Restore: full-state JSON out / in (Tools tab), audited.
   ============================================================================ */
(function(){
'use strict';

/* real data only — purge demo items left by earlier versions */
try{
  var before=(S.news||[]).length;
  S.news=(S.news||[]).filter(function(n){return n.mode!=='demo'&&n.url});
  if(S.news.length!==before){try{save()}catch(e){}}
}catch(e){}

/* quota-guarded save */
var ORIG_SAVE=save;
save=function(){
  try{ORIG_SAVE();}
  catch(e){try{toast('⚠ Local storage is full — Tools → 💾 Backup, then clear old items');}catch(_){}}
};

/* global error trap — no silent white screens */
var lastErr=0;
window.addEventListener('error',function(){
  var t=Date.now();if(t-lastErr<60000)return;lastErr=t;
  try{toast('Something went wrong — that action may not have saved. Check Audit.');}catch(e){}
});
window.addEventListener('unhandledrejection',function(ev){
  if(ev&&ev.preventDefault)ev.preventDefault();   /* scan failures are already surfaced in-UI */
});

/* backup: the entire state, timestamped */
window.backupState=function(){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
  a.download='ATLAS_backup_'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  audit('Exported','','full state backup');stamp('Backup downloaded — keep it somewhere safe');
};
/* restore: validated, confirmed, audited */
window.restoreState=function(ev){
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  ev.target.value='';
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||typeof d!=='object'||!d.clients||!d.deals)throw new Error('shape');
      if(!confirm('Replace ALL current data with this backup? This cannot be undone.'))return;
      /* mutate the existing state object in place so every reference updates
         (S is a shared lexical binding — reassigning window.S would not) */
      Object.keys(S).forEach(function(k){delete S[k];});
      Object.assign(S,d);save();
      audit('Imported','','state restored from backup file');
      renderTabs();renderActive();stamp('Backup restored');
    }catch(e){toast('That file is not a valid ATLAS backup');}
  };
  r.readAsText(f);
};
})();
</script>

(function(){
'use strict';

function api(path, method, body){
  return fetch(path,{method:method||'GET',
    headers:body?{'Content-Type':'application/json'}:undefined,

      return r.json().then(function(j){return {ok:r.ok,data:j};});
    });
}

}

};

  if(!confirm('Clear all stored firm news ('+n+' items)? This starts the radar fresh — scans and verdicts are removed.'))return;
  S.news=[];
  audit('News cleared','','all firm news ('+n+' items)');
  if(typeof save==='function')save();
  renderActive();stamp('All firm news cleared');
};

/* email the CURRENT firm-news feed (already scanned) grouped by company */
window.openEmailAllFirms=function(){
  if(location.protocol.indexOf('http')!==0){toast('This needs the ATLAS server — run atlas_serve.py');return;}
  var arts=newsArr();
  if(!arts.length){toast('Scan firms first — nothing to email');return;}
  var reds=arts.filter(function(a){return a.severity==='RED'}).length;
  var ambs=arts.filter(function(a){return a.severity==='AMBER'}).length;
  openModal('<div class="mhead"><h2>📧 Email all-firms news</h2><button class="x" onclick="closeModal()">×</button></div>'
   +'<div class="mbody">'
   +'<div class="hint" style="margin-bottom:8px">Emails the current radar feed — <b>'+arts.length+'</b> items across the firms you’ve scanned ('
   +'<b style="color:var(--bad)">'+reds+'</b> ugly · <b style="color:var(--warn)">'+ambs+'</b> bad), grouped by company and colour-coded.</div>'
   +'<div class="fld"><label>Recipients (comma / new-line)</label>'
   +'<textarea id="ef_to" style="width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:9px" placeholder="risk@evam.com, board@evam.com"></textarea></div>'
   +'<div class="fld" style="margin-top:8px"><label>Subject</label>'
   +'<input id="ef_subj" value="ATLAS — all-firms news digest"></div>'
   +'<div class="consent" style="margin-top:8px"><label><input type="checkbox" id="ef_adv"> 🔴 Only adverse (bad / ugly) — a tight risk digest</label></div>'
   +'<div id="ef_msg" class="hint" style="margin-top:8px"></div>'
   +'</div>'
   +'<div class="mfoot"><button class="secondary" onclick="closeModal()">Cancel</button>'
   +'<button class="primary" id="ef_send" onclick="sendEmailAllFirms()">Send digest</button></div>',true);
};
window.sendEmailAllFirms=function(){
  var to=(document.getElementById('ef_to')||{}).value||'';
  var subj=(document.getElementById('ef_subj')||{}).value||'';
  var adv=(document.getElementById('ef_adv')||{}).checked;
  if(!to.trim()){toast('Add at least one recipient');return;}
  /* group the feed by company (Group Code) into the server's digest shape */
  var by={};
  newsArr().forEach(function(n){
    var name=(client(n.code)||{}).name||n.code||'—';
    (by[name]=by[name]||[]).push({title:n.headline,url:n.url,source:n.source,
      when:n.when,via:'',severity:(n.severity==='RED'?'UGLY':n.severity==='AMBER'?'BAD':'GOOD')});
  });
  var groups=Object.keys(by).map(function(k){return {term:k,articles:by[k]};});
  var btn=document.getElementById('ef_send'); if(btn){btn.disabled=true;btn.textContent='Sending…';}
  fetch('/api/pulse/email_digest',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({recipients:to,subject:subj,groups:groups,adverse_only:adv})})
   .then(function(r){return r.json().then(function(j){return{ok:r.ok,d:j};});})
   .then(function(r){
     if(r.ok&&r.d.ok){audit('News emailed','','all firms — '+r.d.firms+' firms / '+r.d.count+' items → '+to.replace(/\s+/g,' '));
       stamp('All-firms digest emailed');closeModal();}
     else{var m=document.getElementById('ef_msg');if(m)m.innerHTML='<b style="color:var(--bad)">'+esc((r.d&&r.d.message)||'Failed')+'</b>';
       if(btn){btn.disabled=false;btn.textContent='Send digest';}}
   }).catch(function(){var m=document.getElementById('ef_msg');if(m)m.innerHTML='<b style="color:var(--bad)">Could not reach the server.</b>';
     if(btn){btn.disabled=false;btn.textContent='Send digest';}});
};
})();
