<title>EVAM ATLAS · v17</title>
<style>
:root{
  --navy:#1B2A4A; --navy2:#233659; --teal:#0D7377; --teal-hi:#12917E;
  --paper:#F3F5F6; --card:#FFFFFF; --line:#E2E7EA; --ink:#17222B; --muted:#5F6E76;
  --lend:#1F6FA8; --synd:#7A4FC4; --am:#C47A1F;
  --ok:#2E7D4F; --okbg:#E8F4EC; --warn:#C98A1B; --bad:#B3432B; --badbg:#FBEBE7; --r:9px;
  --m1:#E0B400; --m2:#E07B1F; --m3:#2D6FC4; --m4:#2E7D4F; --m5:#B3432B;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;font-size:13.5px}
button{font:inherit;cursor:pointer} input,select,textarea{font:inherit;color:var(--ink)}
body.authless header,body.authless nav{display:none}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;background:var(--navy);color:#fff;display:flex;align-items:center;gap:13px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:700;font-size:17px;letter-spacing:.6px;cursor:pointer}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--teal-hi);align-self:center}
.brand small{font-weight:400;font-size:10.5px;color:#9FB3BA}
#saveInd{font-size:11.6px;color:#8FE3C2;opacity:0;transition:opacity .5s;white-space:nowrap}
#saveInd.show{opacity:1}
.searchwrap{flex:1;min-width:150px;max-width:380px}
.searchwrap input{width:100%;padding:7px 12px;border-radius:8px;border:1px solid #2C4260;background:#132C43;color:#fff;font-size:13px}
.searchwrap input::placeholder{color:#7F959C}
.hright{display:flex;align-items:center;gap:9px;margin-left:auto}
.hright select{background:#132C43;color:#fff;border:1px solid #2C4260;border-radius:8px;padding:6px 9px;font-size:12.5px}
.ghost{background:transparent;border:1px solid #3A5273;color:#C8D6E2;border-radius:8px;padding:6px 10px;font-size:12px}
.ghost:hover{border-color:var(--teal-hi);color:#fff}
nav{display:flex;gap:2px;background:var(--navy2);padding:0 14px;overflow-x:auto;position:sticky;top:52px;z-index:55}
nav button{background:none;border:none;color:#B8C9CE;padding:11px 13px;font-size:12.8px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav button.active{color:#fff;border-bottom-color:var(--teal-hi)}
main{max-width:1500px;margin:0 auto;padding:16px 18px 70px}
/* ---------- login ---------- */
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#16233E 0%,#1B2A4A 55%,#0D3B3E 100%);padding:20px}
.logincard{background:#fff;border-radius:16px;padding:38px 40px 34px;width:100%;max-width:400px;box-shadow:0 24px 70px rgba(5,12,25,.5);text-align:center}
.logomark{width:58px;height:58px;border-radius:14px;background:var(--teal);color:#fff;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;letter-spacing:-1px}
.logincard h1{margin:0;font-size:21px;color:var(--navy)}
.logincard .sub{color:var(--muted);font-size:12.6px;margin:5px 0 22px}
.logincard input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
.logincard .primary{width:100%;padding:11px}
.orline{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;margin:15px 0}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;font-size:13.2px;font-weight:600}
.gbtn:hover{background:#F7F9FA}
.loginfoot{margin-top:18px;font-size:10.8px;color:var(--muted)}
/* ---------- launcher ---------- */
.homewrap{max-width:960px;margin:0 auto;padding:34px 8px}
.homewrap h1{font-size:21px;color:var(--navy);margin:0 0 4px}
.homewrap .sub{color:var(--muted);margin-bottom:22px;font-size:13px}
.launch{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}
.ltile{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:22px 22px 18px;cursor:pointer;transition:box-shadow .15s,transform .15s;text-align:left}
.ltile:hover{box-shadow:0 10px 26px rgba(15,30,50,.12);transform:translateY(-2px)}
.ltile .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;margin-bottom:12px}
.ltile h3{margin:0;font-size:15.5px;color:var(--navy)}
.ltile p{margin:4px 0 0;color:var(--muted);font-size:12.3px}
/* ---------- tiles / panels ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:11px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .lab{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.tile .val{font-size:21px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.tile.accent{border-top:3px solid var(--teal)}
.tieout{background:#10281F;color:#CFE9DC;border-radius:var(--r);padding:11px 15px;margin-bottom:14px;display:flex;gap:22px;flex-wrap:wrap;align-items:center;font-variant-numeric:tabular-nums}
.tieout b{color:#fff}.tieout .pass{color:#5AD79A;font-weight:700}.tieout .fail{color:#FF8E7A;font-weight:700}
.tieout .cap{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:#8FB8A4;font-weight:700}
.panelrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.panelrow{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:12px}
.panel h3{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12.3px}
.bar .n{width:132px;color:var(--muted)}.bar .track{flex:1;background:#EEF2F3;border-radius:4px;height:15px;overflow:hidden}
.bar .fill{height:100%;background:var(--teal)}.bar .v{width:118px;text-align:right;font-variant-numeric:tabular-nums}
/* ---------- toolbar / grid ---------- */
.toolbar{display:flex;align-items:center;gap:9px;margin:2px 0 10px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.primary{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:600;font-size:12.8px}
.primary:hover{background:var(--teal-hi)}
.secondary{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12.5px}
.danger{background:#fff;border:1px solid #E5B8AE;color:var(--bad);border-radius:8px;padding:7px 12px;font-size:12.5px}
.hint{font-size:11.6px;color:var(--muted)}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12.6px}
th{position:sticky;top:0;background:#F7F9FA;text-align:left;padding:8px 9px;font-size:10.6px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;z-index:5}
.hsort{cursor:pointer}.hsort:hover{color:var(--teal)}
.funnel{cursor:pointer;margin-left:4px;opacity:.5;font-size:10px}
.funnel:hover{opacity:1;color:var(--teal)}
.funnel.fon{opacity:1;color:var(--teal);font-weight:800}
td{padding:7px 9px;border-bottom:1px solid #EFF2F4;vertical-align:middle;white-space:nowrap}
td.wrap{white-space:normal;min-width:170px;max-width:330px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:#F4FAF9}
tr.gray td{color:#9AA6AC;background:#FAFBFB}
tr.hl td{background:#E9F6F2}
tr.rowok td{background:var(--okbg)}
tr.rowbad td{background:var(--badbg);color:#7C4A3E}
tr.rowhold td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.code{font-family:ui-monospace,Consolas,monospace;font-size:11.4px;color:var(--teal);font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:10.8px;font-weight:700}
.pill.mit{background:#E4F1EC;color:#22684A}.pill.adp{background:#E8ECF8;color:#39518F}
.pill.hot{background:#FBE9E4;color:#A93B22}.pill.warm{background:#FBF3E1;color:#8F6512}.pill.cold{background:#EDF1F3;color:#5F6E76}
.flag{display:inline-block;border-radius:5px;padding:2px 7px;font-size:10.4px;font-weight:700;color:#fff;margin-right:3px}
.flag.off{opacity:.16}
.f-lend{background:var(--lend)}.f-synd{background:var(--synd)}.f-am{background:var(--am)}
select.inline,input.inline{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 5px;font-size:12.2px;max-width:170px}
select.inline:hover,input.inline:hover,select.inline:focus,input.inline:focus{border-color:var(--line);background:#fff;outline:none}
.count{font-size:11.5px;color:var(--muted);padding:7px 11px}
/* ---------- filter popover ---------- */
.pop{position:fixed;z-index:130;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 38px rgba(10,20,35,.25);padding:11px;width:230px;font-size:12.3px}
.pop input[type=text]{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:7px;font-size:12.3px}
.pop .vals{max-height:190px;overflow:auto;border-top:1px solid #F0F3F4;padding-top:6px}
.pop label{display:flex;gap:7px;align-items:center;padding:3px 1px;cursor:pointer}
.pop .prow{display:flex;gap:7px;justify-content:flex-end;margin-top:9px}
/* ---------- drawer ---------- */
#drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:100vw;background:#fff;z-index:100;box-shadow:-18px 0 48px rgba(10,20,35,.22);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
#drawer.open{transform:none}
.dhead{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dhead h2{margin:0;font-size:15.6px;flex:1;min-width:120px}
.dhead .x{background:none;border:none;font-size:19px;color:var(--muted)}
.dbody{flex:1;overflow:auto;padding:13px 18px 30px}
.dr-card{border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:11px}
.dr-card h4{margin:0 0 9px;font-size:10.6px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.g1{display:grid;grid-template-columns:1fr;gap:8px}
.fld label{display:block;font-size:10.4px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin:0 0 3px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12.8px;background:#fff}
.fld textarea{resize:vertical;min-height:52px}
.dfoot{padding:11px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.note{padding:7px 0;border-bottom:1px solid #F0F3F4;font-size:12.5px}
.note .meta{color:var(--muted);font-size:10.8px;margin-bottom:2px}
.addrow{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.addrow input,.addrow select{border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.3px}
.addrow input{flex:1;min-width:110px}
/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,26,42,.55);z-index:110;display:none;align-items:flex-start;justify-content:center;padding:34px 14px;overflow:auto}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;max-width:820px;width:100%;box-shadow:0 18px 50px rgba(10,20,35,.35)}
.modal.wide{max-width:1000px}
.mhead{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line)}
.mhead h2{margin:0;font-size:16px}
.mhead .x{margin-left:auto;background:none;border:none;font-size:19px;color:var(--muted)}
.mbody{padding:16px 20px;max-height:72vh;overflow:auto}
.mfoot{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;align-items:center}
.sect{margin:15px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--teal);font-weight:800;border-top:1px solid var(--line);padding-top:12px}
.prodbox{border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin:9px 0}
.prodbox.dis{opacity:.42}
.prodbox.dis .pbody{pointer-events:none}
.ptitle{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px;margin-bottom:9px}
.redbox{background:#FBE9E4;border:1px solid #EFC5B8;color:#8F2F1B;border-radius:8px;padding:9px 12px;font-size:12.4px;margin:0 0 10px}
.phblock{border:1px dashed #C9D2D6;border-radius:9px;padding:13px 15px;margin-bottom:10px;color:var(--muted);font-size:12.6px}
.phblock b{color:var(--ink)}
/* ---------- matrix ---------- */
.legend{display:flex;gap:15px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 13px;margin-bottom:10px;font-size:12px;color:var(--muted)}
.ld{display:inline-flex;align-items:center;gap:6px}
.dotc{width:17px;height:17px;border-radius:50%;border:1.6px solid #C9D2D6;display:inline-block;cursor:pointer;background:#fff}
.dotc.s1{background:var(--m1);border-color:var(--m1)}
.dotc.s2{background:var(--m2);border-color:var(--m2)}
.dotc.s3{background:var(--m3);border-color:var(--m3)}
.dotc.s4{background:var(--m4);border-color:var(--m4)}
.dotc.s5{background:var(--m5);border-color:var(--m5)}
.dotc:hover{transform:scale(1.22)}

table.matrix{width:auto}
table.matrix th.co,table.matrix td.co{position:sticky;left:0;background:#fff;z-index:6;min-width:210px;max-width:250px;white-space:normal;border-right:1px solid var(--line);box-shadow:2px 0 5px rgba(0,0,0,.05)}
table.matrix th.co{background:#F7F9FA;z-index:8}
table.matrix th.lh{height:118px;vertical-align:bottom;padding:6px 3px;cursor:grab;min-width:36px}
table.matrix th.lh span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.2px;letter-spacing:.3px;display:inline-block;max-height:108px;overflow:hidden}
table.matrix th.lh.dragover{background:#E9F6F2}
table.matrix td.cell{text-align:center;padding:5px 3px}
.mco b{cursor:pointer}.mco b:hover{color:var(--teal)}
.mco .sub{font-size:10.8px;color:var(--muted)}
/* ---------- misc ---------- */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;z-index:150;display:none}
.rolegate .rmonly{display:none!important}
.empty{padding:26px;text-align:center;color:var(--muted)}

}
/* matrix filter bar */
.mfbar{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 13px;margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.schip .cnt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}

.dwell{width:56px;border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:12px}

.scorebar{display:inline-block;height:9px;border-radius:5px;background:var(--teal);vertical-align:middle}
.mini{font-size:11px;color:var(--muted)}
.wk{display:flex;gap:14px;align-items:flex-end}

.pbar{display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}

const KEY='evam_atlas_console_v7';
let S, USER={name:'Kannan',full:'Kannan (Admin)',role:'Admin'}, cur='login', mDrag=null;
function seed(){return JSON.parse(JSON.stringify({...DATA,audit:[{t:now(),by:'System',act:'Seeded',code:'',detail:'Register seeded from ATLAS v3 (structured lender rows, 11-Jul-26)'}],notes:{},q:'',hl:'',lenderOrder:DATA.lenders37.slice()}))}
function load(){try{const s=localStorage.getItem(KEY);if(s){S=JSON.parse(s);S.q='';if(!S.lenderOrder)S.lenderOrder=DATA.lenders37.slice();return}}catch(e){}S=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function resetData(){if(!confirm('Reset to the ATLAS v2 seed? Local edits will be discarded.'))return;try{localStorage.removeItem(KEY)}catch(e){};S=seed();show('home');stamp('Demo reset')}
function exportData(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='evam_atlas_export.json';a.click()}
/* ================= utils ================= */
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=+v;return isFinite(n)?n:0}
function fmt(v,d){return num(v).toLocaleString('en-IN',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})}
function today(){return new Date().toISOString().slice(0,10)}
function now(){return new Date().toISOString().slice(0,16).replace('T',' ')}
function stamp(m){const e=$('saveInd');if(!e)return;e.textContent='✓ '+m+' · '+new Date().toTimeString().slice(0,5);e.classList.add('show');clearTimeout(e._h);e._h=setTimeout(()=>e.classList.remove('show'),2500);save()}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600)}
function normName(s){return String(s||'').toLowerCase().replace(/\b(private|pvt|limited|ltd|llp|india|energy|energies|solutions?|services?|technologies|technology|ventures?|renewables?)\b/g,'').replace(/[^a-z0-9]/g,'')}
function audit(act,code,detail){S.audit.unshift({t:now(),by:roleName(),act,code,detail});if(S.audit.length>800)S.audit.pop();save()}
function roleName(){return USER.full||USER.name}
function fullOf(n){const p=(S.people||[]).find(p=>p.name===n||p.full===n);return p?p.full:n}
function setUser(n){USER=S.people.find(p=>p.full===n||p.name===n)||S.people[0];document.body.classList.toggle('rolegate',USER.role==='Management');renderActive()}

function daysSince(d){if(!d)return null;return Math.max(0,Math.round((Date.now()-new Date(d).getTime())/864e5))}

const GS={},GC={};
function gstate(id){return GS[id]||(GS[id]={sort:null,f:{}})}
function grid(id,cols,rows,rowAttrs){
  GC[id]={cols,rows};const st=gstate(id);
  let out=rows.filter(r=>cols.every(c=>{const f=st.f[c.k];if(!f)return true;const v=String(c.get(r)??'');
    if(f.q&&!v.toLowerCase().includes(f.q.toLowerCase()))return false;
    if(f.vals&&f.vals.length&&!f.vals.includes(v))return false;return true}));
  if(st.sort){const c=cols.find(x=>x.k===st.sort.k),d=st.sort.dir;
    out=out.slice().sort((a,b)=>{let x=c.get(a),y=c.get(b);
      if(c.type==='num'){x=num(x);y=num(y)}else{x=String(x??'').toLowerCase();y=String(y??'').toLowerCase()}
      return(x<y?-1:x>y?1:0)*d})}
  const head=cols.map(c=>{const s=st.sort&&st.sort.k===c.k?(st.sort.dir>0?' ▲':' ▼'):'';
    const on=st.f[c.k]&&(st.f[c.k].q||(st.f[c.k].vals&&st.f[c.k].vals.length));
    return`<th><span class="hsort" onclick="gsort('${id}','${c.k}')">${c.label}${s}</span><span class="funnel${on?' fon':''}" onclick="gfilter(event,'${id}','${c.k}')">⏷</span></th>`}).join('');
  const body=out.map(r=>`<tr ${rowAttrs?rowAttrs(r):''}>${cols.map(c=>`<td data-label="${c.label}" class="${c.cls||''}">${c.render?c.render(r):esc(c.get(r))}</td>`).join('')}</tr>`).join('');
  return`<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body||`<tr><td colspan="${cols.length}"><div class="empty">Nothing matches. Clear filters or search.</div></td></tr>`}</tbody></table><div class="count">${out.length} of ${rows.length} rows</div></div>`}
function gsort(id,k){const st=gstate(id);st.sort=(st.sort&&st.sort.k===k)?(st.sort.dir>0?{k,dir:-1}:null):{k,dir:1};renderActive()}
function gfilter(e,id,k){e.stopPropagation();closePop();
  const {cols,rows}=GC[id],c=cols.find(x=>x.k===k),st=gstate(id);st.f[k]=st.f[k]||{q:'',vals:[]};
  const vals=[...new Set(rows.map(r=>String(c.get(r)??'')))].sort().slice(0,45);
  const p=document.createElement('div');p.className='pop';p.id='pop';
  p.innerHTML=`<input type="text" placeholder="Contains…" value="${esc(st.f[k].q)}" oninput="GS['${id}'].f['${k}'].q=this.value;renderActive()">
   <div class="vals">${vals.map(v=>`<label><input type="checkbox" ${st.f[k].vals.includes(v)?'checked':''} onchange="gtogglev('${id}','${k}',this)" value="${esc(v)}">${v===''?'<i>(blank)</i>':esc(v)}</label>`).join('')}</div>
   <div class="prow"><button class="secondary" onclick="GS['${id}'].f['${k}']={q:'',vals:[]};closePop();renderActive()">Clear</button>
   <button class="primary" onclick="closePop()">Done</button></div>`;
  document.body.appendChild(p);
  const r=e.target.getBoundingClientRect();p.style.top=Math.min(r.bottom+6,innerHeight-330)+'px';p.style.left=Math.min(r.left-90,innerWidth-250)+'px';
  p.onclick=ev=>ev.stopPropagation()}

function maxState(o){return Math.max(o.s||0,...(o.h||[]).map(x=>x.s||0))}
function lenderStats(){
  const st={};S.lenderOrder.forEach(l=>st[l]={shown:0,ims:0,resp:0,appr:0,decl:0,open:0,respDays:[],s2dwell:[]});
  Object.entries(S.matrix).forEach(([c,cells])=>Object.entries(cells).forEach(([l,o])=>{
    if(!st[l])return;const mx=maxState(o);
    if(mx>=1)st[l].shown++;if(mx>=2)st[l].ims++;
    if(mx>=3)st[l].resp++;if(mx>=4)st[l].appr++;if(o.s===5||mx===5)st[l].decl++;
    if(o.s>=1&&o.s<=3)st[l].open++;
    if(o.s===2)st[l].s2dwell.push(daysSince(o.since));
    const h=o.h||[];const t2=h.find(x=>x.s===2);const t3=h.find(x=>x.s>=3&&t2&&new Date(x.t)>=new Date(t2.t));
    if(t2&&t3)st[l].respDays.push(Math.round((new Date(t3.t)-new Date(t2.t))/864e5));}));
  const maxOpen=Math.max(1,...Object.values(st).map(x=>x.open));
  Object.values(st).forEach(x=>{
    x.respRate=x.ims?x.resp/x.ims:0;x.apprRate=x.ims?x.appr/x.ims:0;x.declRate=x.ims?x.decl/x.ims:0;
    x.med=median(x.respDays);
    const speed=x.med==null?0.5:Math.max(0,Math.min(1,1-x.med/30));
    x.score=Math.round(100*(0.4*x.apprRate+0.3*x.respRate+0.2*speed+0.1*(x.open/maxOpen)));});
  return st}
function attention(){
  const T=S.th,out=[];
  const push=(rule,sev,code,owner,days,why,isLead)=>out.push({rule,sev,code,owner,days,why,isLead});
  S.leads.filter(l=>l.status==='Active').forEach(l=>{const d=daysSince(l.last);
    if(d!=null&&d>T.staleLead)push('BN-01 Stale lead','amber',l.id,l.rm||'—',d,`no touch in ${d}d`,l.company)});
  S.lending.filter(r=>['Data Awaited','Diligence','Note Circulated'].includes(r.stage)).forEach(r=>{const d=daysSince(r.updated);
    if(d!=null&&d>T.lendAmber)push('BN-02 Lending stuck',d>T.lendRed?'red':'amber',r.code,r.an||r.rm||'—',d,`${r.stage} for ${d}d`)});
  Object.entries(S.matrix).forEach(([c,cells])=>Object.entries(cells).forEach(([l,o])=>{const d=daysSince(o.since);
    if(o.s===1&&d>T.showcase)push('BN-03 Showcase pending','amber',c,(deal(c)||{}).rm||'—',d,`${l} identified ${d}d ago, IM not sent`);
    if(o.s===2&&d>T.lenderSilent)push('BN-04 Lender silent','amber',c,(deal(c)||{}).rm||'—',d,`${l}: IM out ${d}d, no response`);
    if(o.s===3&&d>T.ballUs)push('BN-05 Ball with us','red',c,(deal(c)||{}).an||'—',d,`${l}: queries pending our reply ${d}d`)}));
  S.lending.filter(r=>['Sanctioned','Documentation'].includes(r.stage)).forEach(r=>{const d=daysSince(r.sanc);
    if(d!=null&&d>T.undisb)push('BN-06 Sanctioned, undisbursed','red',r.code,r.an||'—',d,`sanctioned ${d}d ago`)});
  const lit=new Set(Object.entries(S.matrix).filter(([c,v])=>Object.keys(v).length).map(([c])=>c));
  [...new Set(S.syn.filter(r=>!SYN_TERM.includes(r.status)&&!SYN_CLOSED.includes(r.status)).map(r=>r.code))].forEach(c=>{
    if(!lit.has(c))push('BN-07 Mandate, no outreach','amber',c,(deal(c)||{}).rm||'—',null,'live ask, zero lenders lit')});
  const touched={};S.audit.forEach(a=>{if(a.code&&!touched[a.code])touched[a.code]=a.t});

  return out}

function matrixCsv(){
  const codes=[...new Set(S.syn.map(r=>r.code))].filter(c=>match(client(c).name,c));
  const live=c=>synRows(c).some(r=>!SYN_TERM.includes(r.status));
  let list=codes; if(synFilter==='Live')list=list.filter(live);

  list.forEach(c=>S.lenderOrder.forEach(l=>{const o=cellObj(c,l);if(!o)return;
    if(MF.noout)return;
    if(anyFilter()&&!cellHit(c,l))return;
    rows.push([client(c).name,c,l,MLAB[o.s],o.since,daysSince(o.since),offLive(c)])}));
  if(MF.noout)list.filter(c=>live(c)&&S.lenderOrder.every(l=>!cellS(c,l))).forEach(c=>rows.push([client(c).name,c,'(none)','No outreach','','',offLive(c)]));

function mCycle(code,lender){if(USER.role==='Management')return;
  const m=S.matrix[code]=S.matrix[code]||{};const cur=m[lender]?m[lender].s:0;const s=(cur+1)%6;

  else{const o=m[lender]||{h:[]};o.s=s;o.since=today();(o.h=o.h||[]).push({s,t:today(),by:roleName()});m[lender]=o}
  audit('Matrix',code,`${lender} → ${MLAB[s]}`);renderActive();stamp(client(code).name+' · '+lender+' → '+MLAB[s])}

  if(p==='Lending'){d.lend=true;S.lending.unshift({id:'L'+Date.now(),code,amt,rm:d.rm,an:d.an,stage:'Data Awaited',updated:today(),sanc:null,pendingWith:'',h:[{stage:'Data Awaited',t:today(),by:roleName()}],createdAt:today(),remarks:''})}
  if(p==='Syndication'){d.syn=true;S.syn.unshift({id:'S'+Date.now(),code,toi:'',rm:d.rm,an:d.an,lc:'',pri:'Medium',status:'Deal Sourced',amt,line:'',synType:'',mstat3:'',fac:'',tenor:'',mstat:'',pot:'',im:'Work not started',sancL:'',ipL:'',dos:null,mos:'',nature:'',exist:'',price:'',pendingWith:'',h:[{status:'Deal Sourced',t:today(),by:roleName()}],createdAt:today(),remarks:''})}
  if(p==='Asset Monetisation'){d.am=true;S.am.unshift({id:'A'+Date.now(),code,state:client(code).state,val:amt,mw:0,nature:'Seller',dtype:'',inv:'',itype:'',status:'Teaser Prepared',teaser:null,createdAt:today(),notes:''})}

<script>
/* ============================================================
   ATLAS v7 OVERLAY
   ============================================================
   Design authority for PRISM. Reads Kannan's baseline state
   (window.S) and layers UI + workflow improvements on top.

   v7 changes over v6:
     - Fixed Lead drawer bug: openLead accepts ID string as
       baseline grid calls it (was silently failing since v3).
     - QA harness rewritten to simulate actual clicks not string checks.
     - Dashboard nuances added: business-line composition by climate
       lens (stacked), lead touches by recency window (7d/15d/30d/90d),
       syndication most-advanced-stage-reached funnel.
     - Default user = Kannan (Admin) on first load.
     - logChase prompts for note and writes outbound interaction
       (symmetric with logResp inbound).
     - Chase list lender rows get tinted background + hover.
     - Employee name click on Employee Master filters Dashboard.
     - Full SIDBI reference removal at build time + runtime safety net.

   Structure (nav order: business first, masters last):
     A. TABS       — home, today, dash, leads, deals, lend, syn,
                     am, fi, clients, emp, audit
     B. RBAC       — ROLE_TABS + scopedS() + writeOK()
     E-G. Syndication — chase list (attention strip + collapsed cards
                        with hierarchical indent + tint), matrix
                        locked read-only, register lender-wise with
                        dot density + click-through
     H. FI tab     — table + card modes, sortable, notes editable
     H2. Employee master — table + card modes, book rollup per person,
                        name click filters Dashboard
     I. Ledger     — S.interactions[] root array, log via modal on
                     Lead / Deal / Company drawer (inserted before
                     drawer footer, works from grid ID click)
     J. Two clocks — Contact clock from ledger, Stage clock from
                     existing attention() engine
     K. Lending    — push-to-Deals toolbar (only when there's work)
     M. Today      — scoped to user's book, one-column layout
     N. Dashboard  — closed/pipe tiles, sector composition, business
                     line by lens, geography rollup, syn funnel,
                     velocity, lead touch recency, sourcing (full
                     8-value taxonomy), RM origination table separate
                     from Analyst throughput, bank engagement.
                     Optional filter to a single person's book.

   Wrapping convention:
     - window.ORIG_foo captures baseline foo before overlay redefines.
     - We rewrap: setUser, renderTabs, renderActive, mCycle, vSyn,
       vLend, vAM, openLead, openCompany, doPush, save.
     - New functions (no baseline collision): vFI, vEmp, vToday,
       vDashV4, vSynChase, vSynReg, openBank, logInteraction, etc.

   For handoff: search "ORIG_" to see every place we extend baseline.
============================================================ */

/* --------- A. TABS: add today+fi, resequence AM after Syn --------- */
(function reseqTabs(){
  const findIdx=id=>TABS.findIndex(t=>t[0]===id);
  /* Remove am + any prior fi/emp so we can rebuild order deterministically */
  ['am','fi','emp'].forEach(id=>{const i=findIdx(id); if(i>-1) TABS.splice(i,1);});
  if(findIdx('today')<0) TABS.splice(1,0,['today','\u26A1 Today']);
  /* Order: business first (syn, am), then masters (fi, clients, emp) */
  const synIdx=findIdx('syn');
  TABS.splice(synIdx+1,0,['am','Asset Monetisation']);
  const amIdx=findIdx('am');
  TABS.splice(amIdx+1,0,['fi','FI Master']);
  /* Insert emp after clients if clients exists, else after fi */
  const cIdx=findIdx('clients');
  const insertEmpAt=cIdx>-1?cIdx+1:findIdx('fi')+1;
  TABS.splice(insertEmpAt,0,['emp','Employees']);
  const di=findIdx('dash'); if(di>-1) TABS[di][1]='Dashboard';
})();

/* --------- B. RBAC --------- */
const ROLE_TABS={
  RM:       ['home','today','leads','deals','lend','syn','am','fi','emp'],
  Analyst:  ['home','today','leads','deals','lend','syn','am','fi','emp','audit'],
  Ops:      ['home','today','am','fi','emp','audit'],
  Management:['home','today','dash','leads','deals','lend','syn','am','fi','clients','emp','audit'],
  Admin:    ['home','today','dash','leads','deals','lend','syn','am','fi','clients','emp','audit']
};
function canSee(tabId){const a=ROLE_TABS[USER&&USER.role]; return !a || a.includes(tabId);}

function scopedS(fn){
  if(!USER||(USER.role!=='RM'&&USER.role!=='Analyst'))return fn();
  const SF=S; const nm=USER.name;
  const filt={
    ...SF,
    leads:SF.leads.filter(l=>l.rm===nm||l.an===nm),
    deals:SF.deals.filter(d=>d.rm===nm||d.an===nm),
    lending:SF.lending.filter(r=>r.rm===nm||r.an===nm),
    syn:SF.syn.filter(r=>r.rm===nm||r.an===nm),
    am:SF.am.filter(r=>r.rm===nm||r.an===nm||USER.role==='Ops')
  };
  window.S=filt; try{return fn();} finally {window.S=SF;}
}

/* --------- E-G. Syndication --------- */
let SYNMODE='chase';
const ST2DOT={'Identified':1,'IM Circulated':2,'Docs Pending':2,'Queries Received':3,'IP Received':4,'Sanctioned':4,'Declined':5};

function syncMatrixFromLenders(){

function findL(code,name){const r=S.syn.find(x=>x.code===code); if(!r||!r.lenders) return null; return r.lenders.find(l=>l.name===name);}

const LSTATES=['Identified','IM Circulated','Docs Pending','Queries Received','IP Received','Sanctioned','Declined'];
const ST_COLOR={'Identified':'#94a3b8','IM Circulated':'#64748b','Docs Pending':'#0891b2','Queries Received':'#2563eb','IP Received':'#d97706','Sanctioned':'#059669','Declined':'#dc2626'};
function daysSince(d){if(!d) return null; const ms=Date.now()-new Date(d).getTime(); return Math.max(0,Math.floor(ms/86400000));}

function vSynChase(){
  const th=S.th||{lenderSilent:7};
  const rows=S.syn.filter(r=>!SYN_TERM.includes(r.status)&&!SYN_CLOSED.includes(r.status))
    .map(r=>({r,co:client(r.code).name,live:(r.lenders||[]).filter(l=>!l.ex&&l.st).length}))
    .filter(x=>match(x.co,x.r.code))
    .sort((a,b)=>b.live-a.live);
  if(!rows.length) return '<div class="empty">No live syndication files.</div>';

  /* Attention strip: silent lenders + queries-received across all companies */
  const attention=[];
  rows.forEach(({r,co})=>{
    (r.lenders||[]).forEach(l=>{
      if(l.ex) return;
      const rd=daysSince(l.resp);
      const chased=daysSince(l.chased);
      if(l.st==='IM Circulated'&&rd!==null&&rd>th.lenderSilent){
        attention.push({r,co,l,reason:'silent',age:rd,sev:rd>14?'red':'amber'});
      } else if(l.st==='Queries Received'&&(chased===null||chased>3)){
        attention.push({r,co,l,reason:'queries',age:rd,sev:'amber'});
      } else if(chased!==null&&chased>10&&!['Sanctioned','Declined'].includes(l.st)){
        attention.push({r,co,l,reason:'stale-chase',age:chased,sev:'amber'});
      }
    });
  });
  attention.sort((a,b)=>(a.sev==='red'?0:1)-(b.sev==='red'?0:1)||b.age-a.age);

  const attStrip=attention.length?`<details class="att-strip" open>
    <summary><b>Needs attention (${attention.length})</b><span class="hint">Silent lenders, unanswered queries, stale chases</span></summary>
    <div class="att-body">${attention.slice(0,15).map(a=>{
      const esN=esc(a.l.name).replace(/'/g,"\\'");
      const opts=LSTATES.map(s=>`<option ${s===a.l.st?'selected':''}>${s}</option>`).join('');
      const tag=a.reason==='silent'?`SILENT ${a.age}d`:a.reason==='queries'?`QUERIES OPEN ${a.age||'—'}d`:`CHASED ${a.age}d ago`;
      return `<div class="att-row ${a.sev}">
        <span class="pill ${a.sev==='red'?'hot':'warm'}">${tag}</span>
        <b class="lnm" onclick="openCompany('${esc(a.r.code)}')">${esc(a.co)}</b>
        <span class="hint">${esc(a.l.name)}</span>
        <select class="lsel" onchange="lSet('${esc(a.r.code)}','${esN}',this.value)">${opts}</select>
        <span class="spacer"></span>
        <button class="mini" onclick="logChase('${esc(a.r.code)}','${esN}')">Log chase</button>
        <button class="mini" onclick="logResp('${esc(a.r.code)}','${esN}')">Log reply</button>
      </div>`;
    }).join('')}${attention.length>15?`<div class="hint" style="padding:6px 0">…and ${attention.length-15} more. Scan the company list below.</div>`:''}</div>
  </details>`:'';

  /* Company cards — collapsed by default, density strip visible at a glance */
  const cardsHtml=rows.map(({r,co})=>{
    const lenders=(r.lenders||[]).slice().sort((a,b)=>(a.ex?1:0)-(b.ex?1:0));
    const outreach=lenders.filter(l=>!l.ex);
    /* Density strip: one small dot per outreach lender, coloured by status */
    const strip=outreach.length?outreach.map(l=>{
      const rd=daysSince(l.resp);
      const silent=l.st==='IM Circulated'&&rd!==null&&rd>th.lenderSilent;
      const c=silent?'#dc2626':(ST_COLOR[l.st]||'#94a3b8');
      return `<span class="dot" style="background:${c}" title="${esc(l.name)}: ${esc(l.st||'—')}"></span>`;
    }).join(''):'<span class="hint">no lenders yet</span>';
    const counts=(()=>{
      const c={s:0,ip:0,q:0,im:0,d:0,id:0};
      outreach.forEach(l=>{
        if(l.st==='Sanctioned')c.s++; else if(l.st==='IP Received')c.ip++; else if(l.st==='Queries Received')c.q++; else if(l.st==='IM Circulated')c.im++; else if(l.st==='Declined')c.d++; else if(l.st==='Identified')c.id++;
      });
      const bits=[];
      if(c.s)bits.push(`<span style="color:${ST_COLOR['Sanctioned']}">${c.s} sanctioned</span>`);
      if(c.ip)bits.push(`<span style="color:${ST_COLOR['IP Received']}">${c.ip} IP</span>`);
      if(c.q)bits.push(`<span style="color:${ST_COLOR['Queries Received']}">${c.q} queries</span>`);
      if(c.im)bits.push(`<span style="color:${ST_COLOR['IM Circulated']}">${c.im} IM circ</span>`);
      if(c.id)bits.push(`${c.id} identified`);
      if(c.d)bits.push(`<span style="color:${ST_COLOR['Declined']}">${c.d} declined</span>`);
      return bits.join(' \u00b7 ');
    })();
    const body=lenders.map((l)=>{
      if(l.ex) return `<div class="chline ex"><span class="pill">EXISTING</span><b>${esc(l.name)}</b><span class="hint">Incumbent banker (not outreach)</span></div>`;
      const rd=daysSince(l.resp);
      const silent=l.st==='IM Circulated'&&rd!==null&&rd>th.lenderSilent;
      const chased=daysSince(l.chased);
      const opts=LSTATES.map(s=>`<option ${s===l.st?'selected':''}>${s}</option>`).join('');
      const esN=esc(l.name).replace(/'/g,"\\'");
      return `<div class="chline${silent?' silent':''}">
        <b class="lnm">${esc(l.name)}</b>
        <select class="lsel" onchange="lSet('${esc(r.code)}','${esN}',this.value)">${opts}</select>
        <span class="hint">${rd!=null?'inbound '+rd+'d':'no inbound'}${chased!=null?' \u00b7 chased '+chased+'d':''}${silent?' \u00b7 SILENT':''}</span>
        <span class="spacer"></span>
        <button class="mini" onclick="logChase('${esc(r.code)}','${esN}')">Log chase</button>
        <button class="mini" onclick="logResp('${esc(r.code)}','${esN}')">Log reply</button>
      </div>`;
    }).join('');
    return `<details class="chco">
      <summary>
        <b class="lnm" onclick="event.preventDefault();openCompany('${esc(r.code)}')">${esc(co)}</b>
        <span class="hint">${esc(r.code)} \u00b7 \u20B9${fmt(num(r.amt),1)} Cr</span>
        <span class="strip">${strip}</span>
        <span class="spacer"></span>
        <span class="hint">${counts||(outreach.length+' lenders')}</span>
      </summary>
      ${body||'<div class="chline hint">No lenders yet. Add one below.</div>'}
      <div class="chline addl">
        <input id="nl_${esc(r.code)}" placeholder="Add lender (name)" style="flex:1">
        <button class="mini primary" onclick="addLender('${esc(r.code)}')">+ Add</button>
      </div>
    </details>`;
  }).join('');

  return attStrip+`<div class="chase-list">${cardsHtml}</div>`;
}

let REGSORT={col:'pursued',dir:'desc'};
function regSort(col){ if(REGSORT.col===col) REGSORT.dir=REGSORT.dir==='desc'?'asc':'desc'; else {REGSORT.col=col; REGSORT.dir='desc';} renderActive(); }

function vSynReg(){
  const banks={};
  S.syn.forEach(r=>{
    (r.lenders||[]).forEach(l=>{
      if(l.ex) return;
      const b=banks[l.name]=banks[l.name]||{name:l.name,pursued:0,sanc:0,ip:0,decl:0,queries:0,imCirc:0,amt:0,dots:[]};
      b.pursued++;
      b.amt+=num(r.amt);
      b.dots.push(l.st||'Identified');
      if(l.st==='Sanctioned') b.sanc++;
      else if(l.st==='IP Received') b.ip++;
      else if(l.st==='Declined') b.decl++;
      else if(l.st==='Queries Received') b.queries++;
      else if(l.st==='IM Circulated') b.imCirc++;
    });
  });
  let list=Object.values(banks).filter(b=>match(b.name));
  const s=REGSORT.col, d=REGSORT.dir==='desc'?-1:1;
  list.sort((a,b)=>{
    if(s==='name') return d*(a.name>b.name?1:-1);
    return d*((b[s]||0)-(a[s]||0));
  });
  if(!list.length) return '<div class="empty">No lender engagements yet.</div>';
  const arrow=col=>REGSORT.col===col?(REGSORT.dir==='desc'?' \u2193':' \u2191'):'';
  const th=(id,label,cls)=>`<th class="${cls||''} sortable" onclick="regSort('${id}')">${label}${arrow(id)}</th>`;
  return `<div class="hint" style="margin:4px 0 10px">Aggregate view by financial institution. Colour dots show status distribution across active + closed deals. Click a bank for full deal history.</div>
    <table class="grid"><thead><tr>
      ${th('name','Bank')}
      <th>Status distribution</th>
      ${th('pursued','# Pursued','rt')}
      ${th('sanc','Sanctioned','rt')}
      ${th('ip','IP Rec','rt')}
      ${th('queries','Queries','rt')}
      ${th('imCirc','IM Circ','rt')}
      ${th('decl','Declined','rt')}
      ${th('amt','\u20B9 Cr','rt')}
    </tr></thead>
    <tbody>${list.map(b=>{
      const esN=esc(b.name).replace(/'/g,"\\'");
      const strip=b.dots.map(st=>`<span class="dot" style="background:${ST_COLOR[st]||'#94a3b8'}" title="${esc(st)}"></span>`).join('');
      return `<tr class="rowclick" onclick="openBank('${esN}')">
        <td><b>${esc(b.name)}</b></td>
        <td><span class="strip">${strip}</span></td>
        <td class="rt">${b.pursued}</td>
        <td class="rt">${b.sanc||'\u2014'}</td>
        <td class="rt">${b.ip||'\u2014'}</td>
        <td class="rt">${b.queries||'\u2014'}</td>
        <td class="rt">${b.imCirc||'\u2014'}</td>
        <td class="rt">${b.decl||'\u2014'}</td>
        <td class="rt">${fmt(b.amt,1)}</td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

function openBank(name){
  const rows=[];
  S.syn.forEach(r=>{
    (r.lenders||[]).forEach(l=>{
      if(l.name!==name||l.ex) return;
      rows.push({code:r.code,co:client(r.code).name,amt:num(r.amt),st:l.st,since:l.since,resp:l.resp,chased:l.chased,note:l.note,synStatus:r.status,rm:r.rm,an:r.an});
    });
  });
  const active=rows.filter(x=>!['Declined','Sanctioned'].includes(x.st));
  const past=rows.filter(x=>['Declined','Sanctioned'].includes(x.st));
  const trow=x=>`<tr onclick="openCompany('${esc(x.code)}')" style="cursor:pointer"><td><b>${esc(x.co)}</b><br><span class="hint">${esc(x.code)}</span></td><td>${esc(x.st||'\u2014')}</td><td>\u20B9${fmt(x.amt,1)} Cr</td><td>${esc(x.synStatus||'\u2014')}</td><td>${esc(x.rm||'\u2014')} / ${esc(x.an||'\u2014')}</td><td>${x.resp?daysSince(x.resp)+'d':'\u2014'}</td><td>${esc(x.note||'')}</td></tr>`;
  const html=`<div class="dr-hdr"><h3>${esc(name)} \u2014 Full deal ledger</h3><span class="hint">${rows.length} engagements \u00b7 ${active.length} live \u00b7 ${past.length} closed</span><span class="spacer"></span><button class="mini" onclick="closeDrawer()">Close</button></div>
    <div class="dsection"><h4>Live engagements (${active.length})</h4>
      ${active.length?`<table class="grid"><thead><tr><th>Company</th><th>Status</th><th>Ask</th><th>Deal status</th><th>RM/Analyst</th><th>Last reply</th><th>Note</th></tr></thead><tbody>${active.map(trow).join('')}</tbody></table>`:'<div class="empty">No live deals with this bank.</div>'}
    </div>
    <div class="dsection"><h4>Closed / declined (${past.length})</h4>
      ${past.length?`<table class="grid"><thead><tr><th>Company</th><th>Outcome</th><th>Ask</th><th>Deal status</th><th>RM/Analyst</th><th>Last reply</th><th>Note</th></tr></thead><tbody>${past.map(trow).join('')}</tbody></table>`:'<div class="empty">No closed deals with this bank.</div>'}
    </div>`;
  const dr=document.getElementById('drawer');
  dr.innerHTML=html;
  dr.classList.add('open');
}

function vSyn(){
  const modes=[['chase','Chase list'],['matrix','Matrix'],['reg','Register (by bank)']];
  const bar=`<div class="toolbar">${modes.map(([k,l])=>`<button class="chip ${SYNMODE===k?'on':''}" onclick="SYNMODE='${k}';renderActive()">${l}</button>`).join('')}<span class="spacer"></span><span class="hint">${SYNMODE==='matrix'?'Matrix is read-only \u2014 it renders the Chase List state':SYNMODE==='reg'?'Click a bank for its full deal ledger':''}</span></div>`;
  if(SYNMODE==='matrix'){ syncMatrixFromLenders(); return bar+ORIG_vSyn(); }
  if(SYNMODE==='reg') return bar+vSynReg();
  return bar+vSynChase();
}

let FIMODE='table';
let FISORT={col:'pursued',dir:'desc'};
function fiSort(col){ if(FISORT.col===col) FISORT.dir=FISORT.dir==='desc'?'asc':'desc'; else {FISORT.col=col; FISORT.dir='desc';} renderActive(); }

function vFI(){
  const eng={};
  S.syn.forEach(r=>(r.lenders||[]).forEach(l=>{
    if(!l.name) return;
    const e=eng[l.name]=eng[l.name]||{pursued:0,sanc:0,ip:0,decl:0,live:0,cos:[]};
    e.pursued++;
    if(l.st==='Sanctioned') e.sanc++;
    if(l.st==='IP Received') e.ip++;
    if(l.st==='Declined') e.decl++;
    if(l.st&&!['Sanctioned','Declined'].includes(l.st)) e.live++;
    e.cos.push({co:client(r.code).name,code:r.code,st:l.st,resp:l.resp,amt:num(r.amt)});
  }));
  const modes=`<div class="toolbar">
    <button class="chip ${FIMODE==='table'?'on':''}" onclick="FIMODE='table';renderActive()">Table view</button>
    <button class="chip ${FIMODE==='cards'?'on':''}" onclick="FIMODE='cards';renderActive()">Card view</button>
    <span class="spacer"></span>
    <span class="hint">${FIMODE==='table'?'Master directory. Sort columns, click a row for engagement + notes.':'Detailed view. Edit notes, sectors, active flag inline.'}</span>
  </div>`;

  if(FIMODE==='table'){
    let list=S.lenders.map((l,i)=>{
      const e=eng[l.name]||{pursued:0,sanc:0,ip:0,decl:0,live:0};
      return {i,l,e,name:l.name,type:l.type||'',sectors:l.preferredSectors||l.sectors||'',notes:l.notes||'',inactive:!!l.inactive,pursued:e.pursued,live:e.live,ip:e.ip,sanc:e.sanc,decl:e.decl};
    }).filter(x=>match(x.name,x.type,x.sectors));
    const s=FISORT.col, d=FISORT.dir==='desc'?-1:1;
    list.sort((a,b)=>{
      if(s==='name'||s==='type'||s==='sectors') return d*(String(a[s]).localeCompare(String(b[s])));
      if(s==='active') return d*((a.inactive?0:1)-(b.inactive?0:1));
      return d*((b[s]||0)-(a[s]||0));
    });
    const arrow=col=>FISORT.col===col?(FISORT.dir==='desc'?' \u2193':' \u2191'):'';
    const th=(id,label,cls)=>`<th class="${cls||''} sortable" onclick="fiSort('${id}')">${label}${arrow(id)}</th>`;
    return modes+`<table class="grid"><thead><tr>
        ${th('name','Bank')}
        ${th('active','Status')}
        ${th('type','Type')}
        ${th('sectors','Preferred sectors')}
        ${th('pursued','# Pursued','rt')}
        ${th('live','Live','rt')}
        ${th('ip','IP','rt')}
        ${th('sanc','Sanctioned','rt')}
        ${th('decl','Declined','rt')}
        <th>Notes</th>
      </tr></thead>
      <tbody>${list.map(x=>`<tr class="rowclick" onclick="fiOpenDrawer(${x.i})">
        <td><b>${esc(x.name)}</b></td>
        <td><span class="pill ${x.inactive?'off':'on'}">${x.inactive?'INACTIVE':'ACTIVE'}</span></td>
        <td>${esc(x.type)}</td>
        <td class="wrap">${esc(x.sectors)}</td>
        <td class="rt">${x.pursued||'\u2014'}</td>
        <td class="rt">${x.live||'\u2014'}</td>
        <td class="rt">${x.ip||'\u2014'}</td>
        <td class="rt">${x.sanc||'\u2014'}</td>
        <td class="rt">${x.decl||'\u2014'}</td>
        <td class="wrap hint">${esc((x.notes||'').slice(0,80))}</td>
      </tr>`).join('')}</tbody></table>
      <div class="hint" style="margin-top:8px">Click a row to see the full deal ledger for that bank. Switch to Card view to edit notes and preferred sectors inline.</div>`;
  }

  // Card mode (v4 behaviour, kept for editing)
  const rows=S.lenders.map((l,i)=>{
    if(!match(l.name,l.type||'',l.sectors||'')) return '';
    const e=eng[l.name]||{pursued:0,sanc:0,ip:0,decl:0,live:0,cos:[]};
    const inactive=l.inactive;
    return `<details class="chco${inactive?' inact':''}">
      <summary>
        <b>${esc(l.name)}</b>
        <span class="pill ${inactive?'off':'on'}">${inactive?'INACTIVE':'ACTIVE'}</span>
        <span class="hint">${esc(l.type||'')}${l.sectors?' \u00b7 '+esc(l.sectors):''}</span>
        <span class="spacer"></span>
        <span class="hint">pursued ${e.pursued} \u00b7 live ${e.live} \u00b7 IP ${e.ip} \u00b7 sanctioned ${e.sanc} \u00b7 declined ${e.decl}</span>
      </summary>
      <div class="fi-grid">
        <div class="fld"><label>Preferred sectors</label><input value="${esc(l.preferredSectors||l.sectors||'')}" placeholder="e.g. Solar, EV, MSME" onchange="fiSectors(${i},this.value)"></div>
        <div class="fld"><label>Notes (appetite, contacts, quirks)</label><input value="${esc(l.notes||'')}" placeholder="e.g. Won't fund merchant solar; needs DSCR>1.4" onchange="fiNote(${i},this.value)"></div>
        <div class="fld"><label>Status</label><button class="mini" onclick="fiToggle(${i})">Toggle ${inactive?'active':'inactive'}</button></div>

    </details>`;
  }).join('');
  return modes+rows;
}

function empUpdate(idx,f,v){
  if(!writeOK())return;
  S.people[idx][f]=v;
  audit('Employee field',S.people[idx].name,f+'='+v);
  stamp('Employee updated');
}
function empToggleActive(idx){
  if(!writeOK())return;
  S.people[idx].inactive=!S.people[idx].inactive;
  audit('Employee toggle',S.people[idx].name,S.people[idx].inactive?'inactive':'active');
  renderActive(); stamp('Status updated');
}
function empBookRollup(name){
  const r={leads:0,activeLeads:0,deals:0,lend:0,syn:0,am:0};
  S.leads.forEach(l=>{if(l.rm===name||l.an===name){r.leads++; if(l.status==='Active') r.activeLeads++;}});
  S.deals.forEach(d=>{if(d.rm===name||d.an===name) r.deals++;});
  S.lending.forEach(x=>{if(x.rm===name||x.an===name) r.lend++;});
  S.syn.forEach(x=>{if(x.rm===name||x.an===name) r.syn++;});
  S.am.forEach(x=>{if(x.rm===name||x.an===name) r.am++;});
  return r;
}

        <span class="pill ${inactive?'off':'on'}">${inactive?'INACTIVE':'ACTIVE'}</span>

/* --------- I. Interaction Ledger --------- */
function newInteractionId(){ return 'INT-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase(); }
function logInteraction(refId,refType){
  if(!writeOK())return;
  const g=id=>document.getElementById(id);
  const occurredAt=(g('int-date-'+refId)||{}).value||today();
  const person=(g('int-person-'+refId)||{}).value;
  const type=(g('int-type-'+refId)||{}).value;
  const notes=((g('int-notes-'+refId)||{}).value||'').trim();
  const nextAction=((g('int-next-'+refId)||{}).value||'').trim();
  const nextActionDate=(g('int-nextdate-'+refId)||{}).value||null;
  const lenderName=(g('int-lender-'+refId)||{}).value||null;
  const direction=(g('int-dir-'+refId)||{}).value||null;
  if(!type||!notes){ alert('Interaction Type and Notes are required.'); return; }
  const rec={
    interactionId:newInteractionId(),
    refId,refType,
    occurredAt,
    loggedAt:new Date().toISOString(),
    person, interactionType:type,
    direction:direction||null,
    lenderName:lenderName||null,
    notes, nextAction:nextAction||null, nextActionDate
  };
  S.interactions=S.interactions||[];
  S.interactions.push(rec);
  audit('Interaction logged',refId,type+(person?' by '+person:'')+(notes?' \u2014 '+notes.slice(0,60):''));
  if(refType==='Syndication'&&direction==='inbound'&&lenderName){
    const e=findL(refId,lenderName); if(e){ e.resp=occurredAt; }
  }
  if(refType==='Syndication'&&direction==='outbound'&&lenderName){
    const e=findL(refId,lenderName); if(e){ e.chased=occurredAt; }
  }
  save();
  stamp('Interaction logged');
}
function interactionsFor(refId){
  return (S.interactions||[]).filter(i=>i.refId===refId).sort((a,b)=>(b.occurredAt+b.loggedAt).localeCompare(a.occurredAt+a.loggedAt));
}
function lastContact(refId){
  const ints=interactionsFor(refId);
  return ints.length?ints[0].occurredAt:null;
}
function personOpts(sel){
  return (S.people||[]).map(p=>`<option ${p.name===sel?'selected':''}>${esc(p.name)}</option>`).join('');
}
function typeOpts(sel){
  return (S.interactionTypes||[]).map(t=>`<option ${t===sel?'selected':''}>${esc(t)}</option>`).join('');
}
function lenderOptsForCode(code,sel){
  const r=S.syn.find(x=>x.code===code); if(!r) return '';
  return '<option value="">\u2014</option>'+(r.lenders||[]).filter(l=>!l.ex).map(l=>`<option ${l.name===sel?'selected':''}>${esc(l.name)}</option>`).join('');
}

function imEscHandler(e){ if(e.key==='Escape') closeInteractionModal(); }
function closeInteractionModal(){

function submitInteractionModal(refId,refType){
  // Delegates to logInteraction which reads the same field IDs, then closes modal + refreshes drawer.
  const beforeLen=(S.interactions||[]).length;
  logInteraction(refId,refType);
  if((S.interactions||[]).length>beforeLen){
    closeInteractionModal();
    // Refresh interactions block inside drawer without full re-render
    refreshInteractionsBlock(refId,refType);
  }
}
function refreshInteractionsBlock(refId,refType){
  const dr=document.getElementById('drawer'); if(!dr) return;

  const blocks=dr.querySelectorAll('.int-block');
  if(!blocks.length) return;
  const wrap=document.createElement('div');
  wrap.innerHTML=renderInteractionsBlock(refId,refType);
  blocks[blocks.length-1].replaceWith(wrap.firstElementChild);
}

function velocityRows(){
  const trans={
    'Lead \u2192 Deal':[],
    'Deal \u2192 CAM/IM':[],
    'IM \u2192 First response':[],
    'IM \u2192 Sanction':[],
    'Sanction \u2192 Documentation':[],
    'Documentation \u2192 Disbursement':[]
  };
  S.lending.forEach(r=>{
    const h=r.h||[];
    const find=stages=>h.find(x=>stages.some(s=>String(x.stage||'').includes(s)));
    const g=(a,b,label)=>{const A=find(a),B=find(b); if(A&&B){const d=(new Date(B.t)-new Date(A.t))/86400000;if(d>=0)trans[label].push(d);}};
    g(['Lead'],['CAM'],'Deal \u2192 CAM/IM');
    g(['IM'],['Sanction'],'IM \u2192 Sanction');
    g(['Sanction'],['Documentation'],'Sanction \u2192 Documentation');
    g(['Documentation'],['Disbursed'],'Documentation \u2192 Disbursement');
  });
  S.leads.filter(l=>l.status==='Converted'&&l.createdAt).forEach(l=>{
    const d=S.deals.find(x=>x.code===l.linkedDealId||client(x.code).name===l.company);
    if(d&&d.createdAt){const diff=(new Date(d.createdAt)-new Date(l.createdAt))/86400000; if(diff>=0)trans['Lead \u2192 Deal'].push(diff);}
  });
  const median=arr=>{if(!arr.length)return null; const s=arr.slice().sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2;};
  const p75=arr=>{if(!arr.length)return null; const s=arr.slice().sort((a,b)=>a-b); return s[Math.floor(s.length*0.75)];};
  return Object.entries(trans).map(([k,v])=>({stage:k,n:v.length,median:median(v),p75:p75(v)}));
}

function bankActivityData(){
  const b={};
  S.syn.forEach(r=>(r.lenders||[]).forEach(l=>{
    if(l.ex) return;
    const x=b[l.name]=b[l.name]||{name:l.name,pursued:0,sanc:0,decl:0,live:0};
    x.pursued++;
    if(l.st==='Sanctioned') x.sanc++;
    if(l.st==='Declined') x.decl++;
    if(l.st&&!['Sanctioned','Declined'].includes(l.st)) x.live++;
  }));
  return Object.values(b).sort((a,b)=>b.pursued-a.pursued);
}

function sourcingMix(){
  const m={};
  const tax=S.sourceTypes||['RM','DSA','OEM','Referral','Event','Website','Direct','Other'];
  /* Seed all taxonomy values with zero so the shape of the taxonomy is visible even when data is sparse */
  tax.forEach(t=>{m[t]=0;});
  S.leads.forEach(l=>{
    const raw=l.source||'';
    const k=tax.includes(raw)?raw:(raw?'Other':'(unspecified)');
    m[k]=(m[k]||0)+1;
  });
  const arr=Object.entries(m).map(([k,v])=>({source:k,count:v}));
  /* Keep taxonomy order; move (unspecified) to the end if present */
  const known=arr.filter(x=>tax.includes(x.source));
  const unspecified=arr.filter(x=>!tax.includes(x.source));
  return [...known.sort((a,b)=>tax.indexOf(a.source)-tax.indexOf(b.source)), ...unspecified];
}

/* Item 4a: RM origination activity — sourcing + conversion measures */
function rmActivity(){
  const m={};
  S.people.filter(p=>p.role==='RM').forEach(p=>{m[p.name]={name:p.name,sourced:0,activeLeads:0,hotLeads:0,convertedFromLead:0,pipeLend:0,pipeSyn:0,pipeAM:0,closedLend:0,closedSyn:0,closedAM:0};});
  S.leads.forEach(l=>{
    if(!m[l.rm]) return;
    m[l.rm].sourced++;
    if(l.status==='Active'){m[l.rm].activeLeads++; if(l.temp==='Hot') m[l.rm].hotLeads++;}
    if(l.status==='Converted') m[l.rm].convertedFromLead++;
  });
  S.lending.forEach(r=>{ if(!m[r.rm]) return; if(r.stage==='Disbursed') m[r.rm].closedLend++; else if(!['Dropped','Rejected'].includes(r.stage)) m[r.rm].pipeLend++; });
  S.syn.forEach(r=>{ if(!m[r.rm]) return; if(SYN_CLOSED.includes(r.status)) m[r.rm].closedSyn++; else if(!SYN_TERM.includes(r.status)) m[r.rm].pipeSyn++; });
  S.am.forEach(a=>{ if(!m[a.rm]) return; if(a.status==='Closed') m[a.rm].closedAM++; else if(a.status!=='Dropped') m[a.rm].pipeAM++; });
  return Object.values(m);
}

/* Item 4b: Analyst throughput — assigned files, workload, closures, rejections */
function analystThroughput(){
  const m={};
  S.people.filter(p=>p.role==='Analyst').forEach(p=>{m[p.name]={name:p.name,activeLend:0,activeSyn:0,activeAM:0,disbursed:0,synClosed:0,amClosed:0,rejected:0};});
  S.lending.forEach(r=>{
    if(!m[r.an]) return;
    if(r.stage==='Disbursed') m[r.an].disbursed++;
    else if(r.stage==='Rejected'||r.stage==='Dropped') m[r.an].rejected++;
    else m[r.an].activeLend++;
  });
  S.syn.forEach(r=>{
    if(!m[r.an]) return;
    if(SYN_CLOSED.includes(r.status)) m[r.an].synClosed++;
    else if(SYN_TERM.includes(r.status)) m[r.an].rejected++;
    else m[r.an].activeSyn++;
  });
  S.am.forEach(a=>{
    if(!m[a.an]) return;
    if(a.status==='Closed') m[a.an].amClosed++;
    else if(a.status==='Dropped') m[a.an].rejected++;
    else m[a.an].activeAM++;
  });
  return Object.values(m);
}

/* Item 4c: Geography rollup — pipeline vs closed by state */
function geographyRollup(){
  const g={};
  const bump=(state,bucket,amt)=>{if(!state) state='(unspecified)'; g[state]=g[state]||{state,pipeCount:0,pipeAmt:0,closedCount:0,closedAmt:0,liveLendCount:0,liveSynCount:0,liveAMCount:0}; g[state][bucket]++; if(bucket==='pipeCount') g[state].pipeAmt+=amt; if(bucket==='closedCount') g[state].closedAmt+=amt;};
  S.lending.forEach(r=>{const st=client(r.code).state; if(r.stage==='Disbursed') bump(st,'closedCount',num(r.amt)); else if(!['Dropped','Rejected'].includes(r.stage)){ bump(st,'pipeCount',num(r.amt)); g[st||'(unspecified)'].liveLendCount++; }});
  S.syn.forEach(r=>{const st=client(r.code).state; if(SYN_CLOSED.includes(r.status)) bump(st,'closedCount',num(r.amt)); else if(!SYN_TERM.includes(r.status)){ bump(st,'pipeCount',num(r.amt)); g[st||'(unspecified)'].liveSynCount++; }});
  S.am.forEach(a=>{const st=client(a.code).state||a.state; if(a.status==='Closed') bump(st,'closedCount',num(a.val)); else if(a.status!=='Dropped'){ bump(st,'pipeCount',num(a.val)); g[st||'(unspecified)'].liveAMCount++; }});
  return Object.values(g).sort((a,b)=>(b.pipeAmt+b.closedAmt)-(a.pipeAmt+a.closedAmt));
}

/* Item 3: Business line composition by climate lens (Mitigation vs Adaptation) */
function lensComposition(){
  const g={};
  const bump=(lens,line)=>{if(!lens) lens='(unset)'; g[lens]=g[lens]||{lens,lending:0,syn:0,am:0,total:0}; g[lens][line]++; g[lens].total++;};
  const liveLend=S.lending.filter(r=>!['Disbursed','Dropped','Rejected'].includes(r.stage));
  const liveSyn=S.syn.filter(r=>!SYN_TERM.includes(r.status)&&!SYN_CLOSED.includes(r.status));
  const liveAM=S.am.filter(a=>!['Closed','Dropped'].includes(a.status));
  liveLend.forEach(r=>bump(client(r.code).lens,'lending'));
  liveSyn.forEach(r=>bump(client(r.code).lens,'syn'));
  liveAM.forEach(a=>bump(client(a.code).lens,'am'));
  return Object.values(g).sort((a,b)=>b.total-a.total);
}

/* Item 4: Lead touches by recency window (7d/15d/30d/90d) */
function leadTouchRecency(){
  const now=Date.now();
  const buckets={7:new Set(),15:new Set(),30:new Set(),90:new Set()};
  const dayMs=86400000;
  /* Any interaction whose refId matches a lead ID, or whose refType is Lead */
  const leadIds=new Set(S.leads.map(l=>l.id));
  (S.interactions||[]).forEach(i=>{
    /* Also include refs that USED to be leads (portedFromLead) */
    const isLead = leadIds.has(i.refId) || i.refType==='Lead' || !!i.portedFromLead;
    if(!isLead) return;
    if(!i.occurredAt) return;
    const days=(now-new Date(i.occurredAt).getTime())/dayMs;
    const key = leadIds.has(i.refId) ? i.refId : (i.portedFromLead || i.refId);
    if(days<=7) buckets['7'].add(key);
    if(days<=15) buckets['15'].add(key);
    if(days<=30) buckets['30'].add(key);
    if(days<=90) buckets['90'].add(key);
  });
  return [
    {label:'Last 7d', count:buckets['7'].size},
    {label:'Last 15d', count:buckets['15'].size},
    {label:'Last 30d', count:buckets['30'].size},
    {label:'Last 90d', count:buckets['90'].size}
  ];
}

/* Item 5: Syndication funnel — most advanced stage reached, count + ₹ Cr */
function synStageFunnel(){
  /* SYN status order from most-advanced (funnel bottom) to least */
  const order=['Disbursed','Sanctioned','IP Received','Queries Received','IM Circulated','IM in Prep','Docs Pending','Deal Sourced','On Hold','Withdrawn','Dropped'];
  const g={};
  order.forEach(s=>{g[s]={status:s,rows:0,amt:0};});
  S.syn.forEach(r=>{
    const s=r.status||'(unspecified)';
    if(!g[s]) g[s]={status:s,rows:0,amt:0};
    g[s].rows++;
    g[s].amt+=num(r.amt);
  });
  /* Return in the funnel order (known keys first, then any leftover) */
  const known=order.filter(k=>g[k]).map(k=>g[k]);
  const extra=Object.values(g).filter(x=>!order.includes(x.status));
  return known.concat(extra);
}

        <div class="stack-seg" style="width:${pctL}%;background:#1B2A4A" title="Lending: ${x.lending}"></div>
        <div class="stack-seg" style="width:${pctS}%;background:#7c3aed" title="Syndication: ${x.syn}"></div>
        <div class="stack-seg" style="width:${pctA}%;background:#d97706" title="Asset Mon: ${x.am}"></div>
      </div>
      <div class="stack-val">${x.lending} \u00b7 ${x.syn} \u00b7 ${x.am}</div>
    </div>`;
  }).join('');
  const lcLegend=`<div class="stack-legend"><span><span class="dot" style="background:#1B2A4A"></span> Lending</span> <span><span class="dot" style="background:#7c3aed"></span> Syndication</span> <span><span class="dot" style="background:#d97706"></span> Asset Mon</span></div>`;

  /* Item 4: Lead touches by recency window */
  const LT=leadTouchRecency();
  const ltMax=Math.max(1,...LT.map(x=>x.count));
  const ltBars=LT.map(x=>`<div class="v4-bar-row"><span class="v4-bar-lbl">${esc(x.label)}</span><span class="v4-bar-wrap"><span class="v4-bar teal" style="width:${(x.count/ltMax*100).toFixed(0)}%"></span></span><span class="v4-bar-val">${x.count} lead${x.count===1?'':'s'} touched</span></div>`).join('');

  /* ---- v16: sanctioned lending, sector/geography pairs, M&A breakup, lending funnel ---- */
  const _cnt=(arrs,keyFn)=>{const m={};arrs.forEach(a=>a.forEach(r=>{const k=keyFn(r)||'Other';m[k]=(m[k]||0)+1;}));return m;};
  const _bars=(m,cls)=>{const es=Object.entries(m).sort((x,y)=>y[1]-x[1]).slice(0,10);const mx=es.length?es[0][1]:1;
    return es.map(([k,v])=>`<div class="v4-bar-row"><span class="v4-bar-lbl">${esc(k)}</span><span class="v4-bar-wrap"><span class="v4-bar ${cls}" style="width:${(v/mx*100).toFixed(0)}%"></span></span><span class="v4-bar-val">${v} deal${v===1?'':'s'}</span></div>`).join('')||'<div class="empty">No data.</div>';};
  const _sec=r=>client(r.code).sector;
  const _geo=r=>(client(r.code).state||r.state||'(unspecified)');
  const secClosedBars=_bars(_cnt([D.closedLend,D.closedSyn,D.closedAm],_sec),'teal');
  const secPipeBars=_bars(_cnt([D.pipeLend,D.pipeSyn,D.pipeAm],_sec),'');
  const geoClosedBars=_bars(_cnt([D.closedLend,D.closedSyn,D.closedAm],_geo),'teal');
  const geoPipeBars=_bars(_cnt([D.pipeLend,D.pipeSyn,D.pipeAm],_geo),'');
  const maMap={Mitigation:0,Adaptation:0};
  [...D.pipeLend,...D.pipeSyn,...D.pipeAm,...D.closedLend,...D.closedSyn,...D.closedAm]
    .forEach(r=>{maMap[(client(r.code).lens==='Adaptation')?'Adaptation':'Mitigation']++;});
  const maBars=_bars(maMap,'teal');
  const LORDER=S.ref['Lending Stage']||[];
  const lfMap={};
  S.lending.forEach(r=>{let best=r.stage,bi=LORDER.indexOf(r.stage);
    (r.h||[]).forEach(x=>{const i=LORDER.indexOf(x.stage);if(i>bi){bi=i;best=x.stage;}});
    const e=lfMap[best]=lfMap[best]||{rows:0,amt:0};e.rows++;e.amt+=num(r.amt);});
  const lfRows=LORDER.filter(s2=>lfMap[s2]).map(s2=>`<tr><td>${esc(s2)}</td><td class="rt">${lfMap[s2].rows}</td><td class="rt">\u20B9${fmt(lfMap[s2].amt,1)} Cr</td></tr>`).join('');

  /* Item 5: Syndication funnel — most-advanced-stage-reached */
  const SF=synStageFunnel();
  const sfRows=SF.map(s=>`<tr><td>${esc(s.status)}</td><td class="rt">${s.rows}</td><td class="rt">\u20B9${fmt(s.amt,1)} Cr</td></tr>`).join('');

  /* Item 10: neutral section titles (no editorial framing) */
  return `
  <div class="v4-hd">
    <div><h2 style="margin:0">Dashboard</h2><span class="hint">${today()} \u00b7 Live from Register${DASH_FILTER?' \u00b7 <b>Filtered: '+esc(DASH_FILTER)+'</b>':''}</span></div>
    <div class="v4-role">Role: ${esc(rnm)}</div>
  </div>
  ${DASH_FILTER?`<div class="filter-banner"><b>Showing ${esc(DASH_FILTER)}\u2019s book only.</b> <span class="hint">Filter applied via Employees tab.</span><span class="spacer"></span><button class="mini" onclick="dashClearFilter()">Clear filter</button></div>`:''}
  ${closedRow}
  ${pipeRow}
  <div class="v4-secttl">Business line composition</div>
  <div class="v4-card">${LC.length?lcStacks+lcLegend:'<div class="empty">No lens data.</div>'}</div>
  <div class="v4-secttl">Mitigation &amp; Adaptation breakup</div>
  <div class="v4-card">${maBars}</div>
  <div class="v4-secttl">Sector split</div>
  <div class="v4-2col">
    <div class="v4-card"><div class="v4-subttl">Deals closed by sector</div>${secClosedBars}</div>
    <div class="v4-card"><div class="v4-subttl">Active pipeline by sector</div>${secPipeBars}</div>
  </div>
  <div class="v4-secttl">Geography split</div>
  <div class="v4-2col">
    <div class="v4-card"><div class="v4-subttl">Deals closed by geography</div>${geoClosedBars}</div>
    <div class="v4-card"><div class="v4-subttl">Active pipeline by geography</div>${geoPipeBars}</div>
  </div>
  <div class="v4-secttl">Syndication funnel: most advanced stage reached</div>
  <div class="v4-card"><table class="grid"><thead><tr><th>Status</th><th class="rt">Rows</th><th class="rt">Value (\u20B9 Cr)</th></tr></thead><tbody>${sfRows}</tbody></table></div>
  <div class="v4-secttl">Lending funnel: most advanced stage reached</div>
  <div class="v4-card"><table class="grid"><thead><tr><th>Stage</th><th class="rt">Rows</th><th class="rt">Value (\u20B9 Cr)</th></tr></thead><tbody>${lfRows}</tbody></table></div>
  <div class="v4-secttl">Deal velocity by stage</div>
  <div class="v4-2col">
    <div class="v4-card">
      <div style="text-align:right;margin-bottom:6px">
        <button class="chip mini ${DASH_CHART==='table'?'on':''}" onclick="DASH_CHART='table';renderActive()">Table</button>
        <button class="chip mini ${DASH_CHART==='chart'?'on':''}" onclick="DASH_CHART='chart';renderActive()">Chart</button>
      </div>
      <table class="grid"><thead><tr>${vTh('stage','Transition')}${vTh('n','N','rt')}${vTh('median','Median','rt')}${vTh('p75','P75','rt')}</tr></thead><tbody>${velRows}</tbody></table>
    </div>
    <div class="v4-card">${DASH_CHART==='chart'?`<canvas id="velCanvas" height="180"></canvas>`:velBars}</div>
  </div>
  <div class="v4-secttl">Lead touches by recency window</div>
  <div class="v4-card"><div class="hint" style="margin-bottom:6px">Distinct leads touched within each rolling window. Reads from the interactions ledger, including interactions ported from a lead into a converted deal.</div>${ltBars}</div>
  <div class="v4-secttl">Lead sourcing across channels</div>
  <div class="v4-card"><div class="hint" style="margin-bottom:6px">All source channels shown, including zero-count ones. Blank values shown separately.</div>${smBars}</div>

  <div class="v4-secttl">Analyst throughput</div>
  <div class="v4-card"><table class="grid"><thead><tr>${anTh('name','Analyst')}${anTh('activeLend','Active lend','rt')}${anTh('activeSyn','Active syn','rt')}${anTh('activeAM','Active AM','rt')}${anTh('disbursed','Closed','rt')}${anTh('rejected','Rejected','rt')}</tr></thead><tbody>${anRows}</tbody></table></div>

const DASH_SORT={};
let DASH_FILTER=null;
function dashFilterByPerson(name){
  DASH_FILTER=name;
  show('dash');
  stamp('Dashboard filtered to '+name+"'s book");
}
function dashClearFilter(){
  DASH_FILTER=null;
  renderActive();
  stamp('Dashboard filter cleared');
}
function dashScopeS(fn){
  if(!DASH_FILTER) return fn();
  const SF=S;
  const nm=DASH_FILTER;
  const filt={
    ...SF,
    leads:SF.leads.filter(l=>l.rm===nm||l.an===nm),
    deals:SF.deals.filter(d=>d.rm===nm||d.an===nm),
    lending:SF.lending.filter(r=>r.rm===nm||r.an===nm),
    syn:SF.syn.filter(r=>r.rm===nm||r.an===nm),
    am:SF.am.filter(r=>r.rm===nm||r.an===nm)
  };
  window.S=filt;
  try{return fn();} finally {window.S=SF;}
}

let DASH_CHART='table';
function dashSort(t,c){ DASH_SORT[t]=DASH_SORT[t]||{}; if(DASH_SORT[t].col===c) DASH_SORT[t].dir=DASH_SORT[t].dir==='desc'?'asc':'desc'; else {DASH_SORT[t].col=c; DASH_SORT[t].dir='desc';} renderActive(); }

/* --------- Render dispatch --------- */
/* R is const-scoped in baseline; can't extend. Handle new/replaced tabs directly. */
window.ORIG_renderActive=window.ORIG_renderActive||renderActive;
function renderActive(){
  const view=document.getElementById('main');
  if(view){
    if(cur==='today'){ scopedS(()=>{view.innerHTML=vToday();}); return; }
    if(cur==='fi'){ scopedS(()=>{view.innerHTML=vFI();}); return; }
    if(cur==='emp'){ view.innerHTML=vEmp(); return; }
    if(cur==='dash'){ dashScopeS(()=>scopedS(()=>{view.innerHTML=vDashV4();})); renderDashCharts(); return; }
  }
  scopedS(()=>ORIG_renderActive());
  if(!view) return;
  view.innerHTML=view.innerHTML
    .replace(/September\s*MVP[^<]*/gi,'')
    .replace(/one cockpit on the live register[^<]*/gi,'')
    .replace(/Ties to SIDBI deck[^<]*/gi,'')
    .replace(/Book at a glance · ties to SIDBI deck/gi,'Book at a glance')
    .replace(/\bper SIDBI[^<,;.|]*/gi,'')
    .replace(/\bSIDBI\b/g,'')
    .replace(/Register-powered deal intelligence/gi,'Deal register')
    .replace(/four business lines, one register/gi,'')
    .replace(/Pipeline Summary\s*/g,'');
}

/* Item 11: Chart.js render for velocity + bank activity when in chart mode */
const CHART_INSTANCES={};
function renderDashCharts(){
  if(DASH_CHART!=='chart'||typeof Chart==='undefined') return;
  const draw=()=>{
    const velC=document.getElementById('velCanvas');
    if(velC){
      if(CHART_INSTANCES.vel){ try{CHART_INSTANCES.vel.destroy();}catch(e){} }
      const V=velocityRows();
      CHART_INSTANCES.vel=new Chart(velC,{type:'bar',data:{labels:V.map(v=>v.stage),datasets:[{label:'Median days',data:V.map(v=>v.median||0),backgroundColor:'#0D7377'},{label:'P75 days',data:V.map(v=>v.p75||0),backgroundColor:'#94a3b8'}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:{beginAtZero:true,title:{display:true,text:'Days'}}}}});
    }
    const bankC=document.getElementById('bankCanvas');
    if(bankC){
      if(CHART_INSTANCES.bank){ try{CHART_INSTANCES.bank.destroy();}catch(e){} }
      const BA=bankActivityData().slice(0,15);
      CHART_INSTANCES.bank=new Chart(bankC,{type:'bar',data:{labels:BA.map(b=>b.name),datasets:[{label:'Pursued',data:BA.map(b=>b.pursued),backgroundColor:'#1B2A4A'},{label:'Sanctioned',data:BA.map(b=>b.sanc),backgroundColor:'#059669'},{label:'Declined',data:BA.map(b=>b.decl),backgroundColor:'#dc2626'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true}}}});
    }
  };
  /* rAF gives DOM time to paint before Chart measures the canvas */
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(draw); else setTimeout(draw,50);
}
/* Redraw on window resize so charts scale with layout */
if(typeof window!=='undefined'){
  let resizeTO=null;
  window.addEventListener('resize',()=>{
    clearTimeout(resizeTO);
    resizeTO=setTimeout(()=>{if(cur==='dash') renderDashCharts();},150);
  });
}

    /* Push toolbar */
    .push-toolbar{background:#f0fdfa;border:1px solid #99f6e4;border-left:4px solid var(--teal);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .push-toolbar.ok{background:#f0fdf4;border-color:#bbf7d0;border-left-color:#16a34a}

    .stack-legend .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
