name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · type-check · test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: register
          POSTGRES_PASSWORD: register
          POSTGRES_DB: register_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U register -d register_test"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      REGISTER_DB_HOST: 127.0.0.1
      REGISTER_DB_PORT: "5432"
      REGISTER_DB_USER: register
      REGISTER_DB_PASSWORD: register
      REGISTER_DB_NAME: register_test
      ACCESS_DB_HOST: 127.0.0.1
      ACCESS_DB_PORT: "5432"
      ACCESS_DB_USER: register
      ACCESS_DB_PASSWORD: register
      ACCESS_DB_NAME: access_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Postman E2E collection must pass the run-order audit
        run: |
          # Statically simulates a top-to-bottom run: every {{var}} consumed must have a writer
          # before it. Catches the 'literal {{makerUserId}} sent to the API' class without a stack.
          ALLOW=adminToken,makerToken,checkerToken,bearerToken,dexUrl,ssoPassword,googleClientId,googleClientSecret,adminRefreshToken,makerRefreshToken,checkerRefreshToken
          for env in postman/PRISM_Full.postman_environment.json postman/PRISM_Full_Dex.postman_environment.json; do
            python3 scripts/audit_postman.py postman/PRISM_E2E_Full.postman_collection.json "$env" --allow-empty "$ALLOW"
          done

      - name: Dex static passwords must verify against the documented password
        run: |
          # Every doc and both Postman environments say the dev password is "prism". A hash
          # that doesn't verify (e.g. the Dex docs' example hash, which encodes "password")
          # makes every sign-in fail with an unexplained 401 — caught live, never again.
          pip install --quiet bcrypt pyyaml
          python3 - <<'PY'
          import bcrypt, yaml
          cfg = yaml.safe_load(open("deploy/compose/dex/config.yaml"))
          users = cfg.get("staticPasswords", [])
          assert users, "no staticPasswords found in dex config"
          for u in users:
              ok = bcrypt.checkpw(b"prism", u["hash"].encode())
              print(f"{u['email']:35} verifies against 'prism': {ok}")
              assert ok, f"{u['email']}: hash does not verify against the documented password"
          print(f"OK — all {len(users)} Dex identities accept the documented password")
          PY

      - name: Install (shared packages first, then the services)
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/evam-backend-core
          pip install -e "packages/evam-register-client[dev]"
          pip install -e "services/register[dev]"
          pip install -e "services/workflows[dev]"
          pip install -e "services/access[dev]"
          pip install -e "services/gateway[dev]"
          pip install -e "services/vocx[dev]"
          pip install -e "services/pulse[dev]"
          pip install -e "services/stt[dev]"
          pip install -e "services/atlas[dev]"

      - name: Lint (ruff)
        run: |
          python -m ruff check services/register/app services/register/scripts services/register/tests
          python -m ruff check services/workflows/app services/workflows/tests
          python -m ruff check services/access/app services/access/tests
          python -m ruff check services/gateway/app services/gateway/tests
          python -m ruff check services/vocx/app services/vocx/tests
          python -m ruff check services/pulse/app services/pulse/tests
          python -m ruff check services/stt/app services/stt/tests
          python -m ruff check services/atlas/app services/atlas/tests
          python -m ruff check packages/evam-backend-core/evam_backend_core packages/evam-backend-core/examples
          python -m ruff check packages/evam-register-client/evam_register_client packages/evam-register-client/tests

      - name: Type-check (mypy)
        run: |
          (cd services/register && python -m mypy app)
          (cd services/workflows && python -m mypy app)
          (cd services/access && python -m mypy app)
          (cd services/gateway && python -m mypy app)
          (cd services/vocx && python -m mypy app)
          (cd services/pulse && python -m mypy app)
          (cd services/stt && python -m mypy app)
          (cd services/atlas && python -m mypy app)
          (cd packages/evam-backend-core && python -m mypy evam_backend_core)
          (cd packages/evam-register-client && python -m mypy evam_register_client)

      - name: Test — Register (real Postgres + Alembic migration)
        run: |
          # The Access service's test database on the same CI Postgres.
          PGPASSWORD=register psql -h 127.0.0.1 -U register -d register_test \
            -c "CREATE DATABASE access_test;" || true
          cd services/register && python -m pytest -q

      - name: Test — register client
        run: cd packages/evam-register-client && python -m pytest -q

      - name: Test — workflows (Temporal test server + mock Register)
        run: cd services/workflows && python -m pytest -q

      - name: Test (access)
        run: cd services/access && python -m pytest -q

      - name: Test (gateway e2e — real 3-service stack)
        run: cd services/gateway && python -m pytest -q

      - name: Test (vocx e2e — capture → Register)
        run: cd services/vocx && python -m pytest -q

      - name: Test (pulse — matching + scan → intel e2e)
        run: cd services/pulse && python -m pytest -q

      - name: Test — STT (stub engine; no model download)
        run: cd services/stt && python -m pytest -q

      - name: Test (atlas — aggregations + composed views e2e)
        run: cd services/atlas && python -m pytest -q

  images:
    name: docker build (every service image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every service image (build context = repo root)
        run: |
          set -e
          # Catches the class of bug where a Dockerfile installs shared packages
          # --no-deps and the service forgets to declare a transitive dependency:
          # the image builds here even though editable installs in CI would hide it.
          for svc in register access gateway vocx pulse atlas workflows; do
            echo "::group::build prism-$svc"
            docker build -f services/$svc/Dockerfile -t prism-$svc:ci .
            echo "::endgroup::"
          done
      - name: Smoke-import each image's app (deps actually resolve at runtime)
        run: |
          set -e
          docker run --rm prism-gateway:ci python -c "import app.main"
          docker run --rm prism-atlas:ci python -c "import app.main"
          docker run --rm prism-pulse:ci python -c "import app.main"
          docker run --rm prism-vocx:ci python -c "import app.main"
          docker run --rm prism-workflows:ci python -c "import app.api, app.worker"

  helm:
    name: helm template (umbrella + every subchart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint + render the umbrella and each vendored subchart
        run: |
          set -e
          helm lint deploy/helm/prism
          helm template prism deploy/helm/prism > /dev/null
          helm template prism deploy/helm/prism \
            -f deploy/helm/prism/values-local.yaml > /dev/null
          # POSITIVE: the production overlay renders cleanly when the secret guard is off
          # (proves the templates + prod structure are valid with real issuers supplied).
          helm template prism deploy/helm/prism \
            -f deploy/helm/prism/values.yaml \
            -f deploy/helm/prism/values-prod.yaml \
            --set global.requireRealSecrets=false \
            --set gateway.oidc.issuer=https://idp.example.com \
            --set atlas.oidc.issuer=https://idp.example.com \
            --set workflows.api.oidcIssuer=https://idp.example.com > /dev/null
          # NEGATIVE: with the guard ON (the overlay default), the shipped REPLACE-*
          # placeholders MUST fail the render — a prod deploy can't ship placeholder creds.
          if helm template prism deploy/helm/prism \
              -f deploy/helm/prism/values.yaml \
              -f deploy/helm/prism/values-prod.yaml \
              --set gateway.oidc.issuer=https://idp.example.com \
              --set atlas.oidc.issuer=https://idp.example.com \
              --set workflows.api.oidcIssuer=https://idp.example.com > /dev/null 2>render.err; then
            echo "ERROR: prod render with placeholder credentials should have FAILED"; exit 1
          fi
          grep -qi "placeholder" render.err || { echo "expected a placeholder error:"; cat render.err; exit 1; }
          echo "OK: placeholder credentials correctly rejected"
          # POSITIVE: guard ON + EVERY credential replaced with a real value → renders.
          helm template prism deploy/helm/prism \
            -f deploy/helm/prism/values.yaml \
            -f deploy/helm/prism/values-prod.yaml \
            -f deploy/helm/prism/ci/real-secrets.yaml \
            --set gateway.oidc.issuer=https://idp.example.com \
            --set atlas.oidc.issuer=https://idp.example.com \
            --set workflows.api.oidcIssuer=https://idp.example.com > /dev/null
          echo "OK: all-real-credential prod render succeeds"
          # NEGATIVE: all creds real EXCEPT an EMBEDDED service-key placeholder → must fail
          # (guards the hasPrefix-vs-contains bypass; the string starts with 'svc_...').
          if helm template prism deploy/helm/prism \
              -f deploy/helm/prism/values.yaml \
              -f deploy/helm/prism/values-prod.yaml \
              -f deploy/helm/prism/ci/real-secrets.yaml \
              --set register.serviceApiKeys="svc_workflows:REPLACE-svc-workflows-key" \
              --set gateway.oidc.issuer=https://idp.example.com \
              --set atlas.oidc.issuer=https://idp.example.com \
              --set workflows.api.oidcIssuer=https://idp.example.com > /dev/null 2>embed.err; then
            echo "ERROR: an embedded REPLACE- placeholder in serviceApiKeys should have FAILED"; exit 1
          fi
          grep -qi "placeholder" embed.err || { echo "expected a placeholder error:"; cat embed.err; exit 1; }
          echo "OK: embedded service-key placeholder correctly rejected"
          # NEGATIVE: an auth-enabled render with a blank OIDC issuer must also fail.
          if helm template prism deploy/helm/prism \
              -f deploy/helm/prism/values.yaml \
              -f deploy/helm/prism/values-prod.yaml \
              --set global.requireRealSecrets=false > /dev/null 2>issuer.err; then
            echo "ERROR: auth-enabled render with blank OIDC issuer should have FAILED"; exit 1
          fi
          grep -qi "issuer" issuer.err || { echo "expected an issuer error:"; cat issuer.err; exit 1; }
          echo "OK: blank OIDC issuer correctly rejected"
          # NEGATIVE: a PUBLIC issuer (Google/Microsoft) with no domain allowlist must fail.
          # Google mints a valid token for ANY consumer account, so accepting it without the
          # allowlist would let a personal @gmail.com authenticate. One check per service.
          # (No requireAuth here on purpose: accepting a public issuer is unsafe whether or not
          # auth is mandatory, so the guard must fire on the issuer setting alone.)
          for arg in "gateway.oidc.issuer" "atlas.oidc.issuer" "workflows.api.oidcIssuer"; do
            if helm template prism deploy/helm/prism \
                -f deploy/helm/prism/values.yaml \
                --set "$arg=https://accounts.google.com" > /dev/null 2>pub.err; then
              echo "ERROR: $arg=<google> with no allowedDomains should have FAILED"; exit 1
            fi
            grep -qi "public issuer" pub.err || { echo "expected a public-issuer error:"; cat pub.err; exit 1; }
            echo "OK: public issuer without a domain allowlist rejected ($arg)"
          done
          # POSITIVE: the multi-issuer form alone satisfies requireAuth (no single issuer set),
          # and renders once the allowlist is supplied — the dev-Dex + prod-Google posture.
          helm template prism deploy/helm/prism \
            -f deploy/helm/prism/values.yaml \
            --set gateway.oidc.requireAuth=true \
            --set gateway.oidc.allowedDomains=evamfinance.com \
            --set 'gateway.oidc.issuers=https://accounts.google.com|cid.apps.googleusercontent.com\,http://dex:5556/dex|prism' \
            > multi.yaml
          grep -q 'GATEWAY_OIDC_ISSUERS' multi.yaml || { echo "GATEWAY_OIDC_ISSUERS not rendered"; exit 1; }
          grep -q 'GATEWAY_OIDC_ALLOWED_DOMAINS' multi.yaml || { echo "GATEWAY_OIDC_ALLOWED_DOMAINS not rendered"; exit 1; }
          rm -f multi.yaml render.err embed.err issuer.err pub.err
          echo "OK: multi-issuer + allowlist render, and both env vars reach the container"
          for c in deploy/helm/prism/charts/*/; do
            echo "::group::helm template $c"
            helm template "$(basename "$c")" "$c" > /dev/null
            echo "::endgroup::"
          done
