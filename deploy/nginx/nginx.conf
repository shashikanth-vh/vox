# PRISM edge — NGINX reverse proxy in front of the Register (and future services).
# Responsibilities: TLS termination (prod), routing + load-balancing, edge rate-limiting,
# correlation-id at the boundary, security headers, gzip, sane timeouts.
worker_processes auto;
events { worker_connections 1024; }

http {
    # Start the correlation id at the edge: honour an inbound X-Request-ID, else mint one.
    # The Register's middleware reads X-Request-ID, so a call is traceable from NGINX in.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format edge '$remote_addr [$time_iso8601] "$request" $status ${body_bytes_sent}B '
                    'req=$req_id rt=${request_time}s urt=$upstream_response_time';
    access_log /var/log/nginx/access.log edge;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 25m;          # allow ATLAS MIS xlsx uploads

    gzip on;
    gzip_types application/json text/plain application/xml;

    # Edge abuse guard (a first line before app-level limits): ~50 req/s per client IP.
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_status 429;
    limit_conn_zone  $binary_remote_addr zone=conn:10m;

    # One public edge, ONE trust boundary behind it: EVERY request goes to the gateway,
    # which authenticates the caller, strips any client-presented backend key, injects the
    # scoped upstream service credential, mints the signed internal context, and routes by
    # path prefix to ATLAS / VocX / PULSE / orchestrator (or the Register by default).
    # Nothing is reachable around the gateway — the sub-services hold no public port and
    # accept only the gateway's own injected key. Add `server` lines to scale the gateway.
    upstream gateway { server gateway:8000; keepalive 32; }
    # The ATLAS UI container (deploy/ui image) — static files, no credentials, no data.
    upstream ui { server ui:80; keepalive 8; }

    # Plaintext exists only to bounce callers to TLS. Health probes are answered on :80 too so
    # container/orchestrator checks don't need the cert.
    server {
        listen 80;
        server_name _;

        location = /healthz { proxy_pass http://gateway; access_log off; }
        location = /readyz  { proxy_pass http://gateway; access_log off; }

        location / { return 301 https://$host$request_uri; }
    }

    server {
        # TLS terminates HERE. Everything past the edge is inside the perimeter.
        # Certificate: self-signed for local/demo — generate with `scripts/gen_dev_certs.sh`.
        # For production, mount a CA-issued pair at the same paths (or use cert-manager in K8s);
        # nothing else in this file changes.
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS is deliberately NOT set: with a self-signed cert on localhost it would pin
        # browsers to HTTPS for this host and make later local HTTP debugging painful. Enable it
        # (`add_header Strict-Transport-Security "max-age=31536000" always;`) with a real cert.

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Common proxy behaviour, set once at server scope. A location inherits these ONLY
        # if it declares no proxy_set_header of its own — so none of the locations below do.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;   # carry the OIDC bearer through
        proxy_set_header X-Request-ID $req_id;                # correlation from the edge
        add_header       X-Request-ID $req_id always;
        proxy_connect_timeout 5s;
        proxy_send_timeout    65s;
        proxy_read_timeout    65s;

        # Health probes bypass rate-limiting and access logs.
        location = /healthz { proxy_pass http://gateway; access_log off; }
        location = /readyz  { proxy_pass http://gateway; access_log off; }

        # ---- The ATLAS UI, served from THIS origin ------------------------------- #
        # The UI ships as its own image (deploy/ui/Dockerfile); the edge proxies /ui/
        # to it with no path rewriting (the container mirrors the /ui layout, SPA
        # fallback included). Because the UI and every API share this one origin, the
        # browser applies NO cross-origin rules: no CORS preflights, nothing to
        # configure. (A UI hosted elsewhere instead uses GATEWAY_CORS_ORIGINS.)
        location = / { return 302 /ui/; }
        location /ui/ { proxy_pass http://ui; }

        # EVERYTHING → the gateway. The gateway routes `/atlas`, `/vocx`, `/pulse` and
        # `/orchestrator` to their services (stripping the prefix + injecting that
        # service's scoped key) and everything else to the Register behind the RBAC gate.
        # The edge no longer forwards to any sub-service directly.
        location / {
            limit_req  zone=api burst=100 nodelay;
            limit_conn conn 50;
            proxy_pass http://gateway;
        }
    }
}
