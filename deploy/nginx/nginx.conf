# PRISM edge — NGINX reverse proxy in front of the Register (and future services).
# Responsibilities: TLS termination (prod), routing + load-balancing, edge rate-limiting,
# correlation-id at the boundary, security headers, gzip, sane timeouts.
worker_processes auto;
events { worker_connections 1024; }

http {
    # Start the correlation id at the edge: honour an inbound X-Request-ID, else mint one.
    # The Register's middleware reads X-Request-ID, so a call is traceable from NGINX in.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format edge '$remote_addr [$time_iso8601] "$request" $status ${body_bytes_sent}B '
                    'req=$req_id rt=${request_time}s urt=$upstream_response_time';
    access_log /var/log/nginx/access.log edge;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 25m;          # allow ATLAS MIS xlsx uploads

    gzip on;
    gzip_types application/json text/plain application/xml;

    # Edge abuse guard (a first line before app-level limits): ~50 req/s per client IP.
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_status 429;
    limit_conn_zone  $binary_remote_addr zone=conn:10m;

    # One public edge fronts EVERY PRISM service. `/` is the gateway (binary RBAC gate →
    # Register); each other service gets a stable path prefix so the whole platform is
    # reachable on a single host/port instead of a spread of dev ports. Each upstream can
    # gain more `server` lines for horizontal load-balancing.
    upstream gateway      { server gateway:8000;      keepalive 32; }
    upstream atlas        { server atlas:8000;        keepalive 16; }
    upstream vocx         { server vocx:8000;         keepalive 16; }
    upstream pulse        { server pulse:8000;        keepalive 16; }
    upstream orchestrator { server orchestrator:8000; keepalive 16; }

    server {
        listen 80;
        server_name _;

        # For production, terminate TLS here instead:
        #   listen 443 ssl http2;
        #   ssl_certificate     /etc/nginx/certs/tls.crt;
        #   ssl_certificate_key /etc/nginx/certs/tls.key;
        # and redirect :80 → :443.

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Common proxy behaviour, set once at server scope. A location inherits these ONLY
        # if it declares no proxy_set_header of its own — so none of the locations below do.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;   # carry the OIDC bearer through
        proxy_set_header X-Request-ID $req_id;                # correlation from the edge
        add_header       X-Request-ID $req_id always;
        proxy_connect_timeout 5s;
        proxy_send_timeout    65s;
        proxy_read_timeout    65s;

        # Health probes bypass rate-limiting and access logs.
        location = /healthz { proxy_pass http://gateway; access_log off; }
        location = /readyz  { proxy_pass http://gateway; access_log off; }

        # Per-service prefixes. The trailing slash on both the location and the proxy_pass
        # target strips the prefix, so `/atlas/v1/dashboard` reaches ATLAS as `/v1/dashboard`.
        location /atlas/        { limit_req zone=api burst=100 nodelay; limit_conn conn 50; proxy_pass http://atlas/; }
        location /vocx/         { limit_req zone=api burst=100 nodelay; limit_conn conn 50; proxy_pass http://vocx/; }
        location /pulse/        { limit_req zone=api burst=100 nodelay; limit_conn conn 50; proxy_pass http://pulse/; }
        location /orchestrator/ { limit_req zone=api burst=100 nodelay; limit_conn conn 50; proxy_pass http://orchestrator/; }

        # Everything else → the gateway (Register REST behind the RBAC gate).
        location / {
            limit_req  zone=api burst=100 nodelay;
            limit_conn conn 50;
            proxy_pass http://gateway;
        }
    }
}
