# Chitti host: the only published entry point to Chitti and DocRAG.
worker_processes auto;
events { worker_connections 1024; }
http {
    server_tokens off;
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 128k;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass X-API-Key and X-Internal-Context unchanged; Chitti verifies both.
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 325s;
        proxy_send_timeout 325s;

        # Resolve at request time so application recreation does not pin an old IP.
        resolver 127.0.0.11 valid=10s;
        set $chitti_upstream http://chitti:8000;
        location /v1/ { proxy_pass $chitti_upstream; }

        # DocRAG, for the services host's gateway and orchestrator: /docrag/v1/... ->
        # docrag:8000/v1/... It takes whole documents (DocRAG accepts 50 MB) and a scan
        # can spend minutes in OCR, so it gets its own body limit and timeouts.
        set $docrag_upstream http://docrag:8000;
        location /docrag/ {
            client_max_body_size 51m;
            proxy_read_timeout 620s;
            proxy_send_timeout 620s;
            rewrite ^/docrag/(.*)$ /$1 break;
            proxy_pass $docrag_upstream;
        }
        location = /healthz { proxy_pass $chitti_upstream; access_log off; }
        location = /readyz { proxy_pass $chitti_upstream; access_log off; }
        location / { return 404; }
    }
}
