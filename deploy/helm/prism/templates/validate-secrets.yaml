{{- /*
Fail the render if any production credential is still a placeholder. Enabled by
`global.requireRealSecrets` (set true in values-prod.yaml); OFF by default so dev/CI renders
are unaffected. Each check is skipped when an existingSecret is configured for that credential.
All value/existingSecret reads use `dig` → a missing key is empty, never a template error, so a
deployment that supplies real secrets always renders.
*/ -}}
{{- if .Values.global.requireRealSecrets }}
{{- /* {value, existingSecret} credentials — validated only when no external Secret is set. */ -}}
{{- include "prism.assertSecret" (dict "name" "gateway.accessApiKey" "value" (dig "gateway" "accessApiKey" "value" "" .Values) "existingSecret" (dig "gateway" "accessApiKey" "existingSecret" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "gateway.gatewaySecret" "value" (dig "gateway" "gatewaySecret" "value" "" .Values) "existingSecret" (dig "gateway" "gatewaySecret" "existingSecret" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "access.apiKeys" "value" (dig "access" "apiKeys" "value" "" .Values) "existingSecret" (dig "access" "apiKeys" "existingSecret" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "atlas.access.apiKey" "value" (dig "atlas" "access" "apiKey" "value" "" .Values) "existingSecret" (dig "atlas" "access" "apiKey" "existingSecret" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "atlas.register.apiKey" "value" (dig "atlas" "register" "apiKey" "value" "" .Values) "existingSecret" (dig "atlas" "register" "apiKey" "existingSecret" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "vocx.register.apiKey" "value" (dig "vocx" "register" "apiKey" "value" "" .Values) "existingSecret" (dig "vocx" "register" "apiKey" "existingSecret" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "pulse.register.apiKey" "value" (dig "pulse" "register" "apiKey" "value" "" .Values) "existingSecret" (dig "pulse" "register" "apiKey" "existingSecret" "" .Values)) }}
{{- /* Plain-string credentials (no existingSecret escape). */ -}}
{{- include "prism.assertSecret" (dict "name" "gateway.internalSigningSecret" "value" (dig "gateway" "internalSigningSecret" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "gateway.serviceCredentials.registerApiKey" "value" (dig "gateway" "serviceCredentials" "registerApiKey" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "gateway.serviceCredentials.registerAdminApiKey" "value" (dig "gateway" "serviceCredentials" "registerAdminApiKey" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "gateway.serviceCredentials.pulseApiKey" "value" (dig "gateway" "serviceCredentials" "pulseApiKey" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "gateway.serviceCredentials.orchestratorApiKey" "value" (dig "gateway" "serviceCredentials" "orchestratorApiKey" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "gateway.serviceCredentials.vocxApiKey" "value" (dig "gateway" "serviceCredentials" "vocxApiKey" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "register.gatewaySharedSecret" "value" (dig "register" "gatewaySharedSecret" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "register.internalSigningSecret" "value" (dig "register" "internalSigningSecret" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "register.adminApiKeys" "value" (dig "register" "adminApiKeys" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "register.serviceApiKeys" "value" (dig "register" "serviceApiKeys" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "register.access.apiKey" "value" (dig "register" "access" "apiKey" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "access.gatewaySharedSecret" "value" (dig "access" "gatewaySharedSecret" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "atlas.gatewaySharedSecret" "value" (dig "atlas" "gatewaySharedSecret" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "atlas.internalSigningSecret" "value" (dig "atlas" "internalSigningSecret" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "vocx.internalSigningSecret" "value" (dig "vocx" "internalSigningSecret" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "vocx.orchestrator.apiKey" "value" (dig "vocx" "orchestrator" "apiKey" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "vocx.config.apiKeys" "value" (dig "vocx" "config" "apiKeys" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "pulse.config.apiKeys" "value" (dig "pulse" "config" "apiKeys" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "workflows.register.apiKey" "value" (dig "workflows" "register" "apiKey" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "workflows.internalSigningSecret" "value" (dig "workflows" "internalSigningSecret" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "workflows.api.apiKeys" "value" (dig "workflows" "api" "apiKeys" "" .Values)) }}
{{- include "prism.assertSecret" (dict "name" "workflows.api.accessApiKey" "value" (dig "workflows" "api" "accessApiKey" "" .Values)) }}
{{- end }}
