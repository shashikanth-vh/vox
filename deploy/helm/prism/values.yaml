# PRISM umbrella values. Subchart values are nested under the subchart name.
# The shared PostgreSQL is deployed once; every module points at `prism-postgresql`.

# ---- shared platform database -------------------------------------------------
postgresql:
  enabled: true
  fullnameOverride: prism-postgresql   # stable name all modules connect to
  auth:
    username: prism
    password: prism                    # OVERRIDE in real deployments (or use existingSecret)
    database: register
  # One server, a database per service: the Access service's db is created at first init.
  extraDatabases: [access]
  persistence:
    enabled: true
    size: 10Gi

# ---- Register module ----------------------------------------------------------
register:
  enabled: true
  fullnameOverride: prism-register     # stable name Temporal workers/other modules use
  database:
    host: prism-postgresql
    port: 5432
    name: register
    user: prism
    # Reuse the password Secret the postgresql subchart creates.
    existingSecret: prism-postgresql-secret
    existingSecretPasswordKey: postgres-password
  # DB and app come up together — run migrations in the main phase and wait for the DB.
  migrations:
    asHook: false
    seed: false
  waitForDb: true
  # RBAC-mandatory: gated operations require a user identity even from machine callers.
  # (Platform services use ungated write paths; flip to false only for bare-Register dev.)
  enforceRbac: true
  gatewaySharedSecret: "prism-gateway-secret"   # must match gateway.gatewaySecret.value
  # Document bytes → the bundled MinIO (below). Reuse MinIO's chart-managed secret for the
  # secret key. Set storage.backend=inline (or point s3.* at a managed S3) to change this.
  storage:
    backend: s3
    s3:
      bucket: prism-documents
      endpointUrl: http://prism-minio:9000
      region: us-east-1
      useSsl: false
      pathStyle: true
      accessKeyId: prism
      existingSecret: prism-minio-secret
      existingSecretKey: root-password

# ---- Identity & authorization (three-service RBAC) -----------------------------
# The Access service owns users, roles and the admin-editable access matrix; the
# Gateway is the REST-API service every client enters through (cached binary gate,
# future client-specific logic). The Register verifies gateway-stamped identity.
access:
  enabled: true
  fullnameOverride: prism-access
  database:
    host: prism-postgresql
    port: 5432
    name: access
    user: prism
    existingSecret: prism-postgresql-secret
    existingSecretPasswordKey: postgres-password
  apiKeys:
    value: "dev-local-key"        # OVERRIDE in real deployments
  # Governance requires a user context even from API-key callers — an identity-less
  # holder of the Access key cannot mint users/roles.
  config:
    enforceRbac: true

gateway:
  enabled: true
  fullnameOverride: prism-gateway
  upstreams:
    registerUrl: http://prism-register
    accessUrl: http://prism-access
  accessApiKey:
    value: "dev-local-key"        # must be in the Access service's ACCESS_API_KEYS
  gatewaySecret:
    value: "prism-gateway-secret" # OVERRIDE; must match register.gatewaySharedSecret
  # The public entry point: enable + set a host to expose the platform. The Register
  # itself has an ingress template too, but keep it OFF — traffic must enter here.
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls: []

# ---- VocX — voice touchpoint capture (individually deployable) -----------------
vocx:
  enabled: true
  fullnameOverride: prism-vocx
  register:
    baseUrl: http://prism-register
    tenant: EVAM
    apiKey:
      value: "dev-local-key"      # must be in the Register's REGISTER_API_KEYS

# ---- PULSE — news / adverse-media radar (individually deployable) ---------------
pulse:
  enabled: true
  fullnameOverride: prism-pulse
  register:
    baseUrl: http://prism-register
    tenant: EVAM
    apiKey:
      value: "dev-local-key"      # must be in the Register's REGISTER_API_KEYS
  config:
    # Point at real feeds in production, e.g.
    # '[{"name":"google-news","kind":"rss","url":"https://news.google.com/rss/search?q=..."}]'
    sources: '[{"name": "sample", "kind": "sample"}]'
    apiKeys: ""                   # SET in production — PULSE's own front door
  scan:
    enabled: true
    schedule: "30 1 * * *"        # 01:30 UTC = 07:00 IST — the morning radar run
    tenants: [EVAM]

# ---- ATLAS — the live management dashboard service (individually deployable) ----
atlas:
  enabled: true
  fullnameOverride: prism-atlas
  register:
    baseUrl: http://prism-register
    tenant: EVAM
    apiKey:
      value: "dev-local-key"      # must be in the Register's REGISTER_API_KEYS
  access:
    url: http://prism-access      # view-level RBAC; "" disables gating (dev only)
    apiKey:
      value: "dev-local-key"      # must be in the Access service's ACCESS_API_KEYS
    requireUser: true             # dashboards must be attributable in production

# ---- Object storage (document bytes) ------------------------------------------
# S3-compatible store for the Data Register uploads. Dev/staging single node; for
# production set minio.enabled=false and point register.storage.s3.* at a managed S3.
minio:
  enabled: true
  fullnameOverride: prism-minio        # stable name the Register dials (prism-minio:9000)
  auth:
    rootUser: prism
    rootPassword: prism-secret         # OVERRIDE in real deployments (or use existingSecret)
  persistence:
    enabled: true
    size: 20Gi

# ---- Workflows ring: Temporal engine + the PRISM worker -----------------------
# Temporal (dev/staging server on the shared PostgreSQL, in its own databases). For
# production, point temporal.datastore.* at a DEDICATED instance.
temporal:
  enabled: true
  fullnameOverride: prism-temporal     # stable name workers dial (prism-temporal:7233)
  datastore:
    host: prism-postgresql
    port: 5432
    user: prism
    existingSecret: prism-postgresql-secret
    existingSecretPasswordKey: postgres-password
    database: temporal
    visibilityDatabase: temporal_visibility
  ui:
    enabled: true

# The PRISM worker — runs workflows/activities; activities write the Register via the SDK.
workflows:
  enabled: true
  fullnameOverride: prism-workflows
  image:
    repository: ghcr.io/evam/prism-workflows
    tag: "0.1.0"
  temporal:
    address: prism-temporal:7233
  register:
    baseUrl: http://prism-register     # the Register Service (port 80)
    tenant: EVAM
    apiKey: dev-local-key              # OVERRIDE; must be in the Register's REGISTER_API_KEYS
  # The Orchestrator API (prism-workflows-api): starts workflows over HTTP with stable
  # business ids, delivers approve/reject signals, answers status queries.
  api:
    enabled: true
    # A real key so the Orchestrator is not open by default. OVERRIDE per environment.
    apiKeys: "prism-workflows-key"
    # Verified approvals: set an OIDC issuer to derive the approver from the bearer
    # token and confirm the role via the Access service. Empty = 'by' is trusted (dev).
    oidcIssuer: ""
    oidcAudience: ""
    accessUrl: http://prism-access
    accessApiKey: "dev-local-key"

# Future modules slot in here as they are built, e.g.:
# cipher:
#   enabled: false
#   database: { host: prism-postgresql, name: register, user: prism, ... }
