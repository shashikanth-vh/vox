# CI-only overrides: every production credential set to a REAL (non-placeholder) value, so a
# render with global.requireRealSecrets=true (the production posture) succeeds. Paired with a
# targeted negative test that re-introduces a single embedded placeholder. NOT for real deploys.
gateway:
  accessApiKey:
    value: real-access-key
  gatewaySecret:
    value: real-gateway-secret
  internalSigningSecret: real-signing-secret
  serviceCredentials:
    registerApiKey: real-svc-gateway
    pulseApiKey: real-pulse-front
    orchestratorApiKey: real-orchestrator-front
    registerAdminApiKey: real-admin-key
    vocxApiKey: real-vocx-front
atlas:
  access:
    apiKey:
      value: real-access-key
  register:
    apiKey:
      value: real-svc-atlas
  gatewaySharedSecret: real-gateway-secret
  internalSigningSecret: real-signing-secret
register:
  gatewaySharedSecret: real-gateway-secret
  internalSigningSecret: real-signing-secret
  adminApiKeys: real-admin-key
  serviceApiKeys: "svc_atlas:real-a,svc_vox:real-v,svc_pulse:real-p,svc_workflows:real-w,svc_gateway:real-g"
  access:
    apiKey: real-access-key
access:
  apiKeys:
    value: real-access-key
  gatewaySharedSecret: real-gateway-secret
vocx:
  register:
    apiKey:
      value: real-svc-vox
  orchestrator:
    apiKey: real-orchestrator-front
  internalSigningSecret: real-signing-secret
  config:
    apiKeys: real-vocx-front
pulse:
  register:
    apiKey:
      value: real-svc-pulse
  config:
    apiKeys: real-pulse-front
workflows:
  register:
    apiKey: real-svc-workflows
  internalSigningSecret: real-signing-secret
  api:
    apiKeys: real-orchestrator-front
    accessApiKey: real-access-key
