name: docrag
description: >-
  PRISM DocRAG — document → knowledge → hybrid retrieval with cited answers. Upload a
  PDF/XLSX, it is reconstructed (OpenDataLoader + PyMuPDF, Sarvam Doc AI for scans),
  chunked, embedded (FastEmbed, models baked into the image) and indexed in its own
  Qdrant (dense + BM25 hybrid, tenant-partitioned).
