# PRISM VocX (voice touchpoint capture + the voice pipeline). Stateless except the
# pipeline volume (Google tokens, PKCE state, alias map, audio archive, Whisper cache).
fullnameOverride: ""       # umbrella sets prism-vocx
nameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/evam/prism-vocx
  tag: "0.1.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []

register:
  baseUrl: http://prism-register
  tenant: EVAM
  # Must be present in the Register's REGISTER_API_KEYS.
  apiKey:
    existingSecret: ""
    existingSecretKey: api-key
    value: "change-me-in-prod"

# Company-name captures run as durable workflows via the Orchestrator API.
# Empty = workflow path off (direct subject captures only).
orchestrator:
  url: http://prism-workflows-api
  apiKey: ""

# Verify + re-mint the caller's signed context so the HUMAN (not VocX's service key)
# authorizes Register interaction writes. Must equal register.internalSigningSecret.
# Empty = dev (the service key is the actor). Rendered into the chart Secret.
internalSigningSecret: ""

config:
  logLevel: INFO
  logJson: true
  # VocX's OWN front door: the key the gateway injects. Empty = open (rely on a
  # NetworkPolicy). Set in production so VocX is not directly callable by any pod. Must
  # equal gateway.serviceCredentials.vocxApiKey.
  apiKeys: ""
  # Refuse a user-triggered capture without a verified delegated identity (implied when
  # internalSigningSecret is set). Keeps VocX from silently writing as its own service key.
  requireDelegation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

serviceAccount:
  create: true
  name: ""

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podSecurityContext:
  fsGroup: 1000

nodeSelector: {}
tolerations: []
affinity: {}


# --- The voice pipeline (/vocx/api/vocx/*) --------------------------------------------
pipeline:
  enabled: true
  # Anthropic key for Claude extraction; empty = offline stub. Prefer existingSecret.
  anthropicApiKey:
    existingSecret: ""
    existingSecretKey: api-key
    value: ""
  # Persistent state: per-RM Google tokens, PKCE, alias map, audio archive, Whisper
  # model cache. ReadWriteOnce is fine with replicaCount 1; use RWX storage to scale out.
  state:
    enabled: true
    size: 5Gi
    storageClassName: ""
    existingClaim: ""
  google:
    # Secret holding client_secret.json (create it out of band; never in values):
    #   kubectl create secret generic prism-vocx-google --from-file=client_secret.json
    existingSecret: ""
    # The OAuth redirect as the BROWSER reaches it — the EDGE url; also add it in
    # Google Cloud Console. The gateway exempts exactly this path from require_auth.
    redirectUri: ""
  # Intelligence features (Batch 1) — each independently switchable.
  intelligence:
    sttPriming: true        # prime Whisper with finance vocabulary + live corpus names
    glossary: true          # Evam domain glossary in the extraction prompt
    fewShot: true           # worked examples in the extraction prompt
    structuredOutput: true  # forced structured output (off = text + lenient parse)
  # api (the dedicated PRISM STT service — default) | faster_whisper (in-process;
  # needs the vocx [stt] extra baked into the image) | stub (tests)
  sttBackend: "api"
  stt:
    # The STT service as reachable in-cluster (the umbrella deploys it as prism-stt).
    apiUrl: "http://prism-stt/v1/audio/transcriptions"
    # Must be one of the STT service's STT_API_KEYS.
    apiKey: ""
  # Recorded-audio bytes → MinIO/S3 (references ride on the interaction). Empty endpoint =
  # volume-only. Retention >0 becomes a bucket lifecycle rule.
  audio:
    s3EndpointUrl: "http://prism-minio:9000"
    # Browser-reachable endpoint for presigned playback URLs (ingress/NodePort to MinIO).
    s3PublicEndpointUrl: ""
    bucket: "prism-vocx-captures"
    retentionDays: 0
    credentials:
      existingSecret: ""            # keys: access-key-id, secret-access-key
      accessKeyId: ""
      secretAccessKey: ""
