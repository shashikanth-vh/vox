apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vocx.fullname" . }}
  labels:
    {{- include "vocx.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vocx.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "vocx.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "vocx.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: vocx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: VOCX_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: VOCX_LOG_JSON
              value: {{ .Values.config.logJson | quote }}
            # --- voice pipeline -------------------------------------------------------
            - name: VOCX_PIPELINE_ENABLED
              value: {{ .Values.pipeline.enabled | quote }}
            {{- if .Values.pipeline.enabled }}
            - name: VOCX_TOKENS_DIR
              value: "/data/vocx"
            - name: VOCX_STT_BACKEND
              value: {{ .Values.pipeline.sttBackend | quote }}
            {{- if .Values.pipeline.audio.s3EndpointUrl }}
            - name: VOCX_S3_ENDPOINT_URL
              value: {{ .Values.pipeline.audio.s3EndpointUrl | quote }}
            - name: VOCX_S3_BUCKET
              value: {{ .Values.pipeline.audio.bucket | quote }}
            {{- if .Values.pipeline.audio.s3PublicEndpointUrl }}
            - name: VOCX_S3_PUBLIC_ENDPOINT_URL
              value: {{ .Values.pipeline.audio.s3PublicEndpointUrl | quote }}
            {{- end }}
            - name: VOCX_AUDIO_RETENTION_DAYS
              value: {{ .Values.pipeline.audio.retentionDays | quote }}
            {{- if .Values.pipeline.audio.credentials.existingSecret }}
            - name: VOCX_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pipeline.audio.credentials.existingSecret }}
                  key: access-key-id
            - name: VOCX_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pipeline.audio.credentials.existingSecret }}
                  key: secret-access-key
            {{- else }}
            - name: VOCX_S3_ACCESS_KEY_ID
              value: {{ .Values.pipeline.audio.credentials.accessKeyId | quote }}
            - name: VOCX_S3_SECRET_ACCESS_KEY
              value: {{ .Values.pipeline.audio.credentials.secretAccessKey | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.pipeline.google.redirectUri }}
            - name: VOCX_OAUTH_REDIRECT_URI
              value: {{ .Values.pipeline.google.redirectUri | quote }}
            {{- end }}
            {{- if .Values.pipeline.google.existingSecret }}
            - name: VOCX_GOOGLE_CLIENT_SECRET_FILE
              value: "/run/vocx-secrets/client_secret.json"
            {{- end }}
            {{- if or .Values.pipeline.anthropicApiKey.existingSecret .Values.pipeline.anthropicApiKey.value }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.pipeline.anthropicApiKey.existingSecret }}
                  name: {{ .Values.pipeline.anthropicApiKey.existingSecret }}
                  key: {{ .Values.pipeline.anthropicApiKey.existingSecretKey }}
                  {{- else }}
                  name: {{ include "vocx.secretName" . }}
                  key: anthropic-api-key
                  {{- end }}
            {{- end }}
            {{- end }}
            - name: VOCX_REGISTER_BASE_URL
              value: {{ .Values.register.baseUrl | quote }}
            - name: VOCX_REGISTER_TENANT
              value: {{ .Values.register.tenant | quote }}
            - name: VOCX_ORCHESTRATOR_URL
              value: {{ .Values.orchestrator.url | quote }}
            - name: VOCX_ORCHESTRATOR_API_KEY
              value: {{ .Values.orchestrator.apiKey | quote }}
            - name: VOCX_REGISTER_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.register.apiKey.existingSecret }}
                  name: {{ .Values.register.apiKey.existingSecret }}
                  key: {{ .Values.register.apiKey.existingSecretKey }}
                  {{- else }}
                  name: {{ include "vocx.secretName" . }}
                  key: register-api-key
                  {{- end }}
            {{- if .Values.internalSigningSecret }}
            - name: VOCX_INTERNAL_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vocx.secretName" . }}
                  key: internal-signing-secret
            {{- end }}
            - name: VOCX_API_KEYS
              value: {{ .Values.config.apiKeys | default "" | quote }}
            - name: VOCX_REQUIRE_DELEGATION
              value: {{ .Values.config.requireDelegation | default false | quote }}
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.pipeline.enabled .Values.pipeline.state.enabled }}
            - name: vocx-state
              mountPath: /data/vocx
            {{- end }}
            {{- if and .Values.pipeline.enabled .Values.pipeline.google.existingSecret }}
            - name: vocx-google
              mountPath: /run/vocx-secrets
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.pipeline.enabled .Values.pipeline.state.enabled }}
        - name: vocx-state
          persistentVolumeClaim:
            claimName: {{ .Values.pipeline.state.existingClaim | default (printf "%s-state" (include "vocx.fullname" .)) }}
        {{- end }}
        {{- if and .Values.pipeline.enabled .Values.pipeline.google.existingSecret }}
        - name: vocx-google
          secret:
            secretName: {{ .Values.pipeline.google.existingSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
