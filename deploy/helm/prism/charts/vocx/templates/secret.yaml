{{- if or (not .Values.register.apiKey.existingSecret) .Values.internalSigningSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vocx.secretName" . }}
  labels:
    {{- include "vocx.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.register.apiKey.existingSecret }}
  register-api-key: {{ .Values.register.apiKey.value | quote }}
  {{- end }}
  {{- if .Values.internalSigningSecret }}
  # Verify + re-mint the caller's signed context so the HUMAN authorizes Register writes.
  internal-signing-secret: {{ .Values.internalSigningSecret | quote }}
  {{- end }}
{{- end }}
