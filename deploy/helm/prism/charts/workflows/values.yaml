# PRISM workflows worker.
fullnameOverride: ""       # umbrella sets prism-workflows
nameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/evam/prism-workflows
  tag: "0.1.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []

temporal:
  address: prism-temporal:7233
  namespace: default
  taskQueue: prism-workflows

# Release-1 workflow foundation (all optional; safe/off defaults).
foundation:
  # Ops events (SLA reminders / escalations / run-control) also POST here when set —
  # Slack/Teams/webhook receiver. Empty = structured log only.
  opsWebhookUrl: ""
  # base64url 32-byte key -> AES-256-GCM encryption of workflow payloads at rest in
  # Temporal. Prefer an existingSecret in production.
  payloadEncryptionKey: ""
  # Per-run search attributes (PrismBusinessStatus / PrismSubject). Register them on the
  # Temporal server before enabling — see services/workflows/README.md.
  searchAttributesEnabled: false
  # Prometheus scrape endpoint for the WORKER's SDK metrics, e.g. "0.0.0.0:9464". "" = off.
  metricsBindAddress: ""
  workerBuildId: ""
  # Increment 2: park ambiguous VOX captures / lead ties for human confirmation.
  voxConfirmAmbiguousCompany: false
  voxConfirmLeadSelection: false
  # Deployment-wide qualification checklist definitions (JSON list; empty = legacy flag).
  qualificationChecklist: ""
  # Increment 7: VOX captures with a next-meeting date create a first-class Register
  # calendar event (per-run idempotent) instead of only the meta.calendar note.
  calendarEventsEnabled: false
  # Defaults for the per-tenant document-expiry monitor (started via the orchestrator's
  # POST /v1/internal/monitors/document-expiry).
  docExpiryIntervalHours: 24
  docExpiryWarnDays: 7

# Increment 7: durable notifications. When enabled, workflow ops events that name
# recipients also land as in-app inbox rows in the Register, fanning out to the listed
# external channels; the notifier deployment drives delivery with retry + dead-letter.
notifications:
  enabled: false
  # Comma-separated subset of "email,sms,webhook" (in-app is implicit).
  channels: ""
  smtpHost: ""
  smtpPort: 587
  smtpFrom: "prism@evamfinance.com"
  smtpUsername: ""
  smtpPassword: ""            # prefer a Secret in production
  smsWebhookUrl: ""
  webhookUrl: ""

# The notification delivery sweep (`python -m app.notifier`). Safe to run always —
# with notifications disabled there is nothing to claim.
notifier:
  enabled: true
  replicaCount: 1
  intervalSeconds: 30
  maxAttempts: 8

register:
  baseUrl: http://prism-register        # the Register Service (umbrella release)
  tenant: EVAM
  # The worker authenticates to the Register with an API key that must be in the
  # Register's REGISTER_API_KEYS. Override, or reference a shared Secret.
  apiKey: dev-local-key
  existingSecret: ""
  existingSecretKey: api-key

config:
  logLevel: INFO
  logJson: true

# Re-mint / verify the signed caller context so workflow writes run as the HUMAN (with
# their scope), not the worker's service key. Must equal register.internalSigningSecret.
# Empty = dev (writes run under the service key). Rendered into the chart Secret.
internalSigningSecret: ""

# The Orchestrator API — same image, `python -m app.api`. The HTTP front door that
# starts workflows with stable business ids, delivers approve/reject signals and
# answers status queries. Disable if workflows are only started from code.
# The decision-delivery reconciler daemon (re-drives accepted-but-undelivered decisions).
reconciler:
  enabled: true
  replicaCount: 1
  intervalSeconds: 30

api:
  enabled: true
  replicaCount: 1
  # Empty = open (dev). ALWAYS set in production (comma-separated keys).
  apiKeys: ""
  # Verified approvals (opt-in): OIDC issuer + Access for approver role checks.
  oidcIssuer: ""
  oidcAudience: ""
  oidcEmailClaim: "email"
  # Several IdPs at once: "issuer|audience,issuer2|audience2" — wins over the pair above.
  oidcIssuers: ""
  # Comma-separated e-mail domains an approver may come from. REQUIRED when the issuer is
  # public (Google/Microsoft); the chart refuses to render without it.
  oidcAllowedDomains: ""
  accessUrl: ""
  accessApiKey: ""
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podSecurityContext:
  fsGroup: 1000

nodeSelector: {}
tolerations: []
affinity: {}
