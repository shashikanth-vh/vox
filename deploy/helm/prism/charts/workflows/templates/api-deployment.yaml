{{- if .Values.api.enabled }}
# The Orchestrator API — the workflow plane's HTTP front door (same image as the
# worker, `python -m app.api`). Stateless: scale by replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workflows.fullname" . }}-api
  labels:
    {{- include "workflows.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "workflows.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: orchestrator-api
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        {{- include "workflows.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: orchestrator-api
    spec:
      serviceAccountName: {{ include "workflows.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: orchestrator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.api"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: WORKFLOWS_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: WORKFLOWS_LOG_JSON
              value: {{ .Values.config.logJson | quote }}
            - name: WORKFLOWS_TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: WORKFLOWS_TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            - name: WORKFLOWS_TASK_QUEUE
              value: {{ .Values.temporal.taskQueue | quote }}
            - name: WORKFLOWS_API_KEYS
              value: {{ .Values.api.apiKeys | quote }}
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
