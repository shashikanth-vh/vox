{{- if .Values.api.enabled }}
# The Orchestrator API — the workflow plane's HTTP front door (same image as the
# worker, `python -m app.api`). Stateless: scale by replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workflows.fullname" . }}-api
  labels:
    {{- include "workflows.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "workflows.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: orchestrator-api
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        {{- include "workflows.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: orchestrator-api
        prism.evam/temporal-client: "true"   # allowed by the Temporal NetworkPolicy
    spec:
      serviceAccountName: {{ include "workflows.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: orchestrator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.api"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: WORKFLOWS_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: WORKFLOWS_LOG_JSON
              value: {{ .Values.config.logJson | quote }}
            - name: WORKFLOWS_TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: WORKFLOWS_TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            - name: WORKFLOWS_TASK_QUEUE
              value: {{ .Values.temporal.taskQueue | quote }}
            # The orchestrator persists each conversion decision to the Register SYNCHRONOUSLY
            # (before it acknowledges), so it needs the Register base URL + its service key.
            - name: WORKFLOWS_REGISTER_BASE_URL
              value: {{ .Values.register.baseUrl | quote }}
            # Release-1 workflow foundation (safe/off defaults; see values.foundation).
            - name: WORKFLOWS_OPS_WEBHOOK_URL
              value: {{ .Values.foundation.opsWebhookUrl | quote }}
            - name: WORKFLOWS_PAYLOAD_ENCRYPTION_KEY
              value: {{ .Values.foundation.payloadEncryptionKey | quote }}
            - name: WORKFLOWS_SEARCH_ATTRIBUTES_ENABLED
              value: {{ .Values.foundation.searchAttributesEnabled | quote }}
            - name: WORKFLOWS_REGISTER_TENANT
              value: {{ .Values.register.tenant | quote }}
            - name: WORKFLOWS_REGISTER_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.register.existingSecret }}
                  name: {{ .Values.register.existingSecret }}
                  key: {{ .Values.register.existingSecretKey }}
                  {{- else }}
                  name: {{ include "workflows.secretName" . }}
                  key: api-key
                  {{- end }}
            # Machine-caller key and Access key come from the Secret — never plaintext env.
            - name: WORKFLOWS_API_KEYS
              valueFrom:
                secretKeyRef:
                  {{- if .Values.register.existingSecret }}
                  name: {{ .Values.register.existingSecret }}
                  key: {{ .Values.api.existingSecretApiKeysKey | default "orchestrator-api-keys" }}
                  {{- else }}
                  name: {{ include "workflows.secretName" . }}
                  key: orchestrator-api-keys
                  {{- end }}
            - name: WORKFLOWS_ACCESS_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.register.existingSecret }}
                  name: {{ .Values.register.existingSecret }}
                  key: {{ .Values.api.existingSecretAccessKeyKey | default "access-api-key" }}
                  {{- else }}
                  name: {{ include "workflows.secretName" . }}
                  key: access-api-key
                  {{- end }}
            # In production set requireAuth=true AND an oidcIssuer so the approver/requester
            # identity is derived from a verified token — never a caller-supplied string.
            {{- if and .Values.api.requireAuth (not .Values.api.oidcIssuer) (not .Values.api.oidcIssuers) }}
            {{- fail "workflows.api.requireAuth is true but neither workflows.api.oidcIssuer nor workflows.api.oidcIssuers is set — set one (e.g. --set workflows.api.oidcIssuer=https://idp.example.com) so approver identity comes from a verified token." }}
            {{- end }}
            {{- /* An approval is the strongest write in the platform. A public issuer without
                   a domain allowlist would let any consumer account be the approver. */}}
            {{- $pub := regexMatch "accounts\\.google\\.com|login\\.microsoftonline\\.com" (printf "%s %s" (.Values.api.oidcIssuer | default "") (.Values.api.oidcIssuers | default "")) }}
            {{- if and $pub (not .Values.api.oidcAllowedDomains) }}
            {{- fail "workflows.api accepts a public issuer (Google/Microsoft) but workflows.api.oidcAllowedDomains is empty — set it (e.g. --set workflows.api.oidcAllowedDomains=evamfinance.com) or any personal account could approve." }}
            {{- end }}
            - name: WORKFLOWS_REQUIRE_AUTH
              value: {{ .Values.api.requireAuth | default false | quote }}
            - name: WORKFLOWS_OIDC_ISSUER
              value: {{ .Values.api.oidcIssuer | default "" | quote }}
            - name: WORKFLOWS_OIDC_AUDIENCE
              value: {{ .Values.api.oidcAudience | default "" | quote }}
            # Several IdPs at once — "issuer|audience,issuer2|audience2"; wins over the pair above.
            - name: WORKFLOWS_OIDC_ISSUERS
              value: {{ .Values.api.oidcIssuers | default "" | quote }}
            - name: WORKFLOWS_OIDC_EMAIL_CLAIM
              value: {{ .Values.api.oidcEmailClaim | default "email" | quote }}
            - name: WORKFLOWS_OIDC_ALLOWED_DOMAINS
              value: {{ .Values.api.oidcAllowedDomains | default "" | quote }}
            - name: WORKFLOWS_ACCESS_URL
              value: {{ .Values.api.accessUrl | default "" | quote }}
            {{- if .Values.internalSigningSecret }}
            # Verify the gateway's signed caller context and thread the human identity into
            # the workflow input (the worker re-mints per activity).
            - name: WORKFLOWS_INTERNAL_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "workflows.secretName" . }}
                  key: internal-signing-secret
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
