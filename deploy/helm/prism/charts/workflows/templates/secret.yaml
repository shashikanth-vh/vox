{{- if or (not .Values.register.existingSecret) .Values.internalSigningSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workflows.secretName" . }}
  labels:
    {{- include "workflows.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.register.existingSecret }}
  # The Register key the worker's activities use to write the book.
  api-key: {{ .Values.register.apiKey | quote }}
  # The Orchestrator's own inbound API key (machine callers) and the Access key it uses
  # for approver role checks — held here as Secret data, never as plaintext pod env.
  orchestrator-api-keys: {{ .Values.api.apiKeys | quote }}
  access-api-key: {{ .Values.api.accessApiKey | default "" | quote }}
  {{- end }}
  {{- if .Values.internalSigningSecret }}
  # Re-mint / verify the signed caller context so workflow writes run as the human.
  internal-signing-secret: {{ .Values.internalSigningSecret | quote }}
  {{- end }}
{{- end }}
