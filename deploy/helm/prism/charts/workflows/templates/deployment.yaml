apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workflows.fullname" . }}
  labels:
    {{- include "workflows.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "workflows.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "workflows.selectorLabels" . | nindent 8 }}
        prism.evam/temporal-client: "true"   # allowed by the Temporal NetworkPolicy
    spec:
      serviceAccountName: {{ include "workflows.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: workflows
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # The image CMD runs `python -m app.worker` (connects out to Temporal).
          env:
            - name: WORKFLOWS_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: WORKFLOWS_LOG_JSON
              value: {{ .Values.config.logJson | quote }}
            - name: WORKFLOWS_TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: WORKFLOWS_TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            - name: WORKFLOWS_TASK_QUEUE
              value: {{ .Values.temporal.taskQueue | quote }}
            - name: WORKFLOWS_REGISTER_BASE_URL
              value: {{ .Values.register.baseUrl | quote }}
            # Release-1 workflow foundation (safe/off defaults; see values.foundation).
            - name: WORKFLOWS_OPS_WEBHOOK_URL
              value: {{ .Values.foundation.opsWebhookUrl | quote }}
            - name: WORKFLOWS_PAYLOAD_ENCRYPTION_KEY
              value: {{ .Values.foundation.payloadEncryptionKey | quote }}
            - name: WORKFLOWS_SEARCH_ATTRIBUTES_ENABLED
              value: {{ .Values.foundation.searchAttributesEnabled | quote }}
            - name: WORKFLOWS_VOX_CONFIRM_AMBIGUOUS_COMPANY
              value: {{ .Values.foundation.voxConfirmAmbiguousCompany | quote }}
            - name: WORKFLOWS_VOX_CONFIRM_LEAD_SELECTION
              value: {{ .Values.foundation.voxConfirmLeadSelection | quote }}
            - name: WORKFLOWS_QUALIFICATION_CHECKLIST
              value: {{ .Values.foundation.qualificationChecklist | quote }}
            - name: WORKFLOWS_METRICS_BIND_ADDRESS
              value: {{ .Values.foundation.metricsBindAddress | quote }}
            - name: WORKFLOWS_WORKER_BUILD_ID
              value: {{ .Values.foundation.workerBuildId | quote }}
            # Increment 7: durable notifications (the worker's ops events fan out to the
            # Register's notification store when enabled; the notifier drives delivery).
            - name: WORKFLOWS_NOTIFICATIONS_ENABLED
              value: {{ .Values.notifications.enabled | quote }}
            - name: WORKFLOWS_NOTIFY_CHANNELS
              value: {{ .Values.notifications.channels | quote }}
            - name: WORKFLOWS_SMTP_HOST
              value: {{ .Values.notifications.smtpHost | quote }}
            - name: WORKFLOWS_SMS_WEBHOOK_URL
              value: {{ .Values.notifications.smsWebhookUrl | quote }}
            - name: WORKFLOWS_NOTIFY_WEBHOOK_URL
              value: {{ .Values.notifications.webhookUrl | quote }}
            - name: WORKFLOWS_REGISTER_TENANT
              value: {{ .Values.register.tenant | quote }}
            - name: WORKFLOWS_REGISTER_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.register.existingSecret }}
                  name: {{ .Values.register.existingSecret }}
                  key: {{ .Values.register.existingSecretKey }}
                  {{- else }}
                  name: {{ include "workflows.secretName" . }}
                  key: api-key
                  {{- end }}
            {{- if .Values.internalSigningSecret }}
            # Re-mint a signed context per activity so the Register authorizes workflow
            # writes as the HUMAN (with their scope), not the worker's service key.
            - name: WORKFLOWS_INTERNAL_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "workflows.secretName" . }}
                  key: internal-signing-secret
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
