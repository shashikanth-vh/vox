{{- $cam := .Values.api.cam }}
{{- if and .Values.api.enabled (or (and $cam.llmApiKey.value (not $cam.llmApiKey.existingSecret)) $cam.docragApiKey) }}
# CAM workbench credentials: the LLM provider key (Bedrock) and DocRAG's front-door key.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workflows.fullname" . }}-cam
  labels:
    {{- include "workflows.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and $cam.llmApiKey.value (not $cam.llmApiKey.existingSecret) }}
  cam-llm-api-key: {{ $cam.llmApiKey.value | quote }}
  {{- end }}
  {{- with $cam.docragApiKey }}
  docrag-api-key: {{ . | quote }}
  {{- end }}
{{- end }}
