{{- $cam := .Values.api.cam }}
{{- $sk := (($cam.sarvam | default dict).apiKey | default dict) }}
{{- $sarvamInline := and $sk.value (not $sk.existingSecret) }}
{{- if and .Values.api.enabled (or (and $cam.llmApiKey.value (not $cam.llmApiKey.existingSecret)) $cam.docragApiKey $sarvamInline) }}
# CAM workbench credentials: the LLM provider keys (Bedrock, Sarvam) and DocRAG's
# front-door key.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workflows.fullname" . }}-cam
  labels:
    {{- include "workflows.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and $cam.llmApiKey.value (not $cam.llmApiKey.existingSecret) }}
  cam-llm-api-key: {{ $cam.llmApiKey.value | quote }}
  {{- end }}
  {{- if $sarvamInline }}
  sarvam-api-key: {{ $sk.value | quote }}
  {{- end }}
  {{- with $cam.docragApiKey }}
  docrag-api-key: {{ . | quote }}
  {{- end }}
{{- end }}
