{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "workflows.fullname" . }}-api
  labels:
    {{- include "workflows.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator-api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "workflows.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator-api
{{- end }}
