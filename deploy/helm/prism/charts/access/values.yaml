# PRISM Access service.
fullnameOverride: ""       # umbrella sets prism-access
nameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/evam/prism-access
  tag: "0.1.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []

database:
  host: prism-postgresql
  port: 5432
  name: access
  user: prism
  existingSecret: ""
  existingSecretPasswordKey: password
  password: ""

apiKeys:
  existingSecret: ""
  existingSecretKey: api-keys
  value: "change-me-in-prod"

# Must match the gateway secret so forwarded identity headers can't be spoofed by a
# shared-key holder (empty = dev, trust X-User-Email as sent).
gatewaySharedSecret: ""

config:
  environment: prod
  logLevel: INFO
  # Production authority model: the container start never writes grants (drift report
  # only); seeding is the explicit versioned command `python -m app.seed`.
  autoSeed: "false"
  logJson: true
  defaultTenantCode: EVAM
  userEmailDomain: evamfinance.com
  enforceRbac: false

# Run migrations + seed (tenant + spec matrix + admin user) before serving.
migrateSeedOnStart: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podSecurityContext:
  fsGroup: 1000

nodeSelector: {}
tolerations: []
affinity: {}
