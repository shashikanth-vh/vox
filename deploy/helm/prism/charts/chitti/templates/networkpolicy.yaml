{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chitti.name" . }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "chitti.name" . }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.gatewayPodLabels | nindent 14 }}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chitti.name" . }}-qdrant
spec:
  podSelector:
    matchLabels:
      app: {{ include "chitti.name" . }}-qdrant
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ include "chitti.name" . }}
      ports: [{protocol: TCP, port: 6333}]
{{- end }}
