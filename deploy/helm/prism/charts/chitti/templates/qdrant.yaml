apiVersion: v1
kind: Service
metadata:
  name: {{ include "chitti.name" . }}-qdrant
spec:
  type: ClusterIP
  selector:
    app: {{ include "chitti.name" . }}-qdrant
  ports:
    - name: http
      port: 6333
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chitti.name" . }}-qdrant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "chitti.name" . }}-qdrant
  template:
    metadata:
      labels:
        app: {{ include "chitti.name" . }}-qdrant
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image | quote }}
          securityContext:
            {{- include "chitti.security" . | nindent 12 }}
          ports:
            - containerPort: 6333
          readinessProbe:
            httpGet: {path: /readyz, port: 6333}
          livenessProbe:
            httpGet: {path: /healthz, port: 6333}
          resources:
            {{- toYaml .Values.qdrant.resources | nindent 12 }}
          volumeMounts:
            - {name: storage, mountPath: /qdrant/storage}
            - {name: snapshots, mountPath: /qdrant/snapshots}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "chitti.name" . }}-qdrant
        - name: snapshots
          emptyDir: {sizeLimit: 64Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
