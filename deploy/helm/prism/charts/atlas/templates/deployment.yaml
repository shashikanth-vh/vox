apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atlas.fullname" . }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "atlas.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "atlas.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "atlas.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: atlas
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ATLAS_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: ATLAS_LOG_JSON
              value: {{ .Values.config.logJson | quote }}
            - name: ATLAS_REGISTER_BASE_URL
              value: {{ .Values.register.baseUrl | quote }}
            - name: ATLAS_REGISTER_TENANT
              value: {{ .Values.register.tenant | quote }}
            - name: ATLAS_ACCESS_URL
              value: {{ .Values.access.url | quote }}
            - name: ATLAS_ACCESS_API_KEY
              value: {{ .Values.access.apiKey.value | quote }}
            - name: ATLAS_GATEWAY_SHARED_SECRET
              value: {{ .Values.gatewaySharedSecret | default "" | quote }}
            - name: ATLAS_REQUIRE_USER
              value: {{ .Values.access.requireUser | quote }}
            # OIDC: with an issuer set, ATLAS derives the caller's e-mail from the VERIFIED
            # bearer token and STOPS trusting a client-asserted X-User-Email.
            - name: ATLAS_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | default "" | quote }}
            - name: ATLAS_OIDC_AUDIENCE
              value: {{ .Values.oidc.audience | default "" | quote }}
            - name: ATLAS_OIDC_EMAIL_CLAIM
              value: {{ .Values.oidc.emailClaim | default "email" | quote }}
            # Several IdPs at once — "issuer|audience,issuer2|audience2"; wins over the pair above.
            - name: ATLAS_OIDC_ISSUERS
              value: {{ .Values.oidc.issuers | default "" | quote }}
            {{- /* A public issuer authenticates every account it hosts, so without a domain
                   allowlist any consumer identity would reach the dashboard. */}}
            {{- $pub := regexMatch "accounts\\.google\\.com|login\\.microsoftonline\\.com" (printf "%s %s" (.Values.oidc.issuer | default "") (.Values.oidc.issuers | default "")) }}
            {{- if and $pub (not .Values.oidc.allowedDomains) }}
            {{- fail "atlas.oidc accepts a public issuer (Google/Microsoft) but atlas.oidc.allowedDomains is empty — set it (e.g. --set atlas.oidc.allowedDomains=evamfinance.com) or any personal account could authenticate." }}
            {{- end }}
            - name: ATLAS_OIDC_ALLOWED_DOMAINS
              value: {{ .Values.oidc.allowedDomains | default "" | quote }}
            {{- if .Values.internalSigningSecret }}
            - name: ATLAS_INTERNAL_SIGNING_SECRET
              value: {{ .Values.internalSigningSecret | quote }}
            {{- end }}
            - name: ATLAS_REGISTER_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.register.apiKey.existingSecret }}
                  name: {{ .Values.register.apiKey.existingSecret }}
                  key: {{ .Values.register.apiKey.existingSecretKey }}
                  {{- else }}
                  name: {{ include "atlas.secretName" . }}
                  key: register-api-key
                  {{- end }}
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
