# PRISM ATLAS (management dashboard BFF). Stateless.
fullnameOverride: ""       # umbrella sets prism-atlas
nameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/evam/prism-atlas
  tag: "0.1.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []

register:
  baseUrl: http://prism-register
  tenant: EVAM
  # Must be present in the Register's REGISTER_API_KEYS.
  apiKey:
    existingSecret: ""
    existingSecretKey: api-key
    value: "change-me-in-prod"

# The Access service — gates ATLAS views by the caller's RBAC view matrix.
# Empty url = gating off (dev only). requireUser: refuse anonymous view calls.
access:
  url: http://prism-access
  apiKey:
    value: "change-me-in-prod"
  requireUser: true

# Must match the Register's gatewaySharedSecret so the Register trusts the
# user identity ATLAS forwards on reads.
gatewaySharedSecret: ""

# Sign the GET-bound internal context the Register verifies (must equal the Register's
# internalSigningSecret). Empty = legacy header propagation (dev).
internalSigningSecret: ""

# Verified identity. Set issuer (+ audience) in production so ATLAS validates the OIDC
# bearer token itself and never trusts a caller-supplied X-User-Email. Empty = dev, where
# ATLAS reads X-User-Email (only safe behind the authenticated gateway).
oidc:
  issuer: ""
  audience: "prism"
  emailClaim: "email"
  # Several IdPs at once: "issuer|audience,issuer2|audience2" — wins over the pair above.
  issuers: ""
  # Comma-separated e-mail domains an identity may come from. REQUIRED when the issuer is
  # public (Google/Microsoft); the chart refuses to render without it.
  allowedDomains: ""

config:
  logLevel: INFO
  logJson: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

serviceAccount:
  create: true
  name: ""

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podSecurityContext:
  fsGroup: 1000

nodeSelector: {}
tolerations: []
affinity: {}
