{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "register.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "register.labels" . | nindent 4 }}
  {{- if .Values.migrations.asHook }}
  annotations:
    # Run before the Deployment rolls, on install and upgrade (external DB already exists).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  {{- end }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "register.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "register.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.waitForDb }}
      initContainers:
        {{- include "register.waitForDb" . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args: [{{ if .Values.migrations.seed }}"migrate-seed"{{ else if .Values.migrations.bootstrap }}"migrate-bootstrap"{{ else }}"migrate"{{ end }}]
          env:
            {{- include "register.envVars" . | nindent 12 }}
            {{- if .Values.database.migrationUser }}
            # Migrations run DDL + create the register_app role + FORCE RLS, so they must
            # connect as the schema OWNER — not the non-owner runtime role the Deployment
            # uses. These duplicate names override the shared block (last value wins).
            - name: REGISTER_DB_USER
              value: {{ .Values.database.migrationUser | quote }}
            {{- if .Values.database.migrationExistingSecret }}
            - name: REGISTER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.migrationExistingSecret }}
                  key: {{ .Values.database.migrationExistingSecretPasswordKey | default "postgres-password" }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
