{{- $needDbSecret := not .Values.database.existingSecret }}
{{- $needApiSecret := not .Values.apiKeys.existingSecret }}
{{- $needS3Secret := and (eq .Values.storage.backend "s3") (not .Values.storage.s3.existingSecret) }}
{{- $needAdminSecret := .Values.adminApiKeys }}
{{- $needSigning := .Values.internalSigningSecret }}
{{- $needServiceKeys := .Values.serviceApiKeys }}
{{- if or $needDbSecret $needApiSecret $needS3Secret $needAdminSecret $needSigning $needServiceKeys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "register.secretName" . }}
  labels:
    {{- include "register.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needDbSecret }}
  # The Register's credential for the shared PRISM PostgreSQL.
  db-password: {{ include "register.dbPasswordValue" . | quote }}
  {{- end }}
  {{- if $needApiSecret }}
  api-keys: {{ .Values.apiKeys.value | quote }}
  {{- end }}
  {{- if $needAdminSecret }}
  # Separate, higher-privilege credential for tenant administration (X-Admin-Key).
  admin-api-keys: {{ .Values.adminApiKeys | quote }}
  {{- end }}
  {{- if $needSigning }}
  # Shared secret to verify the gateway's signed internal context (must match the gateway).
  internal-signing-secret: {{ .Values.internalSigningSecret | quote }}
  {{- end }}
  {{- if $needServiceKeys }}
  # Named service principals: "svc_pulse:key,svc_vox:key,svc_workflows:key".
  service-api-keys: {{ .Values.serviceApiKeys | quote }}
  {{- end }}
  {{- if $needS3Secret }}
  # Object-storage secret key for document bytes.
  s3-secret-access-key: {{ .Values.storage.s3.secretAccessKey | quote }}
  {{- end }}
{{- end }}
