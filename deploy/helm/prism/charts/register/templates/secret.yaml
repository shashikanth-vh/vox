{{- $needDbSecret := not .Values.database.existingSecret }}
{{- $needApiSecret := not .Values.apiKeys.existingSecret }}
{{- if or $needDbSecret $needApiSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "register.secretName" . }}
  labels:
    {{- include "register.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needDbSecret }}
  # The Register's credential for the shared PRISM PostgreSQL.
  db-password: {{ include "register.dbPasswordValue" . | quote }}
  {{- end }}
  {{- if $needApiSecret }}
  api-keys: {{ .Values.apiKeys.value | quote }}
  {{- end }}
{{- end }}
