# Temporal — dev/staging server on the shared PRISM PostgreSQL.
fullnameOverride: ""      # umbrella sets prism-temporal (stable name workers connect to)
nameOverride: ""

replicaCount: 1

image:
  repository: temporalio/auto-setup   # bundles the Temporal services + schema setup (dev)
  tag: "1.25.2"
  pullPolicy: IfNotPresent

# Datastore — defaults to the shared PRISM PostgreSQL, in its own databases (auto-setup
# creates them). Temporal is write-heavy; for production use a DEDICATED instance.
datastore:
  host: prism-postgresql
  port: 5432
  user: prism
  existingSecret: prism-postgresql-secret
  existingSecretPasswordKey: postgres-password
  password: ""                        # used only when existingSecret is empty
  database: temporal
  visibilityDatabase: temporal_visibility

service:
  type: ClusterIP
  port: 7233                          # frontend gRPC — workers dial this

ui:
  enabled: true
  image:
    repository: temporalio/ui
    tag: "2.31.2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
