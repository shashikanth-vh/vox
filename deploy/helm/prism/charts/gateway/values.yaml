# PRISM Gateway (REST-API service). Stateless.
fullnameOverride: ""       # umbrella sets prism-gateway
nameOverride: ""

replicaCount: 2

image:
  repository: ghcr.io/evam/prism-gateway
  tag: "0.1.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []

upstreams:
  registerUrl: http://prism-register
  accessUrl: http://prism-access
  # Sub-services the gateway fronts by path prefix (/atlas, /vocx, /pulse, /orchestrator).
  # Empty = that prefix is disabled and its paths fall through to the Register, so a
  # partial deploy still works. Set these in production so the whole platform is reachable
  # ONLY through the single trust boundary.
  atlasUrl: ""
  vocxUrl: ""
  pulseUrl: ""
  orchestratorUrl: ""

# API key the gateway itself uses against the Access service.
accessApiKey:
  existingSecret: ""
  existingSecretKey: api-key
  value: "change-me-in-prod"

# The SCOPED service credential the gateway INJECTS per upstream, having stripped the
# client's own X-API-Key at the edge. Each must equal that upstream's inbound key
# (registerApiKey ↔ register.apiKeys, pulseApiKey ↔ pulse.config.apiKeys, orchestratorApiKey
# ↔ workflows.api.apiKeys). Empty = inject nothing (dev, or a service with no key gate).
serviceCredentials:
  registerApiKey: "change-me-in-prod"
  atlasApiKey: ""
  vocxApiKey: ""
  pulseApiKey: ""
  orchestratorApiKey: ""
  # Tenant-administration credential the gateway injects on tenant-admin routes for a
  # verified Admin — so the browser never holds it. Must equal register.adminApiKeys.
  # Empty = don't inject (dev / tenant admin done out-of-band).
  registerAdminApiKey: ""

# Shared secret stamped on forwarded identity headers (Register verifies it).
gatewaySecret:
  existingSecret: ""
  existingSecretKey: gateway-secret
  value: "change-me-in-prod"

# Shared secret used to SIGN the internal context the Register verifies (production
# identity channel). Must equal register.internalSigningSecret. Empty = legacy header
# propagation. Rendered into the chart Secret when set.
internalSigningSecret: ""

config:
  logLevel: INFO
  logJson: true
  cacheTtlS: "60"
  # Hard bound on the last-known-good resolve cache: past this the gateway FAILS CLOSED
  # through an Access outage instead of serving ever-staler grants.
  cacheMaxStaleS: "300"
  # Signing-key id stamped into each internal-context token (rotation support).
  internalSigningKid: "primary"
  defaultTenantCode: EVAM

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podSecurityContext:
  fsGroup: 1000

nodeSelector: {}
tolerations: []
affinity: {}

# Expose the gateway as the platform's public entry point (TLS at the edge).
ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []
  # ATLAS UI service name — set to route /ui (and the bare /) to the SPA container.
  uiService: ""
  # Largest request body the edge will accept. ingress-nginx defaults to 1m, which is
  # smaller than a ledger workbook and smaller than a long voice capture — both would be
  # refused with a 413 the app never sees. Matches the compose edge's 64m.
  proxyBodySize: "64m"
  # THE SLOW LANE. ingress-nginx gives every route a 60s proxy-read-timeout, and its
  # annotations are per-Ingress, not per-path — so the only way to let ONE prefix run
  # long without handing a minutes-long window to a hung register call is a second
  # Ingress object carrying its own annotations. These are the paths that are slow BY
  # DESIGN: a speech capture is transcribed synchronously, and a CAM generation reads
  # whole documents and streams a memo back. The compose edge does exactly this with a
  # scoped `location` block; this is the same rule expressed in Kubernetes.
  #
  # Set to [] to opt out — at which point a voice capture that decodes for longer than
  # a minute is cut off at the edge, and the recorder reports a failure the user cannot
  # act on.
  slowPaths:
    - /vocx/v1/capture
    - /orchestrator/v1/cam
  # Keep this at or above the gateway's own slowUpstreamTimeout (600s) so the EDGE is
  # never the hop that gives up on an answer the platform was still producing.
  slowTimeoutSeconds: 625

# Verified identity (SSO). Set issuer to your IdP to REQUIRE bearer tokens and ignore
# X-User-Email. requireAuth refuses anonymous even without OIDC (a no-anonymous mesh).
oidc:
  issuer: ""
  audience: "prism"
  requireAuth: false
  emailClaim: "email"
  # Several IdPs at once: "issuer|audience,issuer2|audience2". Set this INSTEAD of the
  # single issuer/audience pair when a deployment must accept more than one (e.g. Google
  # for staff plus a break-glass IdP). Precedence: issuers wins when both are set.
  issuers: ""
  # Comma-separated e-mail domains an identity may come from. Empty = no restriction.
  # REQUIRED when the issuer is public (Google/Microsoft) — the chart refuses to render
  # otherwise, because those IdPs authenticate any account they host, not just yours.
  allowedDomains: ""

# Origins allowed to call the APIs from a browser when the UI is hosted on a DIFFERENT
# origin than the edge (e.g. "https://ui.example.com,http://localhost:5173"). Empty =
# no CORS headers; a UI served behind the same ingress needs none. Bearer-header auth
# means no cookies — an allowed origin still needs a valid token on every request.
corsOrigins: ""
