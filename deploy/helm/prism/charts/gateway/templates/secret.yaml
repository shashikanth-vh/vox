{{- $needApi := not .Values.accessApiKey.existingSecret }}
{{- $needSecret := not .Values.gatewaySecret.existingSecret }}
{{- if or $needApi $needSecret .Values.internalSigningSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.secretName" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needApi }}
  access-api-key: {{ .Values.accessApiKey.value | quote }}
  {{- end }}
  {{- if $needSecret }}
  gateway-secret: {{ .Values.gatewaySecret.value | quote }}
  {{- end }}
  {{- if .Values.internalSigningSecret }}
  internal-signing-secret: {{ .Values.internalSigningSecret | quote }}
  {{- end }}
{{- end }}
