{{- $needApi := not .Values.accessApiKey.existingSecret }}
{{- $needSecret := not .Values.gatewaySecret.existingSecret }}
{{/* The register-api-key is always injected downstream, so this Secret always renders. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.secretName" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Always present: the gateway injects this as X-API-Key to the Register on every
  # register-bound request (the client's own key having been stripped at the edge).
  register-api-key: {{ .Values.serviceCredentials.registerApiKey | quote }}
  {{- with .Values.serviceCredentials.atlasApiKey }}
  atlas-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.serviceCredentials.vocxApiKey }}
  vocx-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.serviceCredentials.pulseApiKey }}
  pulse-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.serviceCredentials.orchestratorApiKey }}
  orchestrator-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.serviceCredentials.registerAdminApiKey }}
  register-admin-api-key: {{ . | quote }}
  {{- end }}
  {{- if $needApi }}
  access-api-key: {{ .Values.accessApiKey.value | quote }}
  {{- end }}
  {{- if $needSecret }}
  gateway-secret: {{ .Values.gatewaySecret.value | quote }}
  {{- end }}
  {{- if .Values.internalSigningSecret }}
  internal-signing-secret: {{ .Values.internalSigningSecret | quote }}
  {{- end }}
