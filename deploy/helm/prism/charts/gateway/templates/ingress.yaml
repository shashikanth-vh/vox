{{- if .Values.ingress.enabled }}
# The platform's public entry point. Terminate TLS here (or at your LB) and keep
# the Register + Access cluster-internal — user traffic must pass the RBAC gate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          {{- if .Values.ingress.uiService }}
          # The ATLAS UI (static SPA) at /ui. The EXACT / route also goes to the UI
          # container, whose nginx answers `/ → 302 /ui/` — so users type just
          # https://<host>/ and land on the app. Every API path falls through to the
          # gateway below (Exact beats Prefix in ingress path matching).
          - path: /
            pathType: Exact
            backend:
              service:
                name: {{ .Values.ingress.uiService }}
                port:
                  number: 80
          - path: /ui
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.uiService }}
                port:
                  number: 80
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gateway.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
