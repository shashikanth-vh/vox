# The UI container's own server block — same layout as the edge (/ui prefix), so the
# edge's `location /ui/ { proxy_pass http://ui; }` forwards paths through unchanged.
server {
    listen 80;
    server_name _;
    server_tokens off;

    location = / { return 302 /ui/; }

    location /ui/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /ui/index.html;   # SPA deep links → index.html
    }

    location = /healthz { return 200 "ok"; add_header Content-Type text/plain; }
}
