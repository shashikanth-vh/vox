# The UI container's own server block — same layout as the edge (/ui prefix), so the
# edge's `location /ui/ { proxy_pass http://ui; }` forwards paths through unchanged.
server {
    listen 80;
    server_name _;
    server_tokens off;

    location = / { return 302 /ui/; }

    # Hashed build assets are immutable — cache them hard. Everything else (index.html
    # above all) must REVALIDATE on every load: with no Cache-Control at all, mobile
    # browsers cache index.html heuristically and keep serving a STALE app version for
    # weeks after a rebuild — the "blank screen on the phone" failure, because the old
    # bundle meets the new APIs (or its old chunks are gone) and dies with no message.
    location /ui/assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /ui/ {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";   # cached, but revalidated every load
        try_files $uri $uri/ /ui/index.html;   # SPA deep links → index.html
    }

    location = /healthz { return 200 "ok"; add_header Content-Type text/plain; }
}
