# PRISM services host: merge LAST, after base and prod-posture.
# Run Chitti and DocRAG in their own Compose project, on this host or another private host.
# Existing service credentials, database login, sign-in, and logging are inherited.
# Set SVC_CHITTI_KEY, INTERNAL_SIGNING_SECRET and DOCRAG_FRONT_KEY in .env to match .env.chitti;
# the base file already supplies them to Register and Gateway.
services:
  gateway:
    environment:
      GATEWAY_CHITTI_URL: "${GATEWAY_CHITTI_URL:?Set GATEWAY_CHITTI_URL}"
      GATEWAY_UPSTREAM_CA_FILE: /etc/prism/chitti-ca.crt
      GATEWAY_CHITTI_API_KEY: "${CHITTI_GATEWAY_KEY:?Set CHITTI_GATEWAY_KEY}"
      # DocRAG lives on the Chitti host too, behind the same edge and certificate.
      GATEWAY_DOCRAG_URL: "${GATEWAY_CHITTI_URL:?Set GATEWAY_CHITTI_URL}/docrag"
    volumes:
      - type: bind
        source: "${GATEWAY_CHITTI_CA_FILE:?Set GATEWAY_CHITTI_CA_FILE}"
        target: /etc/prism/chitti-ca.crt
        read_only: true
        bind:
          create_host_path: false
  orchestrator:
    # The CAM workbench reads documents through DocRAG on the Chitti host.
    environment:
      WORKFLOWS_DOCRAG_URL: "${GATEWAY_CHITTI_URL:?Set GATEWAY_CHITTI_URL}/docrag"
      WORKFLOWS_DOCRAG_CA_FILE: /etc/prism/chitti-ca.crt
      # Company 360 risk grades are computed by Chitti on the same host.
      WORKFLOWS_CHITTI_URL: "${GATEWAY_CHITTI_URL:?Set GATEWAY_CHITTI_URL}"
      WORKFLOWS_CHITTI_API_KEY: "${CHITTI_GATEWAY_KEY:?Set CHITTI_GATEWAY_KEY}"
    volumes:
      - type: bind
        source: "${GATEWAY_CHITTI_CA_FILE:?Set GATEWAY_CHITTI_CA_FILE}"
        target: /etc/prism/chitti-ca.crt
        read_only: true
        bind:
          create_host_path: false
  # The local DocRAG does not run on a split services host: its profile is never enabled.
  # (A stack switched to the split keeps an old local container running until
  # `docker compose stop docrag docrag-qdrant`.)
  docrag:
    profiles: ["docrag-local"]
  docrag-qdrant:
    profiles: ["docrag-local"]
  register:
    # Register is reachable only on the services Docker network, through Nginx remotely.
    ports: !reset []
