# Opt-in workflow plane — Temporal (server + its OWN datastore + UI) and the PRISM worker.
# Combine with the main stack so the worker can reach the Register on the same network:
#   docker compose -f deploy/compose/docker-compose.yml \
#                  -f deploy/compose/docker-compose.workflows.yml up --build
# Temporal Web UI: http://localhost:8088
services:
  # Temporal's persistence — deliberately SEPARATE from the Register's Postgres.
  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8088:8080"

  # PRISM worker — runs workflows/activities; activities write the Register via the SDK.
  workflows:
    build:
      context: ../..
      dockerfile: services/workflows/Dockerfile
    depends_on:
      - temporal
      - register
    environment:
      WORKFLOWS_TEMPORAL_ADDRESS: temporal:7233
      WORKFLOWS_TASK_QUEUE: prism-workflows
      WORKFLOWS_REGISTER_BASE_URL: http://register:8000
      WORKFLOWS_REGISTER_API_KEY: dev-local-key
      WORKFLOWS_REGISTER_TENANT: EVAM
      WORKFLOWS_LOG_JSON: "true"
    restart: unless-stopped

volumes:
  temporal-pgdata:
