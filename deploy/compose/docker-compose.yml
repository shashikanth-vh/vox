# PRISM local / demo stack — the WHOLE platform from one file, one command:
#
#   docker compose -f deploy/compose/docker-compose.yml up --build
#
# Brings up: NGINX edge + Gateway (REST-API service) + Register API + Access service
#          + PostgreSQL + MinIO (object storage) + Temporal (server + Web UI) + worker.
#
# All user traffic flows NGINX → gateway (binary RBAC gate) → register; the gateway
# resolves identity from the access service (cached). Admin user: admin@evamfinance.com.
#
# ONE Postgres container serves everything: the Register in the `register` database and
# Temporal in its own `temporal` / `temporal_visibility` databases (auto-created on first
# start) — one server, a database per concern, matching the Helm umbrella.
#
# Don't need the workflow plane? Name just the core services:
#   docker compose -f deploy/compose/docker-compose.yml up --build postgres minio register nginx
#
# If a previous run errors with "network ... not found" (stale containers from an older
# compose layout), reset once:  docker compose -f deploy/compose/docker-compose.yml down --remove-orphans
#
# Edge (NGINX): :8080 · Gateway: :8001 · Register: :8000 · Access: :8002 · VocX: :8003
# PULSE (news radar): :8004 · ATLAS (dashboard): :8005 · Orchestrator (workflows): :8006
# Document bytes go to MinIO (S3): API http://localhost:9000 · console http://localhost:9001
# Temporal Web UI: http://localhost:8088
# The API waits for a healthy DB, runs migrations, then serves with an EMPTY database.
# Load data on demand afterwards (see the register service's command comment below).
# The build context is the repo root (../..) so the image can bundle the shared
# packages/evam-backend-core alongside services/register.
services:
  # Shared PRISM database — the single Postgres every module will connect to.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism
      POSTGRES_DB: register
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First-init only: creates the Access service's database on the shared server.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d register"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Cap connections so pool_size * replicas stays well under the ceiling.
    command: ["postgres", "-c", "max_connections=200"]

  # Object storage for document bytes (S3-compatible). The Register stores references;
  # the actual PDFs/XLSX land here. Console UI: http://localhost:9001 (prism / prism-secret).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: prism
      MINIO_ROOT_PASSWORD: prism-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  register:
    build:
      # Context is the repo root so the build can install the shared
      # packages/evam-backend-core package alongside the Register.
      context: ../..
      dockerfile: services/register/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      REGISTER_ENVIRONMENT: dev
      REGISTER_DB_HOST: postgres
      REGISTER_DB_PORT: "5432"
      REGISTER_DB_USER: prism
      REGISTER_DB_PASSWORD: prism
      REGISTER_DB_NAME: register
      REGISTER_API_KEYS: "dev-local-key"
      REGISTER_WEB_CONCURRENCY: "4"
      REGISTER_DB_POOL_SIZE: "20"
      REGISTER_LOG_JSON: "true"
      # Object storage — put document bytes in MinIO (the Register auto-creates the bucket).
      REGISTER_STORAGE_BACKEND: "s3"
      REGISTER_S3_ENDPOINT_URL: "http://minio:9000"
      REGISTER_S3_PUBLIC_ENDPOINT_URL: "http://localhost:9000"  # browser-reachable for presigned URLs
      REGISTER_S3_BUCKET: "prism-documents"
      REGISTER_S3_ACCESS_KEY_ID: "prism"
      REGISTER_S3_SECRET_ACCESS_KEY: "prism-secret"
      REGISTER_S3_USE_SSL: "false"
      REGISTER_S3_PATH_STYLE: "true"
      # Trust identity headers only when stamped by the gateway (three-service RBAC).
      REGISTER_GATEWAY_SHARED_SECRET: "compose-gateway-secret"
    # Migrate, provision the tenant + reference dropdowns (NO business data), then serve.
    # This is "start fresh, but usable" — the API works immediately, the DB has no leads/
    # deals/entities. Use "migrate-serve" for a truly bare DB (you must then create a tenant
    # yourself before any tenant-scoped request works).
    # Load business data on demand once it's running:
    #   # upload your own spreadsheet (recommended):
    #   curl -H "X-API-Key: dev-local-key" -F "file=@<your-mis>.xlsx" \
    #        "http://localhost:8000/v1/import/atlas-xlsx?mode=replace"
    #   # or the synthetic prototype mock (shipped, for smoke tests only):
    #   docker compose exec register python -m app.seed
    command: ["migrate-bootstrap-serve"]
    ports:
      - "8000:8000"    # direct access for dev; production traffic goes through NGINX
    restart: unless-stopped

  # User management & access-control facts — users, roles, the admin-editable matrix.
  access:
    build:
      context: ../..
      dockerfile: services/access/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ACCESS_ENVIRONMENT: dev
      ACCESS_DB_HOST: postgres
      ACCESS_DB_PORT: "5432"
      ACCESS_DB_USER: prism
      ACCESS_DB_PASSWORD: prism
      ACCESS_DB_NAME: access
      ACCESS_API_KEYS: "dev-local-key"
      ACCESS_LOG_JSON: "true"
    # Migrate, seed (tenant + spec matrix + admin@evamfinance.com), serve.
    command: ["migrate-seed-serve"]
    ports:
      - "8002:8000"   # direct access for dev/governance UIs
    restart: unless-stopped

  # The REST-API service — cached binary RBAC gate + routing; the future home of
  # client-specific logic. All user traffic flows NGINX → gateway → register.
  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    depends_on:
      - register
      - access
    environment:
      GATEWAY_REGISTER_URL: "http://register:8000"
      GATEWAY_ACCESS_URL: "http://access:8000"
      GATEWAY_ACCESS_API_KEY: "dev-local-key"
      GATEWAY_GATEWAY_SHARED_SECRET: "compose-gateway-secret"
      GATEWAY_CACHE_TTL_S: "30"
      GATEWAY_LOG_JSON: "true"
    ports:
      - "8001:8000"   # direct gateway access for dev
    restart: unless-stopped

  # VocX — voice-based field touchpoint capture; writes interactions to the Register via
  # the SDK (source "VocX", capture-id idempotency = exactly-once). Individually deployable.
  vocx:
    build:
      context: ../..
      dockerfile: services/vocx/Dockerfile
    depends_on:
      - register
    environment:
      VOCX_REGISTER_BASE_URL: "http://register:8000"
      VOCX_REGISTER_API_KEY: "dev-local-key"
      VOCX_REGISTER_TENANT: "EVAM"
      # Company-name captures (no resolved subject id) run as durable workflows.
      VOCX_ORCHESTRATOR_URL: "http://orchestrator:8000"
      VOCX_LOG_JSON: "true"
    ports:
      - "8003:8000"   # direct capture endpoint for dev
    restart: unless-stopped

  # PULSE — the news / adverse-media radar. Fetches configured sources, matches items
  # against Register entities, files RED/AMBER/GREEN external-intelligence rows
  # (idempotent — a re-scan never duplicates). Trigger scans with POST /v1/scan
  # (cron / Temporal schedule); read the 7 AM digest from GET /v1/digest.
  pulse:
    build:
      context: ../..
      dockerfile: services/pulse/Dockerfile
    depends_on:
      - register
    environment:
      PULSE_REGISTER_BASE_URL: "http://register:8000"
      PULSE_REGISTER_API_KEY: "dev-local-key"
      PULSE_REGISTER_TENANT: "EVAM"
      # Dev default: the offline sample feed. Point at real feeds like:
      # PULSE_SOURCES: '[{"name":"google-news","kind":"rss","url":"https://news.google.com/rss/search?q=..."}]'
      PULSE_SOURCES: '[{"name": "sample", "kind": "sample"}]'
      PULSE_LOG_JSON: "true"
    ports:
      - "8004:8000"   # direct radar endpoint for dev
    restart: unless-stopped

  # ATLAS — the live management dashboard service (read-side BFF). Composes
  # /v1/dashboard, /v1/today and /v1/pipeline/{vertical} from the Register; gates each
  # view through the Access service's admin-editable view matrix.
  atlas:
    build:
      context: ../..
      dockerfile: services/atlas/Dockerfile
    depends_on:
      - register
      - access
    environment:
      ATLAS_REGISTER_BASE_URL: "http://register:8000"
      ATLAS_REGISTER_API_KEY: "dev-local-key"
      ATLAS_REGISTER_TENANT: "EVAM"
      ATLAS_ACCESS_URL: "http://access:8000"
      ATLAS_ACCESS_API_KEY: "dev-local-key"
      ATLAS_LOG_JSON: "true"
    ports:
      - "8005:8000"   # direct dashboard endpoint for dev
    restart: unless-stopped

  # Edge reverse proxy — TLS (prod), routing, load-balancing, edge rate-limit, correlation id.
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - gateway
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # Workflow plane — Temporal (server + UI) and the PRISM worker. The worker shares this
  # network, so its activities reach the Register at http://register:8000.
  #
  # Temporal persists to the SHARED postgres container above, in its OWN databases
  # (`temporal`, `temporal_visibility`) which auto-setup creates on first start — one
  # Postgres server, a database per concern (same layout as the Helm umbrella).
  # For production, point Temporal at a dedicated datastore instead: it is write-heavy.
  # ------------------------------------------------------------------------- #
  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: prism
      POSTGRES_PWD: prism
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "7233:7233"
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8088:8080"
    restart: unless-stopped

  # PRISM worker — runs workflows/activities; activities write the Register via the SDK.
  workflows:
    build:
      context: ../..
      dockerfile: services/workflows/Dockerfile
    depends_on:
      - temporal
      - register
    environment:
      WORKFLOWS_TEMPORAL_ADDRESS: temporal:7233
      WORKFLOWS_TASK_QUEUE: prism-workflows
      WORKFLOWS_REGISTER_BASE_URL: http://register:8000
      WORKFLOWS_REGISTER_API_KEY: dev-local-key
      WORKFLOWS_REGISTER_TENANT: EVAM
      WORKFLOWS_LOG_JSON: "true"
    restart: unless-stopped

  # Orchestrator API — the workflow plane's HTTP front door: starts workflows with
  # stable business ids (vox-{capture_id}, leadconv-{lead_id}), delivers approve/reject
  # signals, answers status queries. Same image as the worker, different command.
  orchestrator:
    build:
      context: ../..
      dockerfile: services/workflows/Dockerfile
    command: ["python", "-m", "app.api"]
    depends_on:
      - temporal
      - workflows
    environment:
      WORKFLOWS_TEMPORAL_ADDRESS: temporal:7233
      WORKFLOWS_TASK_QUEUE: prism-workflows
      WORKFLOWS_LOG_JSON: "true"
    ports:
      - "8006:8000"   # direct workflow-start endpoint for dev
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
