# PRISM local / demo stack — the WHOLE platform from one file, one command:
#
#   docker compose -f deploy/compose/docker-compose.yml up --build
#
# Brings up: NGINX edge + Gateway (REST-API service) + Register API + Access service
#          + PostgreSQL + MinIO (object storage) + Temporal (server + Web UI) + worker.
#
# All user traffic flows NGINX → gateway (binary RBAC gate) → register; the gateway
# resolves identity from the access service (cached). Admin user: admin@evamfinance.com.
#
# ONE Postgres container serves everything: the Register in the `register` database and
# Temporal in its own `temporal` / `temporal_visibility` databases (auto-created on first
# start) — one server, a database per concern, matching the Helm umbrella.
#
# Don't need the workflow plane? Name just the core services:
#   docker compose -f deploy/compose/docker-compose.yml up --build postgres minio register nginx
#
# If a previous run errors with "network ... not found" (stale containers from an older
# compose layout), reset once:  docker compose -f deploy/compose/docker-compose.yml down --remove-orphans
#
# Published ports — Edge (NGINX): :8443 https / :8080 http-redirect · Gateway: :8001 (dev)
# Register: :8000 (dev) · Access: :8002 (dev) · Dex: :5556 · Temporal UI: :8088
# ATLAS / PULSE / VocX / Orchestrator / UI publish NO host port: they are reachable only
# through the edge → gateway (https://<host>:8443/atlas, /pulse, /vocx, /orchestrator, /ui).
# Document bytes go to MinIO (S3): API http://localhost:9000 · console http://localhost:9001
# Temporal Web UI: http://localhost:8088
# The API waits for a healthy DB, runs migrations, then serves with an EMPTY database.
# Load data on demand afterwards (see the register service's command comment below).
# The build context is the repo root (../..) so the image can bundle the shared
# packages/evam-backend-core alongside services/register.
# Bounded container logs for EVERY service (the json-file driver grows without limit
# by default — one chatty or error-looping container can fill the VM disk over weeks
# and take the whole stack down, Postgres included). 10 MB x 5 files = 50 MB cap per
# container; `docker logs` behaves exactly as before within that window.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Shared PRISM database — the single Postgres every module will connect to.
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: "${PRISM_DB_PASSWORD:-prism}"
      POSTGRES_DB: register
    ports:
      # Dev/debug ports bind to LOCALHOST by default — on an internet-facing VM the
      # database must never answer the world (scanners find it within minutes).
      # Reach it remotely via an SSH tunnel, or set DEV_PORTS_BIND=0.0.0.0 in .env
      # on a trusted private network.
      - "${DEV_PORTS_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First-init only: creates the Access service's database on the shared server.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d register"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Cap connections so pool_size * replicas stays well under the ceiling.
    command: ["postgres", "-c", "max_connections=200"]
    restart: unless-stopped

  # Object storage for document bytes (S3-compatible). The Register stores references;
  # the actual PDFs/XLSX land here. Console UI: http://localhost:9001 (prism / prism-secret).
  minio:
    logging: *default-logging
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-prism}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-prism-secret}"
    ports:
      - "${DEV_PORTS_BIND:-127.0.0.1}:9000:9000"   # S3 API
      - "${DEV_PORTS_BIND:-127.0.0.1}:9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  register:
    logging: *default-logging
    build:
      # Context is the repo root so the build can install the shared
      # packages/evam-backend-core package alongside the Register.
      context: ../..
      dockerfile: services/register/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      REGISTER_ENVIRONMENT: dev
      REGISTER_DB_HOST: postgres
      REGISTER_DB_PORT: "5432"
      REGISTER_DB_USER: prism
      REGISTER_DB_PASSWORD: "${PRISM_DB_PASSWORD:-prism}"
      REGISTER_DB_NAME: register
      REGISTER_API_KEYS: "dev-local-key"
      # Named service principals — the production least-privilege trust model, demonstrated
      # locally: each service presents its OWN key and is bound to its allowlist. svc_gateway
      # carries no authority of its own (it only ever delegates a user). dev-local-key stays
      # as a generic direct-access key for the curl examples below.
      REGISTER_SERVICE_API_KEYS: "svc_atlas:${SVC_ATLAS_KEY:-compose-svc-atlas},svc_vox:${SVC_VOX_KEY:-compose-svc-vox},svc_pulse:${SVC_PULSE_KEY:-compose-svc-pulse},svc_workflows:${SVC_WORKFLOWS_KEY:-compose-svc-workflows},svc_gateway:${SVC_GATEWAY_KEY:-compose-svc-gateway},svc_advaya:${SVC_ADVAYA_KEY:-compose-svc-advaya}"
      # PRISM's workflow boundary is Advaya's ACCEPTANCE of the handover: the acknowledgement
      # path (/v1/internal/advaya-handoffs, svc_advaya lane) is live here so the E2E journey
      # exercises submit → accept/reject for real. Point the URL at the actual Advaya
      # endpoint when the integration goes live — locally it names the simulated peer.
      REGISTER_ADVAYA_INTEGRATION_ENABLED: "true"
      REGISTER_ADVAYA_INTEGRATION_URL: "${ADVAYA_URL:-https://advaya.simulated.local/api}"
      # LMS · SERVICING IS DEFERRED. The book ends at 'Disbursed': recording a
      # disbursement books it outright, no loan account is opened and the CP/CS checklist
      # stays with the origination desk. Flip to "true" when there is a servicing desk —
      # the booking gate, the account and the handover all come back for new tranches
      # (see docs/LENDING_WORKFLOW_DESIGN.md §0, including the account backfill).
      # A container captures its environment at CREATION: recreate, do not restart.
      REGISTER_LMS_ENABLED: "${LMS_ENABLED:-false}"
      REGISTER_WEB_CONCURRENCY: "4"
      REGISTER_DB_POOL_SIZE: "20"
      REGISTER_LOG_JSON: "true"
      # Object storage — put document bytes in MinIO (the Register auto-creates the bucket).
      REGISTER_STORAGE_BACKEND: "s3"
      REGISTER_S3_ENDPOINT_URL: "http://minio:9000"
      REGISTER_S3_PUBLIC_ENDPOINT_URL: "http://localhost:9000"  # browser-reachable for presigned URLs
      # Serve document bytes THROUGH the API rather than redirecting the browser to a
      # presigned MinIO URL. Without this, "View" in the Data Register 302s to
      # http://minio:9000/... — a docker-internal host the browser cannot resolve — and
      # the download dies silently. It also keeps the one-door posture: everything the
      # browser touches arrives on :8443, nothing internal.
      REGISTER_S3_STREAM_THROUGH_API: "true"
      REGISTER_S3_BUCKET: "prism-documents"
      REGISTER_S3_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-prism}"
      REGISTER_S3_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-prism-secret}"
      REGISTER_S3_USE_SSL: "false"
      REGISTER_S3_PATH_STYLE: "true"
      # Trust identity headers only when stamped by the gateway (three-service RBAC).
      REGISTER_GATEWAY_SHARED_SECRET: "compose-gateway-secret"
      # Production identity channel: verify the gateway's SIGNED internal context and
      # enforce the live grant it carries. Must equal the gateway's signing secret.
      REGISTER_INTERNAL_SIGNING_SECRET: "${INTERNAL_SIGNING_SECRET:-compose-internal-signing-secret}"
      # Verify an assignee's identity + role against the Access service before assigning.
      REGISTER_ACCESS_URL: "http://access:8000"
      REGISTER_ACCESS_API_KEY: "dev-local-key"
    # Migrate, provision the tenant + reference dropdowns (NO business data), then serve.
    # This is "start fresh, but usable" — the API works immediately, the DB has no leads/
    # deals/entities. Use "migrate-serve" for a truly bare DB (you must then create a tenant
    # yourself before any tenant-scoped request works).
    # Load business data on demand once it's running:
    #   # upload your own spreadsheet (recommended):
    #   curl -H "X-API-Key: dev-local-key" -F "file=@<your-mis>.xlsx" \
    #        "http://localhost:8000/v1/import/atlas-xlsx?mode=replace"
    #   # or the synthetic prototype mock (shipped, for smoke tests only):
    #   docker compose exec register python -m app.seed
    command: ["migrate-bootstrap-serve"]
    ports:
      - "${DEV_PORTS_BIND:-127.0.0.1}:8000:8000"    # direct access for dev; production traffic goes through NGINX
    restart: unless-stopped

  # User management & access-control facts — users, roles, the admin-editable matrix.
  access:
    logging: *default-logging
    build:
      context: ../..
      dockerfile: services/access/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ACCESS_ENVIRONMENT: dev
      ACCESS_DB_HOST: postgres
      ACCESS_DB_PORT: "5432"
      ACCESS_DB_USER: prism
      ACCESS_DB_PASSWORD: "${PRISM_DB_PASSWORD:-prism}"
      ACCESS_DB_NAME: access
      ACCESS_API_KEYS: "dev-local-key"
      ACCESS_LOG_JSON: "true"
    # Migrate, seed (tenant + spec matrix + admin@evamfinance.com), serve.
    command: ["migrate-seed-serve"]
    ports:
      - "${DEV_PORTS_BIND:-127.0.0.1}:8002:8000"   # direct access for dev/governance UIs
    restart: unless-stopped

  # The REST-API service — cached binary RBAC gate + routing; the future home of
  # client-specific logic. All user traffic flows NGINX → gateway → register.
  gateway:
    logging: *default-logging
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    depends_on:
      - register
      - access
    environment:
      GATEWAY_REGISTER_URL: "http://register:8000"
      GATEWAY_ACCESS_URL: "http://access:8000"
      GATEWAY_ACCESS_API_KEY: "dev-local-key"
      # The gateway fronts EVERY service and routes by path prefix. Each upstream URL makes
      # its `/{prefix}/...` routes reachable ONLY through the gateway; the gateway strips
      # the client's key and injects the per-upstream scoped credential below.
      GATEWAY_ATLAS_URL: "http://atlas:8000"
      GATEWAY_VOCX_URL: "http://vocx:8000"
      GATEWAY_PULSE_URL: "http://pulse:8000"
      GATEWAY_ORCHESTRATOR_URL: "http://orchestrator:8000"
      # Per-upstream service credential the gateway INJECTS (client key already stripped).
      # Each must equal that service's inbound key; svc_gateway carries no own authority.
      GATEWAY_REGISTER_API_KEY: "${SVC_GATEWAY_KEY:-compose-svc-gateway}"
      GATEWAY_ATLAS_API_KEY: "${SVC_ATLAS_KEY:-compose-svc-atlas}"
      GATEWAY_VOCX_API_KEY: "${VOCX_FRONT_KEY:-compose-vocx-front}"
      GATEWAY_PULSE_API_KEY: "${PULSE_API_KEYS:-compose-pulse-key}"
      GATEWAY_ORCHESTRATOR_API_KEY: "${WORKFLOWS_API_KEYS:-compose-workflows-key}"
      GATEWAY_GATEWAY_SHARED_SECRET: "compose-gateway-secret"
      # Mint the SIGNED internal context the Register verifies (production identity
      # channel). Must equal REGISTER_INTERNAL_SIGNING_SECRET.
      GATEWAY_INTERNAL_SIGNING_SECRET: "${INTERNAL_SIGNING_SECRET:-compose-internal-signing-secret}"
      GATEWAY_CACHE_TTL_S: "30"
      # Verified identity (SSO). Empty issuer = header-trust for the local walkthrough.
      # `docker compose --profile sso up` supplies these so bearer tokens are REQUIRED
      # and X-User-Email is ignored. Override the two ${...} to point at a real IdP.
      GATEWAY_OIDC_ISSUER: "${GATEWAY_OIDC_ISSUER:-}"
      GATEWAY_OIDC_AUDIENCE: "${GATEWAY_OIDC_AUDIENCE:-prism}"
      # Cross-origin UI support: origins allowed to call the APIs from the browser.
      # Leave EMPTY when the UI is served from deploy/ui/ (same origin, no CORS
      # needed). Set e.g. "https://ui.example.com,http://localhost:5173" for a UI
      # hosted elsewhere or a local dev server.
      GATEWAY_CORS_ORIGINS: "${GATEWAY_CORS_ORIGINS:-}"
      GATEWAY_REQUIRE_AUTH: "${GATEWAY_REQUIRE_AUTH:-false}"
      GATEWAY_LOG_JSON: "true"
    ports:
      - "${DEV_PORTS_BIND:-127.0.0.1}:8001:8000"   # direct gateway access for dev
    restart: unless-stopped

  # STT — the dedicated speech-to-text service (faster-whisper behind an
  # OpenAI-compatible endpoint). ONE shared model instance, baked into the image at
  # build time (HF_HUB_OFFLINE at runtime — no huggingface.co dependency when serving).
  # Internal-only: no host port, no gateway route; VocX is the consumer.
  stt:
    logging: *default-logging
    build:
      context: ../..
      dockerfile: services/stt/Dockerfile
      # medium is the production default: the small->medium step is the steep part
      # of the accuracy curve (names, accents, the translate path) at ~2x small's
      # decode time. Override with STT_MODEL_SIZE=large-v3 when a GPU box arrives.
      args: { STT_MODEL_SIZE: "${STT_MODEL_SIZE:-medium}" }
    environment:
      STT_API_KEYS: "${STT_API_KEY:-compose-stt-key}"
      STT_LOG_JSON: "true"
      # Decoder threads. Unset (0) lets CTranslate2 read the HOST's core count, which on
      # a small VM means more threads than cores and a decode that is slower than it
      # needs to be. Set this to the cores this container really gets. It changes speed
      # only — same model, same beam width, identical transcript.
      STT_CPU_THREADS: "${STT_CPU_THREADS:-0}"
    restart: unless-stopped

  # VocX — voice-based field touchpoint capture; writes interactions to the Register via
  # the SDK (source "VocX", capture-id idempotency = exactly-once). Individually deployable.
  vocx:
    logging: *default-logging
    build:
      context: ../..
      dockerfile: services/vocx/Dockerfile
    depends_on:
      - register
      - minio
      - stt
    environment:
      VOCX_REGISTER_BASE_URL: "http://register:8000"
      VOCX_REGISTER_API_KEY: "${SVC_VOX_KEY:-compose-svc-vox}"   # named svc_vox principal
      VOCX_REGISTER_TENANT: "EVAM"
      # VocX's OWN front door: only the gateway's injected key is accepted.
      VOCX_API_KEYS: "${VOCX_FRONT_KEY:-compose-vocx-front}"
      # Company-name captures (no resolved subject id) run as durable workflows.
      VOCX_ORCHESTRATOR_URL: "http://orchestrator:8000"
      VOCX_ORCHESTRATOR_API_KEY: "${WORKFLOWS_API_KEYS:-compose-workflows-key}"
      # Verify + re-mint the caller's signed context so the human authorizes Register writes.
      VOCX_INTERNAL_SIGNING_SECRET: "${INTERNAL_SIGNING_SECRET:-compose-internal-signing-secret}"
      # --- The voice pipeline (/vocx/api/vocx/*) ----------------------------------------
      # Claude extraction; empty = the offline stub (typed transcripts still work).
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Per-RM Google tokens, PKCE state, alias map, audio archive, Whisper model cache —
      # all on the persistent volume below. Losing it only means RMs reconnect Google
      # and the first transcription re-downloads the model.
      VOCX_TOKENS_DIR: "/data/vocx"
      # Google OAuth client secret, mounted read-only from deploy/vocx-secrets/
      # (git-ignored). File absent = Google integration off; register writes still work.
      VOCX_GOOGLE_CLIENT_SECRET_FILE: "/run/vocx-secrets/client_secret.json"
      # The OAuth redirect as the BROWSER reaches it — add this exact URL in Google
      # Cloud Console. Through the edge: https://<host>:8443/vocx/v1/auth/callback
      VOCX_OAUTH_REDIRECT_URI: "${VOCX_REDIRECT_URI:-https://localhost:8443/vocx/v1/auth/callback}"
      # Transcription is delegated to the dedicated STT service (backend "api"); the
      # in-process faster_whisper backend remains an opt-in fallback (vocx [stt] extra).
      # Pipeline concurrency: how many transcription+structuring jobs run at
      # once (size to the box; 3 suits the 8-vCPU host running the whole stack).
      # Takes at/over VOCX_LONG_TAKE_SECONDS ride the low-priority lane — at
      # most workers-1 of them concurrently, so short notes never starve.
      VOCX_PIPELINE_WORKERS: "${VOCX_PIPELINE_WORKERS:-3}"
      VOCX_LONG_TAKE_SECONDS: "${VOCX_LONG_TAKE_SECONDS:-1500}"
      VOCX_STT_BACKEND: "${VOCX_STT_BACKEND:-api}"
      VOCX_STT_API_URL: "http://stt:8000/v1/audio/transcriptions"
      VOCX_STT_API_KEY: "${STT_API_KEY:-compose-stt-key}"
      # Recorded audio: bytes in MinIO (same platform rule as Register documents), the
      # s3://bucket/key reference rides on the committed interaction. An S3 failure
      # degrades to the volume — a recording is never discarded. Retention: >0 becomes a
      # bucket lifecycle rule on the captures prefix.
      VOCX_S3_ENDPOINT_URL: "http://minio:9000"
      # Playback presigned URLs are opened by the BROWSER — sign against the published
      # MinIO port (swap localhost for the VM's IP when testing from another machine).
      VOCX_S3_PUBLIC_ENDPOINT_URL: "${VOCX_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}"
      VOCX_S3_BUCKET: "prism-vocx-captures"
      VOCX_S3_ACCESS_KEY_ID: "prism"
      VOCX_S3_SECRET_ACCESS_KEY: "prism-secret"
      VOCX_AUDIO_RETENTION_DAYS: "${VOCX_AUDIO_RETENTION_DAYS:-0}"
      # Intelligence features (Batch 1) — each independently switchable; defaults ON.
      VOCX_STT_PRIMING: "${VOCX_STT_PRIMING:-true}"
      VOCX_EXTRACT_GLOSSARY: "${VOCX_EXTRACT_GLOSSARY:-true}"
      VOCX_EXTRACT_FEW_SHOT: "${VOCX_EXTRACT_FEW_SHOT:-true}"
      VOCX_EXTRACT_STRUCTURED: "${VOCX_EXTRACT_STRUCTURED:-true}"
      # TEMPORARY dev test console at https://<host>:8443/vocx/v1/dev-ui (record →
      # preview → commit → reports in a browser). Dev default ON; the prod-posture
      # overlay pins it OFF. VOCX_DEV_UI=false here turns it off in dev too.
      VOCX_DEV_UI: "${VOCX_DEV_UI:-true}"
      VOCX_LOG_JSON: "true"
    volumes:
      - vocx_state:/data/vocx
      - ../vocx-secrets:/run/vocx-secrets:ro
    # No host port: VocX is reachable ONLY through the gateway (edge → /vocx/...), so the
    # single trust boundary is not bypassable even locally. `docker compose exec` for debug.
    restart: unless-stopped

  # PULSE — the news / adverse-media radar. Fetches configured sources, matches items
  # against Register entities, files RED/AMBER/GREEN external-intelligence rows
  # (idempotent — a re-scan never duplicates). Trigger scans with POST /v1/scan
  # (cron / Temporal schedule); read the 7 AM digest from GET /v1/digest.
  pulse:
    logging: *default-logging
    build:
      context: ../..
      dockerfile: services/pulse/Dockerfile
    depends_on:
      - register
    environment:
      PULSE_REGISTER_BASE_URL: "http://register:8000"
      PULSE_REGISTER_API_KEY: "${SVC_PULSE_KEY:-compose-svc-pulse}"   # named svc_pulse principal
      PULSE_REGISTER_TENANT: "EVAM"
      # PULSE's OWN front door: only the gateway's injected key is accepted. Must equal
      # GATEWAY_PULSE_API_KEY so gateway-routed /pulse/... calls authenticate.
      PULSE_API_KEYS: "${PULSE_API_KEYS:-compose-pulse-key}"
      # Dev default: the offline sample feed. Point at real feeds like:
      # PULSE_SOURCES: '[{"name":"google-news","kind":"rss","url":"https://news.google.com/rss/search?q=..."}]'
      PULSE_SOURCES: '[{"name": "sample", "kind": "sample"}]'
      PULSE_LOG_JSON: "true"
      # ---- News Radar ----------------------------------------------------
      # These were the ATLAS_* keys in the desk's atlas_config.json. They live in the
      # environment now — deploy/compose/.env is git-ignored, so the SMTP key never
      # reaches the repo or a zip, and the image carries no configuration.
      #
      # E-MAIL (optional): blank user/password = email OFF; search still works and every
      # email route says plainly that it is not configured. For Brevo/Gmail/any relay set
      # PULSE_SMTP_* in .env. Port 587 = STARTTLS, 465 = implicit SSL.
      PULSE_SMTP_HOST: "${PULSE_SMTP_HOST:-}"
      PULSE_SMTP_PORT: "${PULSE_SMTP_PORT:-587}"
      PULSE_SMTP_USER: "${PULSE_SMTP_USER:-}"
      PULSE_SMTP_PASS: "${PULSE_SMTP_PASS:-}"
      PULSE_SMTP_FROM: "${PULSE_SMTP_FROM:-}"
      PULSE_SMTP_FROM_NAME: "${PULSE_SMTP_FROM_NAME:-PRISM Notification}"
      # GDELT rate-limits hard; 1 = skip it cleanly (Google News + Bing still answer).
      PULSE_DISABLE_GDELT: "${PULSE_DISABLE_GDELT:-0}"
      # Recurring digests live on a volume so they survive a container replacement.
      PULSE_SCHEDULE_FILE: "/data/pulse/schedules.json"
      PULSE_SCHEDULER_ENABLED: "${PULSE_SCHEDULER_ENABLED:-true}"
    volumes:
      - pulsedata:/data/pulse
    # No host port: PULSE is reachable ONLY through the gateway (edge → /pulse/...).
    restart: unless-stopped

  # ATLAS — the live management dashboard service (read-side BFF). Composes
  # /v1/dashboard, /v1/today and /v1/pipeline/{vertical} from the Register; gates each
  # view through the Access service's admin-editable view matrix.
  atlas:
    logging: *default-logging
    build:
      context: ../..
      dockerfile: services/atlas/Dockerfile
    depends_on:
      - register
      - access
    environment:
      ATLAS_REGISTER_BASE_URL: "http://register:8000"
      ATLAS_REGISTER_API_KEY: "${SVC_ATLAS_KEY:-compose-svc-atlas}"   # named svc_atlas principal
      ATLAS_REGISTER_TENANT: "EVAM"
      ATLAS_ACCESS_URL: "http://access:8000"
      ATLAS_ACCESS_API_KEY: "dev-local-key"
      # Today-view attention thresholds (BN-02 "stage stuck"): amber/red days-in-stage.
      ATLAS_STAGE_AMBER_DAYS: "${ATLAS_STAGE_AMBER_DAYS:-14}"
      ATLAS_STAGE_RED_DAYS: "${ATLAS_STAGE_RED_DAYS:-30}"
      # Must match the Register's REGISTER_GATEWAY_SHARED_SECRET so the Register trusts
      # the user identity ATLAS forwards (otherwise user-attributed reads are rejected).
      ATLAS_GATEWAY_SHARED_SECRET: "compose-gateway-secret"
      # Mint the SIGNED internal context (GET-bound) the Register verifies — must equal
      # REGISTER_INTERNAL_SIGNING_SECRET; replaces plaintext X-User-* + shared secret.
      ATLAS_INTERNAL_SIGNING_SECRET: "${INTERNAL_SIGNING_SECRET:-compose-internal-signing-secret}"
      ATLAS_LOG_JSON: "true"
    # No host port: ATLAS is reachable ONLY through the gateway (edge → /atlas/...).
    restart: unless-stopped

  # Dev OIDC IdP (opt-in): `docker compose --profile sso up`. Turns the gateway's
  # verified-identity path on so you can exercise real bearer-token auth locally.
  # See docs/DEPLOYMENT.md for how to get a token and set the env that enables it.
  dex:
    logging: *default-logging
    image: ghcr.io/dexidp/dex:v2.41.1
    profiles: ["sso"]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
      # Durable token-signing keys + sessions (see storage: sqlite3 in the config) — a
      # dex restart no longer invalidates every already-issued sign-in.
      - dexdata:/var/dex
    ports:
      - "${DEV_PORTS_BIND:-127.0.0.1}:5556:5556"
    restart: unless-stopped

  # Edge reverse proxy — TLS (prod), routing, load-balancing, edge rate-limit, correlation id.
  # The public edge — terminates TLS. Generate the self-signed pair BEFORE first start:
  #     scripts/gen_dev_certs.sh
  # (nginx will not start without deploy/nginx/certs/tls.{crt,key}.) :8080 serves only a
  # 301 to HTTPS plus the health probes; real traffic goes to :8443.
  # The ATLAS UI, built FROM SOURCE (services/atlas/ui/ — the React app) into its own image.
  # No host port: the edge proxies /ui/ here, so the UI shares the ONE origin with
  # every API (no CORS, no browser-held secrets). Update: change services/atlas/ui/, then
  #   docker compose build ui && docker compose up -d ui
  ui:
    logging: *default-logging
    build:
      context: ../..
      dockerfile: deploy/ui-image/Dockerfile
      args:
        # Empty = dev posture (header trust, no sign-in screen grant). For SSO set
        # UI_DEX_URL to the PUBLIC edge origin, e.g. https://<host>:8443 — the edge
        # proxies /dex to Dex, so the SPA's token call stays same-origin.
        VITE_DEX_URL: "${UI_DEX_URL:-}"
        # Per-user Google sign-in: set GOOGLE_SSO_CLIENT_ID in deploy/compose/.env and
        # rebuild the ui image. Public value (client id, never a secret) — safe as a
        # build arg. Pair it with GATEWAY_OIDC_ISSUERS / WORKFLOWS_OIDC_ISSUERS so the
        # backend accepts accounts.google.com tokens — see docs/GOOGLE_SSO.md.
        VITE_GOOGLE_SSO_CLIENT_ID: "${GOOGLE_SSO_CLIENT_ID:-}"
        VITE_TENANT: "EVAM"
        # true = the app calls the REAL APIs (this platform). 'false' compiles the
        # standalone mock-data demo — never what you want behind this edge.
        VITE_USE_REAL_API: "${UI_USE_REAL_API:-true}"
    restart: unless-stopped

  nginx:
    logging: *default-logging
    image: nginx:1.27-alpine
    depends_on:
      - gateway
      - ui
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    ports:
      # Standard web ports, so users type just https://<domain>/ (the edge redirects
      # / → /ui/ and the app lands on Today). Override the host ports via .env if 80/443
      # are taken on this machine (EDGE_HTTP_PORT / EDGE_HTTPS_PORT).
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
      # Legacy mappings — existing :8080/:8443 bookmarks keep working.
      - "8080:80"
      - "8443:443"
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # Workflow plane — Temporal (server + UI) and the PRISM worker. The worker shares this
  # network, so its activities reach the Register at http://register:8000.
  #
  # Temporal persists to the SHARED postgres container above, in its OWN databases
  # (`temporal`, `temporal_visibility`) which auto-setup creates on first start — one
  # Postgres server, a database per concern (same layout as the Helm umbrella).
  # For production, point Temporal at a dedicated datastore instead: it is write-heavy.
  # ------------------------------------------------------------------------- #
  temporal:
    logging: *default-logging
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: prism
      POSTGRES_PWD: "${PRISM_DB_PASSWORD:-prism}"
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    # NO host port for the Temporal gRPC frontend (7233): a client that can reach it can
    # SIGNAL a workflow directly, bypassing the orchestrator's verified-approval path. The
    # worker + orchestrator reach it over the internal compose network only. In a real
    # deployment secure Temporal with mTLS + namespace authorization + a NetworkPolicy; the
    # Register still fails closed on a forged approval (the convert activity verifies a
    # signed, workflow-bound approval token), so a direct signal cannot convert.
    restart: unless-stopped

  # Temporal Web UI — a DEV convenience. It can also signal workflows, so it is exposed only
  # for local debugging; do NOT expose it (or run it) in production without auth in front.
  temporal-ui:
    logging: *default-logging
    image: temporalio/ui:2.31.2
    profiles: ["debug"]
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "${DEV_PORTS_BIND:-127.0.0.1}:8088:8080"
    restart: unless-stopped

  # PRISM worker — runs workflows/activities; activities write the Register via the SDK.
  workflows:
    logging: *default-logging
    build:
      context: ../..
      dockerfile: services/workflows/Dockerfile
    depends_on:
      - temporal
      - register
    environment:
      WORKFLOWS_TEMPORAL_ADDRESS: temporal:7233
      WORKFLOWS_TASK_QUEUE: prism-workflows
      WORKFLOWS_REGISTER_BASE_URL: http://register:8000
      # Named service principal (svc_workflows allowlist) — least privilege.
      WORKFLOWS_REGISTER_API_KEY: "${SVC_WORKFLOWS_KEY:-compose-svc-workflows}"
      WORKFLOWS_REGISTER_TENANT: EVAM
      # The CAM workbench engine. Set WORKFLOWS_ANTHROPIC_API_KEY in deploy/compose/.env
      # (never in this file) — without it the deterministic stub engine runs, which
      # exercises the whole lifecycle but drafts a placeholder instead of a real CAM.
      WORKFLOWS_CAM_ENGINE: "${WORKFLOWS_CAM_ENGINE:-anthropic:claude-haiku-4-5}"
      WORKFLOWS_ANTHROPIC_API_KEY: "${WORKFLOWS_ANTHROPIC_API_KEY:-}"
      # Re-mint the caller's signed context so a conversion writes as the human, not the key.
      WORKFLOWS_INTERNAL_SIGNING_SECRET: "${INTERNAL_SIGNING_SECRET:-compose-internal-signing-secret}"
      WORKFLOWS_LOG_JSON: "true"
      # --- Release-1 workflow foundation (all optional; safe defaults) ---
      # Ops events (SLA reminders / escalations / run-control) also POST here when set.
      WORKFLOWS_OPS_WEBHOOK_URL: "${WORKFLOWS_OPS_WEBHOOK_URL:-}"
      # base64url 32-byte key → AES-256-GCM encryption of all payloads at rest in Temporal.
      WORKFLOWS_PAYLOAD_ENCRYPTION_KEY: "${WORKFLOWS_PAYLOAD_ENCRYPTION_KEY:-}"
      # Per-run search attributes (register them on the Temporal server first — see README).
      WORKFLOWS_SEARCH_ATTRIBUTES_ENABLED: "${WORKFLOWS_SEARCH_ATTRIBUTES_ENABLED:-false}"
      # --- Increment 2: VOX + lead lifecycle (safe/off defaults) ---
      WORKFLOWS_VOX_CONFIRM_AMBIGUOUS_COMPANY: "${WORKFLOWS_VOX_CONFIRM_AMBIGUOUS_COMPANY:-false}"
      WORKFLOWS_VOX_CONFIRM_LEAD_SELECTION: "${WORKFLOWS_VOX_CONFIRM_LEAD_SELECTION:-false}"
      # Deployment-wide qualification checklist definitions (JSON list; empty = legacy flag).
      WORKFLOWS_QUALIFICATION_CHECKLIST: "${WORKFLOWS_QUALIFICATION_CHECKLIST:-}"
      # Prometheus scrape endpoint for the worker's SDK metrics ("" = off).
      WORKFLOWS_METRICS_BIND_ADDRESS: "${WORKFLOWS_METRICS_BIND_ADDRESS:-}"
      WORKFLOWS_WORKER_BUILD_ID: "${WORKFLOWS_WORKER_BUILD_ID:-}"
      # --- Increment 7: durable notifications (ON by default — the bell/Today inbox
      # is how a maker learns their request was returned or decided; external
      # channels below stay opt-in). Ops events that name recipients land as in-app
      # inbox rows in the Register (the notifier service drives channel delivery).
      WORKFLOWS_NOTIFICATIONS_ENABLED: "${WORKFLOWS_NOTIFICATIONS_ENABLED:-true}"
      WORKFLOWS_NOTIFY_CHANNELS: "${WORKFLOWS_NOTIFY_CHANNELS:-}"
      WORKFLOWS_SMTP_HOST: "${WORKFLOWS_SMTP_HOST:-}"
      WORKFLOWS_SMTP_PORT: "${WORKFLOWS_SMTP_PORT:-587}"
      WORKFLOWS_SMTP_FROM: "${WORKFLOWS_SMTP_FROM:-prism@evamfinance.com}"
      WORKFLOWS_SMS_WEBHOOK_URL: "${WORKFLOWS_SMS_WEBHOOK_URL:-}"
      WORKFLOWS_NOTIFY_WEBHOOK_URL: "${WORKFLOWS_NOTIFY_WEBHOOK_URL:-}"
    restart: unless-stopped

  # Notification delivery sweep (increment 7): claims pending email/sms/webhook
  # deliveries from the Register (lease + fencing token) and drives them to
  # delivered / retry (exponential backoff) / dead-letter. Safe to run always —
  # with notifications disabled there is simply nothing to claim.
  notifier:
    logging: *default-logging
    build:
      context: ../..
      dockerfile: services/workflows/Dockerfile
    command: ["python", "-m", "app.notifier"]
    depends_on:
      - register
    environment:
      WORKFLOWS_REGISTER_BASE_URL: http://register:8000
      WORKFLOWS_REGISTER_API_KEY: "${SVC_WORKFLOWS_KEY:-compose-svc-workflows}"
      WORKFLOWS_REGISTER_TENANT: EVAM
      WORKFLOWS_LOG_JSON: "true"
      WORKFLOWS_NOTIFY_CHANNELS: "${WORKFLOWS_NOTIFY_CHANNELS:-}"
      WORKFLOWS_SMTP_HOST: "${WORKFLOWS_SMTP_HOST:-}"
      WORKFLOWS_SMTP_PORT: "${WORKFLOWS_SMTP_PORT:-587}"
      WORKFLOWS_SMTP_FROM: "${WORKFLOWS_SMTP_FROM:-prism@evamfinance.com}"
      WORKFLOWS_SMTP_USERNAME: "${WORKFLOWS_SMTP_USERNAME:-}"
      WORKFLOWS_SMTP_PASSWORD: "${WORKFLOWS_SMTP_PASSWORD:-}"
      WORKFLOWS_SMS_WEBHOOK_URL: "${WORKFLOWS_SMS_WEBHOOK_URL:-}"
      WORKFLOWS_NOTIFY_WEBHOOK_URL: "${WORKFLOWS_NOTIFY_WEBHOOK_URL:-}"
      WORKFLOWS_NOTIFIER_INTERVAL_SECONDS: "${WORKFLOWS_NOTIFIER_INTERVAL_SECONDS:-30}"
      WORKFLOWS_NOTIFIER_MAX_ATTEMPTS: "${WORKFLOWS_NOTIFIER_MAX_ATTEMPTS:-8}"
    restart: unless-stopped

  # Orchestrator API — the workflow plane's HTTP front door: starts workflows with
  # stable business ids (vox-{capture_id}, leadconv-{lead_id}), delivers approve/reject
  # signals, answers status queries. Same image as the worker, different command.
  orchestrator:
    logging: *default-logging
    build:
      context: ../..
      dockerfile: services/workflows/Dockerfile
    command: ["python", "-m", "app.api"]
    depends_on:
      - temporal
      - workflows
      - access
    environment:
      WORKFLOWS_TEMPORAL_ADDRESS: temporal:7233
      WORKFLOWS_TASK_QUEUE: prism-workflows
      WORKFLOWS_LOG_JSON: "true"
      # --- Release-1 workflow foundation (all optional; safe defaults) ---
      # Ops events (SLA reminders / escalations / run-control) also POST here when set.
      WORKFLOWS_OPS_WEBHOOK_URL: "${WORKFLOWS_OPS_WEBHOOK_URL:-}"
      # base64url 32-byte key → AES-256-GCM encryption of all payloads at rest in Temporal.
      WORKFLOWS_PAYLOAD_ENCRYPTION_KEY: "${WORKFLOWS_PAYLOAD_ENCRYPTION_KEY:-}"
      # Per-run search attributes (register them on the Temporal server first — see README).
      WORKFLOWS_SEARCH_ATTRIBUTES_ENABLED: "${WORKFLOWS_SEARCH_ATTRIBUTES_ENABLED:-false}"
      # --- Increment 2: VOX + lead lifecycle (safe/off defaults) ---
      WORKFLOWS_VOX_CONFIRM_AMBIGUOUS_COMPANY: "${WORKFLOWS_VOX_CONFIRM_AMBIGUOUS_COMPANY:-false}"
      WORKFLOWS_VOX_CONFIRM_LEAD_SELECTION: "${WORKFLOWS_VOX_CONFIRM_LEAD_SELECTION:-false}"
      # Deployment-wide qualification checklist definitions (JSON list; empty = legacy flag).
      WORKFLOWS_QUALIFICATION_CHECKLIST: "${WORKFLOWS_QUALIFICATION_CHECKLIST:-}"
      # The orchestrator calls the Register directly for durable decision records + the handover
      # approval (server-minted delegated context), so it needs the Register's in-network URL.
      WORKFLOWS_REGISTER_BASE_URL: http://register:8000
      # The CAM workbench engine lives HERE (the orchestrator serves /v1/cam/*), not on
      # the worker — the key must reach THIS container or the workbench drafts with the
      # offline stub while `docker compose exec workflows env` swears the key is set.
      WORKFLOWS_CAM_ENGINE: "${WORKFLOWS_CAM_ENGINE:-anthropic:claude-haiku-4-5}"
      WORKFLOWS_ANTHROPIC_API_KEY: "${WORKFLOWS_ANTHROPIC_API_KEY:-}"
      # Machine callers (VocX, UIs) must present this key — no longer an open endpoint.
      WORKFLOWS_API_KEYS: "${WORKFLOWS_API_KEYS:-compose-workflows-key}"
      WORKFLOWS_REGISTER_API_KEY: "${SVC_WORKFLOWS_KEY:-compose-svc-workflows}"
      # Verify the gateway's signed caller context and thread the human into the workflow.
      WORKFLOWS_INTERNAL_SIGNING_SECRET: "${INTERNAL_SIGNING_SECRET:-compose-internal-signing-secret}"
      # WHO is notified when a run parks awaiting a governance decision (committee /
      # conversion / syndication / closure): comma-separated emails, e.g. the Credit
      # Head + checkers. Empty = the requester only. Threaded into each run's input
      # here (the orchestrator builds workflow inputs; workers never read settings).
      WORKFLOWS_APPROVER_NOTIFY: "${WORKFLOWS_APPROVER_NOTIFY:-}"
      # Approver role checks resolve against the Access service.
      WORKFLOWS_ACCESS_URL: "http://access:8000"
      WORKFLOWS_ACCESS_API_KEY: "dev-local-key"
      # Verified-identity approvals. Empty issuer = dev (trusts 'by'); set REQUIRE_AUTH
      # true + an issuer (the `sso` profile provides Dex) to make identity mandatory.
      WORKFLOWS_OIDC_ISSUER: "${GATEWAY_OIDC_ISSUER:-}"
      WORKFLOWS_OIDC_AUDIENCE: "${GATEWAY_OIDC_AUDIENCE:-prism}"
      WORKFLOWS_REQUIRE_AUTH: "${WORKFLOWS_REQUIRE_AUTH:-false}"
      # --- Increment 7: first-class calendar events + the document-expiry monitor ---
      # VOX captures with a next-meeting date create a Register calendar event (per-run
      # idempotent) instead of only the meta.calendar hand-off note.
      WORKFLOWS_CALENDAR_EVENTS_ENABLED: "${WORKFLOWS_CALENDAR_EVENTS_ENABLED:-false}"
      # Defaults for POST /v1/internal/monitors/document-expiry (per-tenant monitor).
      WORKFLOWS_DOC_EXPIRY_INTERVAL_HOURS: "${WORKFLOWS_DOC_EXPIRY_INTERVAL_HOURS:-24}"
      WORKFLOWS_DOC_EXPIRY_WARN_DAYS: "${WORKFLOWS_DOC_EXPIRY_WARN_DAYS:-7}"
      # --- Increment 8: covenant monitor + EWS case SLAs ---
      WORKFLOWS_COVENANT_INTERVAL_HOURS: "${WORKFLOWS_COVENANT_INTERVAL_HOURS:-24}"
      WORKFLOWS_COVENANT_HORIZON_DAYS: "${WORKFLOWS_COVENANT_HORIZON_DAYS:-30}"
      WORKFLOWS_EWS_ASSIGN_SLA_HOURS: "${WORKFLOWS_EWS_ASSIGN_SLA_HOURS:-24}"
      WORKFLOWS_EWS_INVESTIGATION_SLA_HOURS: "${WORKFLOWS_EWS_INVESTIGATION_SLA_HOURS:-72}"
      WORKFLOWS_EWS_ESCALATED_REMINDER_HOURS: "${WORKFLOWS_EWS_ESCALATED_REMINDER_HOURS:-48}"
    # No host port: the orchestrator API is reachable ONLY through the gateway
    # (edge → /orchestrator/...), so workflow starts pass the RBAC gate first.
    restart: unless-stopped

  # ---- Nightly database backups (opt-in) ---------------------------------- #
  # A tiny sidecar that pg_dumps EVERY database on the shared server once a day into
  # its own volume, keeping PGBACKUP_KEEP days (default 14). Enable with
  # `--profile backup`; restore with psql/pg_restore from /backups (see
  # docs/PRODUCTION_DEPLOYMENT.md → "Backups & restore").
  pgbackup:
    logging: *default-logging
    image: postgres:16-alpine
    profiles: ["backup"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: prism
      PGPASSWORD: "${PRISM_DB_PASSWORD:-prism}"
      KEEP_DAYS: "${PGBACKUP_KEEP:-14}"
    volumes:
      - pgbackups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          echo "[pgbackup] $$ts dumping all databases..."
          pg_dumpall --clean --if-exists | gzip > "/backups/prism-$$ts.sql.gz"             && echo "[pgbackup] wrote /backups/prism-$$ts.sql.gz"             || echo "[pgbackup] DUMP FAILED"
          find /backups -name 'prism-*.sql.gz' -mtime "+$$KEEP_DAYS" -delete
          sleep 86400
        done
    restart: unless-stopped

  # The document store's nightly counterpart to pgbackup: the MinIO volume tarred into
  # the SAME backups volume, on the same cadence and retention, so a disaster restore
  # has the objects the freshly-restored rows reference. MinIO renames objects into
  # place atomically, so a live tar sees each object whole (old or new, never half).
  filebackup:
    logging: *default-logging
    image: alpine:3.20
    profiles: ["backup"]
    depends_on:
      - minio
    environment:
      KEEP_DAYS: "${PGBACKUP_KEEP:-14}"
    volumes:
      - miniodata:/data:ro
      - pgbackups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          echo "[filebackup] $$ts archiving the document store..."
          tar -czf "/backups/minio-$$ts.tar.gz" -C /data .             && echo "[filebackup] wrote /backups/minio-$$ts.tar.gz"             || echo "[filebackup] ARCHIVE FAILED"
          find /backups -name 'minio-*.tar.gz' -mtime "+$$KEEP_DAYS" -delete
          sleep 86400
        done
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  vocx_state:
  dexdata:
  pgbackups:
  # Recurring news digests. Small, but losing it silently stops every scheduled
  # report — the desk would only notice by the absence of an email.
  pulsedata:
